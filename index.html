    <script>
    /* ===== COS 加速：静态大文件走腾讯云 COS（国内节点），失败自动回退本站地址 =====
       ycAsset('./assets/xxx.js') 返回 COS 完整地址；COS 不可用时各加载点回退 './' 原地址。 */
    window.__YC_CDN = 'https://yichenggongkao-1538963435.cos.ap-beijing.myqcloud.com';
    window.ycAsset = function(p){
      try{ return window.__YC_CDN + '/' + String(p).replace(/^\.\//,''); }catch(e){ return p; }
    };
    /* ===== 修改点②：新增 ycFetch 请求兜底 + 题库失败占位 =====
       3 秒超时（AbortController）+ 失败自动重试 1 次（间隔 600ms）；两次都失败时回调 onFail，
       由调用方渲染「加载失败，点击重试」占位，禁止任何自动循环 reload。
       修改点（P0-0b 并发兜底）：单次超时 8000→3000ms、重试延迟 1200→600ms，
       索引最坏耗时从 17.2s 降到约 6.6s（仅影响后台版本校验，不影响首屏）。 */
    window.ycFetch = function(url, opts, onFail){
      opts = opts || {};
      function once(){
        var ctl = new AbortController();
        var timer = setTimeout(function(){ ctl.abort(); }, 3000);
        var o = {};
        for(var k in opts){ o[k] = opts[k]; }
        o.signal = ctl.signal;
        return fetch(url, o).then(function(r){
          clearTimeout(timer);
          if(!r.ok){ throw new Error('HTTP ' + r.status); }
          return r;
        }, function(err){
          clearTimeout(timer);
          throw err;
        });
      }
      return once().catch(function(e1){
        return new Promise(function(resolve, reject){
          setTimeout(function(){
            once().then(resolve, function(e2){
              try{ onFail && onFail(e2); }catch(_){}
              reject(e2);
            });
          }, 600);
        });
      });
    };
    /* 题库索引两次都失败时的占位块：用户点击才重试，不自动循环 */
    window.__ycBankFail = function(retry){
      if(document.getElementById('yc-bank-fail')) return;
      var d = document.createElement('div');
      d.id = 'yc-bank-fail';
      d.style.cssText = 'position:fixed;inset:0;z-index:9998;background:#FAF8F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px';
      d.innerHTML = '<div style="font-size:15px;color:#4A463F">题库加载失败，请检查网络后重试</div>'
        + '<button id="yc-bank-retry" style="padding:10px 28px;border:none;border-radius:999px;background:#DC2626;color:#fff;font-size:15px;font-weight:600">点击重试</button>';
      document.body.appendChild(d);
      document.getElementById('yc-bank-retry').addEventListener('click', function(){
        try{ sessionStorage.setItem('yc-skip-cdn','1'); }catch(e){}
        d.parentNode && d.parentNode.removeChild(d);
        retry && retry();
      });
    };
    </script>
    <script>
    (function(){
      /* 版本统一来源：assets/qbank-index.json 的 v 字段；禁止在页面多处手写版本号 */
      try{
        var K="yc-page-ver";
        var FALLBACK="tt81"; /* 兜底：仅首次访问且索引请求失败时使用；随线上 qbank-index.json 的 v 同步维护（修改点：tt79→tt81 对齐当前线上版本，避免新用户首屏后触发多余 replace 刷新） */
        function fixIcons(v){
          try{
            var i1=document.querySelector('link[rel="icon"]'),i2=document.querySelector('link[rel="apple-touch-icon"]'),og=document.querySelector('meta[property="og:image"]');
            [i1,i2].forEach(function(el){ if(el&&el.href) el.href=el.href.replace(/\?v=[^&"]*/,'?v='+v); });
            if(og&&og.content) og.content=og.content.replace(/\?v=[^&"]*/,'?v='+v);
          }catch(e){}
        }
        function applyV(v){
          try{
            var nt=document.createElement('script');
            nt.src='./assets/yc-notify.js?v='+v;
            /* 修改点（P0-0c）：yc-notify 也补 COS 失败回退本站，与主JS/CSS/base.js/yc-enhance 对齐 */
            nt.onerror=function(){ try{ var n2=document.createElement('script'); n2.src='./assets/yc-notify.js?v='+v; document.head.appendChild(n2); }catch(e){} };
            document.head.appendChild(nt);
            var sc=document.createElement('script');
            sc.type='module';sc.crossOrigin='';
            sc.src=(window.ycAsset&&!ycSkipCdn()?window.ycAsset('./assets/index-b34.js'):'./assets/index-b34.js')+'?v='+v;
            sc.onerror=function(){ try{ var s2=document.createElement('script'); s2.type='module'; s2.crossOrigin=''; s2.src='./assets/index-b34.js?v='+v; document.head.appendChild(s2); }catch(e){} };
            document.head.appendChild(sc);
            var lk=document.createElement('link');
            lk.rel='stylesheet';lk.crossOrigin='';
            lk.href=(window.ycAsset&&!ycSkipCdn()?window.ycAsset('./assets/index-C2M5URtc.css'):'./assets/index-C2M5URtc.css')+'?v='+v;
            lk.onerror=function(){ try{ var l2=document.createElement('link'); l2.rel='stylesheet'; l2.crossOrigin=''; l2.href='./assets/index-C2M5URtc.css?v='+v; document.head.appendChild(l2); }catch(e){} };
            document.head.appendChild(lk);
            if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',function(){ fixIcons(v); }); }
            else { fixIcons(v); }
          }catch(e){}
        }
        var cached=localStorage.getItem(K);
        /* 修改点（P0-0 首屏解耦）：首屏立即用 cached||FALLBACK 起主JS，不再串行等待索引返回；
           索引请求保留但降级为后台异步校验：拿到 idx.v 后仅在与当前使用版本不一致时才 replace，一致则什么都不做。
           任何用户首屏主JS发起时间 < 500ms（本脚本为头部同步脚本，执行即发起）。 */
        var usedV=cached||FALLBACK;
        /* 修改点（P0-0c 降级预案）：yc-lite=1 时进入精简模式——首屏不自动加载主JS/增强脚本，
           只渲染静态精简首页，点「开始刷题」再按需拉主JS；开关入口在失败遮罩与精简页内。 */
        var lite=false; try{ lite=localStorage.getItem('yc-lite')==='1'; }catch(eL){}
        window.__ycLite=!!lite;
        window.__ycUsedV=usedV;
        window.__ycApplyV=applyV;
        if(!lite) applyV(usedV);
        /* 修改点：索引请求改为 CDN 与本站并行赛跑（谁先返回用谁），替代原「CDN 失败再试本站」串行回退；
           本站请求经 SW 缓存优先，命中秒回。用户点过「重试」后本会话跳过 CDN 直连本站（yc-skip-cdn）。 */
        function ycSkipCdn(){ try{ return sessionStorage.getItem('yc-skip-cdn')==='1'; }catch(e){ return false; } }
        function ycIdxUrls(){
          var u=(window.ycAsset?window.ycAsset('./assets/qbank-index.json'):'./assets/qbank-index.json');
          if(ycSkipCdn()||u.indexOf(location.origin)===0) return [u];
          return [u,'./assets/qbank-index.json'];
        }
        function ycRaceIdx(urls){
          return new Promise(function(resolve,reject){
            var done=false,fails=0;
            urls.forEach(function(u){
              window.ycFetch(u,{cache:"no-store"}).then(function(r){
                if(done){ return; }
                done=true;resolve(r);
              }).catch(function(){ fails++; if(fails===urls.length&&!done){ reject(new Error('all-index-src-fail')); } });
            });
          });
        }
        ycRaceIdx(ycIdxUrls()).then(function(r){return r.json()}).then(function(idx){
          window.__ycIdxState='ok';
          var v=idx&&idx.v?String(idx.v):'';
          if(!v) return;
          if(v===usedV) return; /* 版本一致：后台校验通过，什么都不做 */
          /* 版本不一致：先写新版本号、后执行 replace；写入失败（隐私模式/配额满）try/catch 兜底并放弃刷新，杜绝无限刷新循环 */
          try{ localStorage.setItem(K,v); }catch(eW){ return; }
          location.replace(location.pathname+"?ycv="+v+"_"+Date.now());
        }).catch(function(){ window.__ycIdxState='fail'; }).then(function(){
          /* 修改点（P1 bug②）：索引请求 finally 触发一次失败判定（settle 带防重入，见骨架屏脚本） */
          try{ if(window.__ycBootSettle) window.__ycBootSettle(); else window.__ycIdxSettlePending=true; }catch(e){}
        });
      }catch(e){}
    })();
    </script>

        d.style.cssText="position:fixed;inset:0;z-index:9999;background:#FAF8F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px";

  function replaceIcons(){
    document.querySelectorAll("[data-testid]").forEach(function(el){
      var tid = el.getAttribute("data-testid");
      var ic = ICONS[tid];
      if (!ic) return;
      el.querySelectorAll(".material-icons").forEach(function(mi){
        if (mi.dataset.ycDone) return;
        var wrap = document.createElement("span");
        wrap.innerHTML = ic;
        var s = wrap.firstChild;
        s.dataset.ycDone = "1";
        mi.replaceWith(s);
      });
    });
    /* 全局兜底：凡是写着英文图标名的（字体没加载就会露出来），一律换成内嵌图标 */
    document.querySelectorAll(".material-icons").forEach(function(mi){
      if (mi.dataset.ycDone) return;
      var name = (mi.textContent || "").trim();
      var ic = LIG[name];
      if (!ic) return;
      var wrap = document.createElement("span");
      wrap.innerHTML = ic;
      var s = wrap.firstChild;
      s.dataset.ycDone = "1";
      mi.replaceWith(s);
    });
  }

  function refreshChips(){
    var s = getState();
    var t = document.getElementById("ycChipDirText");
    var chip = document.getElementById("ycChipDir");
    if (s.province && s.examType) {
      t.textContent = s.province + " · " + s.examType;
      chip.classList.add("yc-chip-done");
    } else if (s.province) {
      t.textContent = s.province;
      chip.classList.add("yc-chip-done");

      chip.classList.remove("yc-chip-done");

  var pick = {province: null, examType: null};
  function openSheet(){
    var s = getState();
    pick = {province: s.province || null, examType: s.examType || null};
    var pv = PROVINCES.map(function(p){
      return '<div class="yc-opt' + (pick.province === p ? " on" : "") + '" data-pv="' + p + '">' + p + '</div>';
    }).join("");
    var tp = TYPES.map(function(t){
      return '<div class="yc-opt' + (pick.examType === t ? " on" : "") + '" data-tp="' + t + '">' + t + '</div>';
    }).join("");
    sheet.innerHTML =
      '<h3>选择你的备考方向</h3><div class="yc-tip">选好后为你生成针对性复习建议，可随时修改</div>' +
      '<div class="yc-sec"><div class="yc-sec-t">目标省份</div><div class="yc-grid">' + pv + '</div></div>' +
      '<div class="yc-sec"><div class="yc-sec-t">考试类型</div><div class="yc-types">' + tp + '</div></div>' +
      '<button class="yc-save" id="ycSave" ' + ((pick.province && pick.examType) ? "" : "disabled") + '>保存并查看备考建议</button>';
    sheet.querySelectorAll("[data-pv]").forEach(function(el){
      el.addEventListener("click", function(){
        pick.province = el.dataset.pv;
        sheet.querySelectorAll("[data-pv]").forEach(function(e){ e.classList.remove("on"); });
        el.classList.add("on"); syncSave();
      });
    });
    sheet.querySelectorAll("[data-tp]").forEach(function(el){
      el.addEventListener("click", function(){
        pick.examType = el.dataset.tp;
        sheet.querySelectorAll("[data-tp]").forEach(function(e){ e.classList.remove("on"); });
        el.classList.add("on"); syncSave();
      });
    });
    function syncSave(){
      document.getElementById("ycSave").disabled = !(pick.province && pick.examType);
    }
    sheet.querySelector("#ycSave").addEventListener("click", function(){
      saveState(pick); refreshChips(); closeAll();
      setTimeout(openAdvice, 220);
    });
    mask.classList.add("on"); sheet.classList.add("on");
  }

  function loadLiveNews(){
    var el = document.getElementById('yc-bb-live');

    var show = function(news){
      if (!news || !news.length) { el.textContent = fallback; return; }
      var n = news[0];
      var sameDay = news.slice(1).filter(function(x){ return x.d === n.d; });
      var t = n.t;
      for (var i = 0; i < sameDay.length; i++) t += '＋' + sameDay[i].t;
      el.textContent = '实时通知：刚上新——' + t + '，「' + n.m + '」模块可看';
    };
    var fail = function(){ if (el.textContent === '实时通知：加载中…') el.textContent = fallback; };
    try {
      fetch('videos.html?t=' + Date.now(), { cache: 'no-store' })

          var m = html.match(/var YCGK_NEWS\s*=\s*(\[[\s\S]*?\]);/);

  /* ---------- 更新通知订阅（Web Push） ---------- */
  var PUSH_URL = 'https://1538963435-chrm4ii4l7.ap-guangzhou.tencentscf.com';
  var PUSH_PUB = 'BALPdqFpuTBUSBBBcJMhaDRI9-l__09piSbODt8wRnF9DYOMtO_u4TdhqPGDFdhF1Ye760DfU15NV-RIAuMhcck';
  function ycUrlB64ToU8(b64){
    var pad = '='.repeat((4 - b64.length % 4) % 4);
    var b = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
    var raw = atob(b);
    var u = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i);
    return u;
  }
  function initBellBtn(){
    var btn = document.getElementById('yc-bb-bell');

    try { if (localStorage.getItem('ycgk.push.on') === '1') { btn.textContent = '✅ 已开启，上新内容会通知你'; btn.disabled = true; return; } } catch(e){}
    btn.addEventListener('click', function(){ ycSubscribePush(btn); });
  }
  function ycSubscribePush(btn){
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    if (isIOS && !standalone) { btn.textContent = '📱 苹果手机先「添加到主屏幕」，从图标打开后再点开启'; return; }
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !window.Notification) {
      btn.textContent = '⚠️ 当前浏览器不支持通知，建议用手机自带浏览器打开'; return;
    }
    btn.disabled = true; btn.textContent = '⏳ 开启中…';
    Notification.requestPermission().then(function(p){
      if (p !== 'granted') { btn.disabled = false; btn.textContent = '🔔 需要允许通知，再点一次'; return; }
      navigator.serviceWorker.ready.then(function(reg){
        return reg.pushManager.getSubscription().then(function(ex){
          return ex || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: ycUrlB64ToU8(PUSH_PUB) });
        });
      }).then(function(sub){
        return fetch(PUSH_URL + '/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
      }).then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
        .then(function(j){ if (!j.ok) throw new Error('api'); btn.textContent = '✅ 已开启，上新内容会通知你'; try { localStorage.setItem('ycgk.push.on', '1'); } catch(e){} })
        .catch(function(){ btn.disabled = false; btn.textContent = '🔔 没开成，点此重试'; });
    });
  }

<script>
/* usage stats beacon v3: 在线心跳 / 24小时活跃 / 平板识别 / 刷题深度 */
(function(){
  try{
    var B='https://visitor-badge.laobi.icu/badge?page_id=';
    function hit(id){ try{ new Image().src=B+id+'&r='+Date.now(); }catch(e){} }
    function pad(n){ return ('0'+n).slice(-2); }
    /* 平板识别：每台设备只记一次（iPad 同时计入 iOS，平板为补充标签） */
    try{
      if(!localStorage.getItem('ycgk.devtab')){
        localStorage.setItem('ycgk.devtab','1');
        var ua=navigator.userAgent||'';
        if(/iPad|Tablet|PlayBook|Silk|SM-T\d|SM-P\d|Tab\d|MatePad|Pad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) hit('ycgk.dev.tablet');
      }
    }catch(e){}
    /* 24小时活跃分布：每次打开记入所在小时 */
    try{ hit('ycgk.hr.'+pad(new Date().getHours())); }catch(e){}
    /* 在线心跳：打开时及每 60 秒各记一次所在分钟 */
    try{
      var lastHb='';
      function hb(){ var d=new Date(),s=''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes()); if(s!==lastHb){ lastHb=s; hit('ycgk.hb.'+s); } }
      hb(); setInterval(hb,60000);
    }catch(e){}
    /* 刷题深度：累计作答跨过 10/50/100/500/1000/5000 题各记一次（匿名） */
    try{
      var TH=[10,50,100,500,1000,5000];
      function ansTotal(){
        var t=0;
        try{
          var s=JSON.parse(localStorage.getItem('yicheng-gk-study-v1')||'{}');
          var mp=s.moduleProgress||{};
          Object.keys(mp).forEach(function(k){ t+=(mp[k].answered||0); });
        }catch(e){}
        return t;
      }
      setInterval(function(){
        try{
          var a=ansTotal();
          for(var i=0;i<TH.length;i++){

          }
        }catch(e){}
      },8000);
      /* 刷题段位：每跨过 100 题记一次 ycgk.lvl.<n>（匿名，供排行榜） */
      var lastLvl=-1;
      setInterval(function(){
        try{
          var a=ansTotal(), n=Math.min(49,Math.floor(a/100));
          if(n>lastLvl){
            for(var i=(lastLvl<0?0:lastLvl+1);i<=n;i++){
              if(!localStorage.getItem('ycgk.lvl.'+i)){ localStorage.setItem('ycgk.lvl.'+i,'1'); hit('ycgk.lvl.'+i); }

<script>
/* live stats v1: 设备指纹 / 型号 / 新增回访 / 在线心跳 / 安装 → textdb 聚合池
   数据契约 key=ycgk-live-v1，供数据看板实时读取。纯前端，无后端依赖。 */
(function(){
  var KEY='ycgk-live-v1';
  var GETS=['https://textdb.dev/api/data/','https://textdb.online/'];
  var PUTS=[
    function(k,v,cb){fetch('https://textdb.online/update/?key='+encodeURIComponent(k)+'&value='+encodeURIComponent(v)).then(function(){cb(true)},function(){cb(false)})},
    function(k,v,cb){fetch('https://textdb.dev/api/data/'+k,{method:'POST',headers:{'Content-Type':'text/plain'},body:v}).then(function(r){cb(!!r.ok)},function(){cb(false)})}
  ];
  function pad(n){return ('0'+n).slice(-2)}
  function dayKey(d){return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
  /* 匿名设备ID：统一以 ycgk.did.v1 为准；旧键 ycgk.did 只迁移一次并清除 */
  function deviceId(){
    var id='';try{id=localStorage.getItem('ycgk.did.v1')}catch(e){}
    if(!id){
      try{id=localStorage.getItem('ycgk.did')}catch(e){}
      if(id){var ok=false;try{localStorage.setItem('ycgk.did.v1',id);ok=true}catch(e){}
        if(ok){try{localStorage.removeItem('ycgk.did')}catch(e){}}}
    }
    if(id){return id}
    id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    try{localStorage.setItem('ycgk.did.v1',id)}catch(e){}
    return id;
  }
  function parseDevice(){
    var ua=navigator.userAgent||'',os='pc',model='电脑';
    if(/iPhone/i.test(ua)){os='ios';model='iPhone'}
    else if(/iPad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){os='ios';model='iPad'}
    else if(/iPod/i.test(ua)){os='ios';model='iPod'}
    else if(/HarmonyOS|OpenHarmony|ArkWeb/i.test(ua)){os='harmony';model='鸿蒙设备';var hm=ua.match(/(?:HarmonyOS|ArkWeb)[^;)]*\)?\s*([A-Za-z0-9 \-]{2,20})/i);if(hm&&hm[1])model='鸿蒙 '+hm[1].trim().slice(0,16)}
    else if(/Android/i.test(ua)){
      os='android';
      var br=ua.match(/Build\/([^;)]+)/i);var md=ua.match(/Android[^;)]*;\s*([^;)]+)/i);
      if(md&&md[1])model=md[1].trim().slice(0,20);else if(br)model='Android '+br[1].trim().slice(0,14);else model='安卓设备';
      if(/Pad|Tablet|SM-T\d|MatePad/i.test(ua))model+='(平板)';
    }
    var installed=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    return {os:os,model:model,install:!!installed};
  }
  function get(cb){
    var i=0;
    (function next(){
      if(i>=GETS.length){cb(null);return}
      fetch(GETS[i++]+KEY,{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
        if(!t||t.charAt(0)!=='{'){next();return}
        try{cb(JSON.parse(t))}catch(e){next()}
      }).catch(function(){next()});
    })();
  }
  function put(val,cb){
    var s=JSON.stringify(val);
    /* textdb.dev 实测写入/读回均可靠；直接写它，避免主线路"假成功" */
    PUTS[1](KEY,s,function(ok){cb(ok)});
  }
  function report(){
    var did=deviceId(),dev=parseDevice(),now=Date.now(),today=dayKey(new Date());
    get(function(pool){
      var p=pool&&typeof pool==='object'?pool:{};
      if(!p.online||typeof p.online!=='object')p.online={};
      if(!p.devices||typeof p.devices!=='object')p.devices={};
      if(!p.act||typeof p.act!=='object')p.act={};
      /* 清理10分钟前的在线记录，控制体积 */
      Object.keys(p.online).forEach(function(k){if(now-p.online[k]>600000){delete p.online[k];delete p.act[k]}});
      p.online[did]=now;
      /* 当前活动类型：quiz=正在刷题/做题页；空=其他页面（视频页由 videos.html 上报 vid） */
      try{ p.act[did]=(document.querySelector('[data-testid="plan-exit"]')||document.querySelector('.yc-ob-mask.on'))?'quiz':''; }catch(e){ p.act[did]=''; }
      /* 分钟级心跳计数：供看板画实时分钟趋势（保留最近3小时） */
      if(!p.min||typeof p.min!=='object')p.min={};
      var mk=today+pad(new Date().getHours())+pad(new Date().getMinutes());
      p.min[mk]=(p.min[mk]||0)+1;
      var mks=Object.keys(p.min).sort();
      if(mks.length>180){for(var mi=0;mi<mks.length-180;mi++)delete p.min[mks[mi]];}
      var rec=p.devices[did]||{};
      if(!rec.first)rec.first=dayKey(new Date());
      rec.last=today;rec.m=dev.model;rec.os=dev.os;rec.inst=!!(rec.inst||dev.install);
      /* 访问频次 + 按天分时活跃：供看板生成真实访问趋势/24小时分布 */
      rec.pv=(rec.pv||0)+1;
      var dObj=new Date(),hr=pad(dObj.getHours());
      if(!rec.hr||typeof rec.hr!=='object')rec.hr={};
      if(!rec.hr[today]||typeof rec.hr[today]!=='object')rec.hr[today]={};
      rec.hr[today][hr]=(rec.hr[today][hr]||0)+1;
      /* 只保留最近14天的分时，控制体积 */
      var hkeys=Object.keys(rec.hr).sort();
      if(hkeys.length>14){for(var hi=0;hi<hkeys.length-14;hi++)delete rec.hr[hkeys[hi]];}
      /* 活跃日矩阵（最近30天）：供留存/回访/DAU 计算 */
      if(!rec.days||typeof rec.days!=='object')rec.days={};
      rec.days[today]=1;
      var dkeys=Object.keys(rec.days).sort();
      if(dkeys.length>30){for(var di=0;di<dkeys.length-30;di++)delete rec.days[dkeys[di]];}
      /* 会话：距上次心跳超过30分钟算新会话 */
      if(!rec.lastTs||now-rec.lastTs>1800000)rec.sess=(rec.sess||0)+1;
      rec.lastTs=now;
      /* 来源渠道（只记首次）+ 页面加载耗时（只记首次） */
      if(!rec.ref){try{var rf=document.referrer||'';if(rf)rec.ref=rf.replace(/^https?:\/\//,'').split(/[/?#]/)[0].slice(0,40)||'直接打开'}catch(e){}}
      if(rec.perf===undefined){try{var t0=performance.timing,tn=performance.navigation?performance.navigation.type:0;if(t0&&t0.domContentLoadedEventStart>0)rec.perf=Math.min(9999,Math.round(t0.domContentLoadedEventStart-t0.navigationStart))}catch(e){rec.perf=0}}
      p.devices[did]=rec;
      /* 设备数上限保护：超过2000台只保留最近1500台 */
      var ids=Object.keys(p.devices);
      if(ids.length>2000){
        ids.sort(function(a,b){return (p.devices[b].last||'')>(p.devices[a].last||'')?1:-1});
        var keep={};for(var i=0;i<1500;i++)keep[ids[i]]=p.devices[ids[i]];
        p.devices=keep;
      }
      p.ts=now;
      put(p,function(){});
    });
  }
  try{ report(); setInterval(report,120000); }catch(e){}
})();
</script>

<script>
/* cloud sync layer v1: 学习码多设备同步 */
(function(){
  var SYNC_FLAG="yicheng-gk-sync-v1", HINT_FLAG="yicheng-gk-sync-hint-v1";
  var BASE="https://textdb.online", PRE="ycgkS1-", CHUNK_ENC=5000;
  var KEYS=["yicheng-gk-fav-v1","yicheng-gk-last-v1","yicheng-gk-profile-v1","yicheng-gk-study-v1","yicheng-gk-speed-v1","yicheng-gk-points-v1"];
  var CODE_CHARS="0123456789";
  function rd(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
  function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function getSync(){return rd(SYNC_FLAG)||{}}
  function setSync(o){wr(SYNC_FLAG,o)}
  function myCode(){var s=getSync();return (s&&s.code)||""}
  function genCode(){var r="";for(var i=0;i<6;i++)r+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return r}
  function snapshot(){var o={};KEYS.forEach(function(k){o[k]=rd(k)});return o}
  function snapStr(){try{return JSON.stringify(snapshot())}catch(e){return""}}
  function num(a,b){return Math.max(a||0,b||0)}
  function arrUnion(){
    var s=[],seen={};
    [].forEach.call(arguments,function(a){(a||[]).forEach(function(x){var k=typeof x==="string"?x:JSON.stringify(x);if(!seen[k]){seen[k]=1;s.push(x)}})});
    return s;
  }
  function deepMax(a,b){
    if(a===null||a===undefined)return b;
    if(b===null||b===undefined)return a;
    if(typeof a==="number"&&typeof b==="number")return Math.max(a,b);
    if(Array.isArray(a)||Array.isArray(b))return arrUnion(a,b);
    if(typeof a==="object"&&typeof b==="object"){
      var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=deepMax(o[k],b[k]);return o;
    }
    return b;
  }
  /* ---- cloud io ---- */
  var EP_KEY="yicheng-gk-sync-ep-v1";
  var ENDPOINTS=[
    {name:"主线路",get:function(key,cb){fetch("https://textdb.online/"+key,{method:"GET"}).then(function(r){return r.text()}).then(function(t){cb(null,t)}).catch(function(e){cb(e)})},
     put:function(key,val,cb){fetch("https://textdb.online/update/?key="+encodeURIComponent(key)+"&value="+encodeURIComponent(val)).then(function(r){return r.json()}).then(function(j){cb(null,j)}).catch(function(e){cb(e)})}},
    {name:"备用线路",get:function(key,cb){fetch("https://textdb.dev/api/data/"+key,{method:"GET"}).then(function(r){return r.text()}).then(function(t){cb(null,t)}).catch(function(e){cb(e)})},
     put:function(key,val,cb){fetch("https://textdb.dev/api/data/"+key,{method:"POST",headers:{"Content-Type":"text/plain"},body:val}).then(function(r){if(r.ok){cb(null)}else{cb(new Error("HTTP "+r.status))}}).catch(function(e){cb(e)})}}
  ];
  function epPref(){var v=parseInt(localStorage.getItem(EP_KEY),10);return (isNaN(v)||v<0||v>=ENDPOINTS.length)?0:v}
  function epPrefer(i){try{localStorage.setItem(EP_KEY,String(i))}catch(e){}}
  function epOrder(){var p=epPref(),o=[];for(var i=0;i<ENDPOINTS.length;i++)o.push(ENDPOINTS[(p+i)%ENDPOINTS.length]);return o}
  function cloudGet(key,cb){
    var order=epOrder(),done=0,anyOK=false,err=null,got=false;
    order.forEach(function(ep){
      ep.get(key,function(e,t){
        if(e){err=e}
        else{anyOK=true;if(t&&!got){got=true;epPrefer(ENDPOINTS.indexOf(ep));cb(null,t)}}
        done++;
        if(done===order.length&&!got){cb(anyOK?null:(err||new Error("所有线路均连接失败")),null)}
      });
    });
  }
  function cloudPut(key,val,cb){
    var order=epOrder(),done=0,okAny=false,err=null;
    order.forEach(function(ep){
      ep.put(key,val,function(e){
        if(e){err=e}else{okAny=true;epPrefer(ENDPOINTS.indexOf(ep))}
        done++;
        if(done===order.length){cb(okAny?null:(err||new Error("所有线路写入失败")))}

  function toB64(s){try{return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_")}catch(e){return s}}

  }
  var pushing=false,pullBusy=false;
  function push(cb){

    var payload;try{payload=toB64(JSON.stringify({v:1,ts:Date.now(),d:snapshot()}))}catch(e){pushing=false;cb&&cb(e);return}

    function putMeta(){cloudPut(PRE+c,JSON.stringify(meta),function(e2){if(e2)failed=e2;fin()})}
    function next(){
      if(failed){pushing=false;cb&&cb(failed);return}
      if(i>=parts.length){putMeta();return}
      var idx=i++,tries=0;
      function attempt(){
        cloudPut(PRE+c+"-c"+idx,parts[idx],function(e){
          if(e&&tries<2){tries++;attempt();return}
          if(e)failed=e;

        });
      }
      attempt();
    }
    if(parts.length===0){fin();return}
    next();
  }
  function pull(cb){
    var c=myCode();if(!c){cb&&cb("nocode",null);return}
    if(pullBusy){cb&&cb("busy",null);return}

    cloudGet(PRE+c,function(e,metaTxt){
      if(e){pullBusy=false;cb&&cb(e,null);return}
      var meta=null;try{meta=metaTxt?JSON.parse(metaTxt):null}catch(err){}
      if(!meta||!meta.n){pullBusy=false;cb&&cb(null,null);return}
      var parts=new Array(meta.n),got=0,failed=null;
      if(meta.n===0){pullBusy=false;cb&&cb(null,null);return}
      for(var i=0;i<meta.n;i++){
        (function(i){
          cloudGet(PRE+c+"-c"+i,function(e2,t2){
            if(e2)failed=e2;else parts[i]=t2;
            got++;

              pullBusy=false;

    var ls=loc["yicheng-gk-study-v1"]||{},cs=d["yicheng-gk-study-v1"]||{};
    var study={totalAnswered:num(ls.totalAnswered,cs.totalAnswered),totalCorrect:num(ls.totalCorrect,cs.totalCorrect),streakDays:num(ls.streakDays,cs.streakDays),moduleProgress:deepMax(ls.moduleProgress||{},cs.moduleProgress||{}),wrongQuestions:arrUnion(ls.wrongQuestions,cs.wrongQuestions)};
    var cd=cs.todayDate||"",ld=ls.todayDate||"";
    if(cd&&(!ld||cd>=ld)){
      study.todayDate=cd;
      study.todayAnswered=ld===cd?num(ls.todayAnswered,cs.todayAnswered):(cs.todayAnswered||0);
      study.todayCorrect=ld===cd?num(ls.todayCorrect,cs.todayCorrect):(cs.todayCorrect||0);
    }else{
      study.todayDate=ld;study.todayAnswered=ls.todayAnswered||0;study.todayCorrect=ls.todayCorrect||0;
    }
    var lsd=ls.lastStudyDate||"",csd=cs.lastStudyDate||"";
    study.lastStudyDate=(cs.streakDays||0)>(ls.streakDays||0)?(csd||lsd):(lsd||csd);
    out["yicheng-gk-study-v1"]=study;
    var lp=loc["yicheng-gk-last-v1"],cp=d["yicheng-gk-last-v1"];
    out["yicheng-gk-last-v1"]=(cp&&(!lp||(cloud.ts||0)>=(getSync().lastLocalTs||0)))?cp:(lp||cp);
    var lpr=loc["yicheng-gk-profile-v1"],cpr=d["yicheng-gk-profile-v1"];
    out["yicheng-gk-profile-v1"]=cpr||lpr;
    var lsp=loc["yicheng-gk-speed-v1"]||{doneIds:[],attempted:0},csp=d["yicheng-gk-speed-v1"]||{doneIds:[],attempted:0};
    out["yicheng-gk-speed-v1"]={doneIds:arrUnion(lsp.doneIds,csp.doneIds),attempted:num(lsp.attempted,csp.attempted)};
    var lpt=loc["yicheng-gk-points-v1"]||{balance:0,ledger:[]},cpt=d["yicheng-gk-points-v1"]||{balance:0,ledger:[]};
    out["yicheng-gk-points-v1"]={balance:num(lpt.balance,cpt.balance),ledger:arrUnion(lpt.ledger,cpt.ledger).slice(-500)};
    KEYS.forEach(function(k){if(out[k]!==null&&out[k]!==undefined)wr(k,out[k])});

    return snapStr()!==before;
  }
  /* ---- ui ---- */
  var chip=null,chipState="";

    chip.classList.remove("yc-sync-off");
    chip.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 19a4.5 4.5 0 1 1 .42-8.98 6 6 0 0 1 11.7 1.6A3.5 3.5 0 0 1 17.5 19z"/></svg><span>'+(st==="busy"?"同步中…":st==="err"?"重试同步":"已同步")+'</span>';
  }
  var ov=null,card=null;
  function ensureUI(){
    if(ov)return;
    ov=document.createElement("div");ov.className="yc-sync-ov";
    card=document.createElement("div");card.className="yc-sync-card";
    ov.appendChild(card);document.body.appendChild(ov);
    ov.addEventListener("click",function(e){if(e.target===ov)ov.classList.remove("on")});
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function openModal(){
    ensureUI();
    var c=myCode();
    if(!c){
      card.innerHTML='<h3>学习账号 · 多设备同步</h3>'+
        '<div class="yc-sync-tip">生成一个专属学习码，手机、平板登录同一个码，刷题记录、错题本、积分自动同步。</div>'+
        '<input class="yc-sync-in" id="ycSyncIn" placeholder="输入学习码" maxlength="12" autocomplete="off">'+
        '<button class="yc-sync-btn main" id="ycSyncLogin">用学习码登录</button>'+
        '<div class="yc-sync-div"><span>或</span></div>'+
        '<button class="yc-sync-btn" id="ycSyncGen">生成我的学习码</button>'+
        '<button class="yc-sync-btn" id="ycSyncPaste">用同步数据导入（不用网络）</button>'+
        '<button class="yc-sync-btn" id="ycSyncTest">检测云端连接</button>'+
        '<div class="yc-sync-err" id="ycSyncErr"></div>';
      card.querySelector("#ycSyncGen").addEventListener("click",function(){
        var btn=this;btn.disabled=true;btn.textContent="生成中…";
        tryGen(0,function(code){
          btn.disabled=false;
          card.innerHTML='<h3>你的专属学习码</h3>'+
            '<div class="yc-sync-code">'+code+'</div>'+
            '<div class="yc-sync-tip"><b>这个码就是你的专属账号！</b>换手机、换平板全靠它，弄丢了就找不回刷题进度。请立刻截图保存！</div>'+
            '<button class="yc-sync-btn main" id="ycSyncSave">我已保存，开启同步</button>';
          card.querySelector("#ycSyncSave").addEventListener("click",function(){
            setSync({code:code,appliedTs:0,lastLocalTs:Date.now()});
            ov.classList.remove("on");setChip("busy");
            push(function(e){setChip(e?"err":"ok")});
          });
        });
      });
      card.querySelector("#ycSyncTest").addEventListener("click",function(){
        var btn=this;btn.disabled=true;btn.textContent="检测中…";
        var err=card.querySelector("#ycSyncErr");
        err.textContent="检测中，最多等 10 秒…";
        var res={};
        var left=2;
        var timer=setTimeout(function(){if(left>0){left=0;err.textContent="✗ 两条线路都没连上（10 秒超时）。请换个浏览器（如 Safari）或换 WiFi/流量再试";btn.disabled=false;btn.textContent="重新检测"}},10000);
        function fin(){left--;if(left===0){clearTimeout(timer);var a=res[0],b=res[1];
          if(a&&b){err.textContent="✓ 两条线路都正常，网络没问题，请重新输入学习码登录"}
          else if(a){err.textContent="✓ 主线路正常（备用不通）。可以正常登录同步"}
          else if(b){err.textContent="✓ 备用线路正常（主线路不通）。已可自动切换，请重新输入学习码登录"}
          else{err.textContent="✗ 两条线路都连不上。请换个浏览器（如 Safari）或换 WiFi/流量再试"}
          btn.disabled=false;btn.textContent="重新检测"}}
        fetch("https://textdb.online/ycgkS1-selftest",{cache:"no-store"}).then(function(r){return r.text().then(function(){res[0]=true;fin()})}).catch(function(e){res[0]=false;fin()});
        fetch("https://textdb.dev/api/data/ycgkS1-selftest",{cache:"no-store"}).then(function(r){return r.text().then(function(){res[1]=true;fin()})}).catch(function(e){res[1]=false;fin()});
      });
      card.querySelector("#ycSyncPaste").addEventListener("click",function(){
        card.innerHTML='<h3>粘贴同步数据</h3>'+
          '<div class="yc-sync-tip">在存有刷题记录的设备上：点右上角「登录同步」→「复制同步数据」，把发过来的整段内容粘贴到下面。</div>'+
          '<textarea class="yc-sync-in" id="ycSyncPayload" style="height:90px;font-size:12px;letter-spacing:0;text-transform:none" placeholder="粘贴 YCSYNC1 开头的内容"></textarea>'+
          '<button class="yc-sync-btn main" id="ycSyncImport">导入并合并到本机</button>'+
          '<button class="yc-sync-btn" id="ycSyncBack">返回</button>'+
          '<div class="yc-sync-err" id="ycSyncErr"></div>';
        card.querySelector("#ycSyncBack").addEventListener("click",function(){ov.classList.remove("on");openModal()});
        card.querySelector("#ycSyncImport").addEventListener("click",function(){
          var err=card.querySelector("#ycSyncErr");
          var raw=(card.querySelector("#ycSyncPayload").value||"").trim();
          if(raw.indexOf("YCSYNC1:")!==0){err.textContent="内容不对：请粘贴 YCSYNC1 开头的完整同步数据";return}
          var json=fromB64(raw.slice(8));
          if(!json){err.textContent="数据损坏：请重新复制一次";return}
          var d=null;try{d=JSON.parse(json)}catch(e){}
          if(!d||typeof d!=="object"){err.textContent="数据损坏：请重新复制一次";return}
          var changed=applyCloud({ts:Date.now(),d:d});
          ov.classList.remove("on");setChip("ok");
          if(changed){sessionStorage.setItem("yc-sync-reload",String(Date.now()));location.reload()}
          else{err.textContent="本机已是最新，无需导入"}
        });
      });
      card.querySelector("#ycSyncLogin").addEventListener("click",function(){
        var v=(card.querySelector("#ycSyncIn").value||"").replace(/\s/g,"").toUpperCase();
        var err=card.querySelector("#ycSyncErr");
        if(v.length<6){err.textContent="学习码至少 6 位";return}
        err.textContent="登录中…";
        setSync({code:v,appliedTs:0,lastLocalTs:Date.now()});
        pull(function(e,cloud){
          if(e){err.textContent="云端连接失败（v8）："+(e&&e.message||e)+"。可点「检测云端连接」查原因";setSync({});return}
          var changed=cloud?applyCloud(cloud):false;
          ov.classList.remove("on");setChip("ok");
          if(changed){sessionStorage.setItem("yc-sync-reload",String(Date.now()));location.reload()}
        });
      });
    }else{
      var s=getSync();
      var t=s.lastPush?new Date(s.lastPush).toLocaleString("zh-CN",{hour12:false}):"尚未同步";
      card.innerHTML='<h3>学习账号</h3>'+
        '<div class="yc-sync-code">'+esc(c)+'</div>'+
        '<div class="yc-sync-tip">最近同步：'+esc(t)+'<br>换设备时输入这个学习码，进度自动接上。请务必保存好这个码，弄丢就找不回进度。</div>'+
        '<button class="yc-sync-btn main" id="ycSyncNow">立即同步</button>'+
        '<button class="yc-sync-btn" id="ycSyncCopy">复制同步数据（发到另一台设备）</button>'+
        '<button class="yc-sync-btn danger" id="ycSyncOut">退出登录（保留本机数据）</button>';
      card.querySelector("#ycSyncNow").addEventListener("click",function(){
        this.textContent="同步中…";this.disabled=true;
        push(function(e){
          if(e){openModal();return}
          pull(function(e2,cloud){
            if(!e2&&cloud){
              var s=getSync();
              if((cloud.ts||0)>(s.appliedTs||0)){
                var changed=applyCloud(cloud);
                if(changed){sessionStorage.setItem("yc-sync-reload",String(Date.now()));location.reload();return}
              }
            }
            openModal();
          });
        });
      });
      card.querySelector("#ycSyncCopy").addEventListener("click",function(){
        var btn=this;
        var data={};KEYS.forEach(function(k){data[k]=rd(k)});
        var payload="YCSYNC1:"+toB64(JSON.stringify(data));
        function ok(){btn.textContent="已复制！用微信/QQ发给另一台设备，在那边选「用同步数据导入」";setTimeout(function(){btn.textContent="复制同步数据（发到另一台设备）"},4000)}
        function fail(){btn.textContent="复制失败，请截图这段数据";if(window.prompt)window.prompt("全选复制下面内容：",payload)}
        try{
          if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(payload).then(ok,function(){fail()})}
          else{var ta=document.createElement("textarea");ta.value=payload;document.body.appendChild(ta);ta.select();var c=document.execCommand("copy");ta.remove();c?ok():fail()}
        }catch(e){fail()}
      });
      card.querySelector("#ycSyncOut").addEventListener("click",function(){
        if(confirm("退出后本机数据保留，但不再同步到云端。确定退出？")){setSync({});ov.classList.remove("on");setChip("")}
      });
    }
    ov.classList.add("on");
  }
  function tryGen(n,cb){
    if(n>5){cb(genCode());return}
    var code=genCode();
    cloudGet(PRE+code,function(e,t){
      if(e||t){tryGen(n+1,cb);return}
      cb(code);
    });
  }
  function addChip(){
    var bar=document.querySelector(".yc-top-actions");
    if(!bar||document.getElementById("ycChipAcc"))return false;
    chip=document.createElement("div");chip.className="yc-chip";chip.id="ycChipAcc";
    chip.addEventListener("click",openModal);
    bar.insertBefore(chip,bar.firstChild);
    setChip(chipState);return true;
  }
  var REMIND_GAP=3*24*3600*1000;
  function tsFlag(k){try{var v=parseInt(localStorage.getItem(k),10);return isNaN(v)?0:v}catch(e){return 0}}
  function showBar(html,cls,onClose){
    var b=document.createElement("div");b.className="yc-sync-hint"+(cls?" "+cls:"");
    b.innerHTML=html+'<i>知道了</i>';
    b.querySelector("i").addEventListener("click",function(){b.remove();onClose&&onClose()});
    document.body.appendChild(b);
    setTimeout(function(){try{if(b.parentNode)onClose&&onClose();b.remove()}catch(e){}},20000);
  }
  function hint(){
    setTimeout(function(){
      try{if(document.querySelector(".yc-sync-hint"))return}catch(e){}
      var c=myCode();
      if(c){
        var s=getSync();
        if(Date.now()-(s.lastRemind||0)<REMIND_GAP)return;
        showBar('<span>你的学习码：<b>'+esc(c)+'</b>｜换手机平板全靠它，记得截图保存</span>',"",function(){var s2=getSync();s2.lastRemind=Date.now();setSync(s2)});
      }else{
        if(Date.now()-tsFlag(HINT_FLAG)<REMIND_GAP)return;
        showBar('<span>想让手机和平板的进度同步？点右上角「登录同步」领学习码</span>',"",function(){try{localStorage.setItem(HINT_FLAG,String(Date.now()))}catch(e){}});
      }
    },4000);
  }
  /* ---- engine ---- */
  var lastPushed=snapStr(),pushTimer=null;
  function loop(){
    if(myCode()&&!pushing&&!pullBusy){
      var cur=snapStr();
      if(cur!==lastPushed){
        if(!pushTimer)pushTimer=setTimeout(function(){
          pushTimer=null;
          if(myCode()){setChip("busy");push(function(e){if(!e)lastPushed=snapStr();else setChip("err")})}
        },4000);
      }
    }
  }
  function bootPull(){
    if(!myCode())return;
    var tries=0;
    function attempt(){
      setTimeout(function(){
        pull(function(e,cloud){
          if(e&&tries<3){tries++;attempt();return}
          if(e||!cloud)return;
          var s=getSync();
          if((cloud.ts||0)>(s.appliedTs||0)){
            var changed=applyCloud(cloud);
            /* 修改点：启动拉取不再自动 reload；10 分钟时间窗守卫，只弹提示条，用户点击才刷新 */
            if(changed){
              try{
                var lastUpd=Number(sessionStorage.getItem("yc-sync-upd-ts")||0);
                if(!lastUpd||Date.now()-lastUpd>10*60*1000){
                  sessionStorage.setItem("yc-sync-upd-ts",String(Date.now()));
                  showUpdateBar();
                }
              }catch(errUpd){ showUpdateBar(); }
            }
          }
        });
      },tries?3000:2500);
    }
    attempt();
  }
  function boot(){
    var tries=0;
    var t=setInterval(function(){if(addChip()||++tries>20)clearInterval(t)},300);
    hint();bootPull();
    setInterval(loop,6000);
    setInterval(function(){if(!document.hidden)pullNow()},90000);
    document.addEventListener("visibilitychange",function(){
      if(document.hidden&&myCode()&&snapStr()!==lastPushed){setChip("busy");push(function(e){if(!e)lastPushed=snapStr();setChip("")})}
      if(!document.hidden)pullNow();
    });
  }
  /* 其他设备有新进度时，温和提示刷新，不打断做题 */
  function pullNow(){
    if(!myCode()||pushing||pullBusy)return;
    pull(function(e,cloud){
      if(e||!cloud)return;
      var s=getSync();
      if((cloud.ts||0)>(s.appliedTs||0)){
        var changed=applyCloud(cloud);
        if(changed)showUpdateBar();
      }
    });
  }
  function showUpdateBar(){
    if(document.getElementById("yc-sync-upd"))return;
    var b=document.createElement("div");
    b.className="yc-sync-hint";b.id="yc-sync-upd";
    b.innerHTML='<span>其他设备有新的刷题进度</span><i>刷新查看</i>';
    b.querySelector("i").addEventListener("click",function(){sessionStorage.setItem("yc-sync-reload",String(Date.now()));location.reload()});
    document.body.appendChild(b);
    setTimeout(function(){try{if(b.parentNode)b.remove()}catch(e){}},30000);
  }
  var css=document.createElement("style");
  css.textContent=".yc-sync-ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}.yc-sync-ov.on{display:flex}.yc-sync-card{background:#fff;border-radius:16px;padding:22px 20px;max-width:360px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}.yc-sync-card h3{margin:0 0 10px;font-size:17px;color:#0f172a}.yc-sync-tip{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:14px}.yc-sync-in{width:100%;box-sizing:border-box;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 12px;font-size:16px;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}.yc-sync-btn{width:100%;box-sizing:border-box;border:1.5px solid #e2e8f0;background:#f8fafc;color:#334155;border-radius:10px;padding:11px 0;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}.yc-sync-btn.main{background:#4f46e5;border-color:#4f46e5;color:#fff}.yc-sync-btn.danger{color:#dc2626;border-color:#fecaca;background:#fef2f2}.yc-sync-btn:disabled{opacity:.6}.yc-sync-div{text-align:center;color:#94a3b8;font-size:12px;margin:10px 0 0}.yc-sync-code{font-size:30px;font-weight:800;letter-spacing:6px;text-align:center;color:#4f46e5;margin:14px 0 10px;font-family:monospace}.yc-sync-err{font-size:13px;color:#dc2626;min-height:18px;margin-top:8px;text-align:center}.yc-sync-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f172a;color:#fff;font-size:13px;padding:10px 14px;border-radius:12px;z-index:99998;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}.yc-sync-hint i{font-style:normal;color:#93c5fd;font-weight:600;cursor:pointer;white-space:nowrap}.yc-sync-hint b{color:#fde68a;letter-spacing:1px}#ycChipAcc.yc-sync-off{color:#d97706;border-color:#fcd34d}@media (max-width:480px){#ycChipAcc span{display:none}#ycChipAcc{padding:6px 9px}}";
  document.head.appendChild(css);
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
<script>
/* share & referral v1: 邀请好友得积分 */
(function(){
  var GET_URLS=["https://textdb.online/","https://textdb.dev/api/data/"];
  function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsj(k){try{var v=ls(k);return v?JSON.parse(v):null}catch(e){return null}}
  function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function myCode(){
    var s=lsj("yicheng-gk-sync-v1");
    if(s&&s.code)return s.code;
    var c=ls("ycgk.shareCode");
    if(!c){c="";for(var i=0;i<6;i++)c+=Math.floor(Math.random()*10);lss("ycgk.shareCode",c)}
    return c;
  }
  function refKey(code){return "ycgkS1-ref-"+code}
  function cloudGet(key,cb){
    var done=0,got=false,err=null;
    GET_URLS.forEach(function(u){
      fetch(u+key,{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
        if(t&&!got){got=true;cb(null,t)}
        done++;if(done===GET_URLS.length&&!got)cb(err||new Error("网络不通"),null);
      }).catch(function(e){err=e;done++;if(done===GET_URLS.length&&!got)cb(err,null)});
    });
  }
  function cloudPut(key,val,cb){
    var done=0,ok=false;
    function fin(){done++;if(done===2)cb(ok?null:new Error("写入失败"))}
    fetch("https://textdb.online/update/?key="+encodeURIComponent(key)+"&value="+encodeURIComponent(val)).then(function(){fin()},function(){fin()});
    fetch("https://textdb.dev/api/data/"+key,{method:"POST",headers:{"Content-Type":"text/plain"},body:val}).then(function(r){if(r.ok)ok=true;fin()},function(){fin()});
  }
  function parseN(t){var n=parseInt(String(t||"").trim(),10);return isNaN(n)?0:n}
  function bumpRef(code,cb){
    cloudGet(refKey(code),function(e,t){
      var n=parseN(t)+1;
      cloudPut(refKey(code),String(n),function(e2){cb&&cb(e2,n)});
    });
  }
  function getRefCount(code,cb){
    cloudGet(refKey(code),function(e,t){cb(null,parseN(t))});
  }
  /* 新访客带邀请链接进来：同一设备只记一次 */
  function handleRef(){
    try{
      var q=new URLSearchParams(location.search);
      var ref=q.get("ref");
      if(!ref)return;
      ref=ref.replace(/[^0-9]/g,"").slice(0,12);
      if(!ref||ref===myCode())return;
      if(ls("ycgk.refDone"))return;
      lss("ycgk.refDone","1");
      bumpRef(ref,function(){});
      /* 受邀访客计数已挪到 guide.html 第一触点；直接带 ref 打开本页的旧链接在此兜底 */
      try{if(!ls("ycgk.refinDone")){lss("ycgk.refinDone","1");new Image().src="https://visitor-badge.laobi.icu/badge?page_id=ycgk.refin&r="+Date.now()}}catch(e){}
      setTimeout(function(){
        try{
          var b=document.createElement("div");b.className="yc-sync-hint";
          b.innerHTML='<span>欢迎来到亿成公考！同学邀请你来的，TA 会收到积分奖励</span><i>好的</i>';
          b.querySelector("i").addEventListener("click",function(){b.remove()});
          document.body.appendChild(b);
          setTimeout(function(){try{if(b.parentNode)b.remove()}catch(e){}},15000);
        }catch(e){}
      },3000);
    }catch(e){}
  }
  /* 邀请者自动到账：云端邀请数 - 已领取数 */
  function creditReferrals(){
    try{
      getRefCount(myCode(),function(e,n){
        if(e||!n)return;
        var claimed=parseInt(ls("ycgk.refClaimed")||"0",10)||0;
        var un=n-claimed;
        if(un>0){
          lss("ycgk.refClaimed",String(n));
          if(window.addPoints)addPoints(un*10,"邀请好友","新同学通过你的链接加入 x"+un);
        }
      });
    }catch(e){}
  }
  /* 首页邀请卡片 */
  function addShareCard(){
    if(document.getElementById("yc-share-card"))return;
    var entry=document.getElementById("yc-materials-card");
    if(!entry)return;
    var card=document.createElement("div");
    card.id="yc-share-card";
    card.innerHTML='<span class="material-icons yc-share-ic">group_add</span>'+
      '<div class="yc-mat-tx"><div class="yc-share-t">邀请好友 · 双方得积分</div>'+
      '<div class="yc-share-s">每带 1 位新同学 +10 分 · 可换一对一申论批改、1对1问诊</div></div>'+
      '<span class="yc-share-go">去邀请 ›</span>';
    card.addEventListener("click",openShare);
    entry.parentNode.insertBefore(card,entry);
  }
  /* 分享弹层（独立元素，不与同步弹层共用） */
  var shOv=null;
  function ensureOv(){
    if(shOv)return;
    shOv=document.createElement("div");shOv.className="yc-sync-ov";
    var card=document.createElement("div");card.className="yc-sync-card";
    shOv.appendChild(card);document.body.appendChild(shOv);
    shOv.addEventListener("click",function(e){if(e.target===shOv)shOv.classList.remove("on")});
  }
  function shareLink(){return "https://ycteacher.github.io/yichenggongkao/guide.html?ref="+myCode()}
  function copyText(txt,ok,fail){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fail)}
      else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();var c=document.execCommand("copy");ta.remove();c?ok():fail()}
    }catch(e){fail()}
  }
  function openShare(){
    ensureOv();

<script>
/* material-icons 兜底 v4 —— 源头已全 emoji(index-b34.js 编译产物已替换)

   不再使用 font-size:0 + ::after 隐藏方案（那会引入 data-emoji 依赖,动态节点漏抓会变圆点）。
   emoji 文本是普通 Unicode,任何浏览器/WebView 都能渲染,零字体依赖。 */
(function(){
  var MAP={
    apartment:'🏢',account_balance:'🏦',school:'🎓',military_tech:'🎖️',
    group:'👥',group_add:'👥',groups:'👥',people:'👥',redeem:'🎁',

    arrow_back:'⬅',arrow_forward:'➡',chevron_right:'›',chevron_left:'‹',expand_more:'⌄',expand_less:'⌃',
    check:'✓',check_circle:'✅',check_circle_outline:'☑️',task_alt:'✅',
    close:'✕',cancel:'✕',clear:'✕',search:'🔍',edit:'✏️',edit_note:'📝',

    cleaning_services:'🧹',hand:'✋',list:'📃',paper:'📄',folder:'📁',
    description:'📄',menu_book:'📖',quiz:'❓',help:'❓',info:'ℹ️',
    person:'👤',account_circle:'👤',work:'💼',business:'🏢',
    date_range:'📅',calendar_month:'📅',schedule:'⏰',trending_up:'📈',
    bar_chart:'📊',pie_chart:'🥧',dashboard:'📊',data_usage:'📊',
    emoji_events:'🏆',military:'🎖️',local_hospital:'🏥',
    phone_android:'📱',devices:'💻',laptop:'💻',computer:'💻',
    lock:'🔒',security:'🔐',verified:'✅',star_rate:'⭐',
    more_horiz:'⋯',more_vert:'⋮',add:'➕',remove:'➖',
    play_arrow:'▶️',pause:'⏸️',refresh:'🔄',send:'📤',
    analytics:'📊',insights:'💡',summarize:'📋',article:'📄'
  };
  var SEL='.material-icons,.material-icons-outlined,.material-icons-round,.material-icons-sharp,.material-icons-two-tone';
  function fixOne(el){
    if(!el||el.nodeType!==1||el.getAttribute('data-yc-emoji')) return;
    var t=(el.textContent||'').trim();
    if(!t) return;
    if(MAP[t]){
      try{ el.textContent=MAP[t]; }catch(e){}
    }
    el.setAttribute('data-yc-emoji','1');
  }
  function fixAll(){ try{ document.querySelectorAll(SEL).forEach(fixOne); }catch(e){} }
  function boot(){
    fixAll();
    try{
      var mo=new MutationObserver(function(list){
        var need=false;
        for(var i=0;i<list.length;i++){
          var r=list[i];
          if(r.type==='childList'&&r.addedNodes&&r.addedNodes.length){ need=true; break; }
          if(r.type==='characterData'){ need=true; break; }
        }
        if(need) fixAll();
      });
      mo.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
    }catch(e){}

    setTimeout(fixAll,3000);
  }
  if(document.documentElement) boot();
  else document.addEventListener('DOMContentLoaded',boot);
})();

  '.yc-inst-foot{font-size:11px;color:#9CA3AF;text-align:center;margin-top:12px;line-height:1.6}';
  var st=document.createElement('style'); st.textContent=CSS; document.head.appendChild(st);

  function steps(){
    var ua=navigator.userAgent||'';
    var isIPad=/iPad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var isIPhone=/iPhone|iPod/i.test(ua);
    var isIOS=isIPad||isIPhone;
    var isHarmony=/HarmonyOS|OpenHarmony|ArkWeb|HUAWEI|HONOR/i.test(ua);
    var isPad=/Pad|Tablet|SM-T\d|SM-P\d|MatePad|Tab\d/i.test(ua);
    var isAndroid=/Android/i.test(ua);
    var inWx=/MicroMessenger|QQ\/|MQQBrowser/i.test(ua);
    var isMac=/Macintosh|Mac OS X/i.test(ua)&&!(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var head='',body='';
    if(isIPad){
      head='iPad 平板 · 添加到主屏幕';
      body='<div class="yc-inst-st"><b>1</b><span>用自带 <b class="kb">Safari</b> 打开本页</span></div>'+
           '<div class="yc-inst-st"><b>2</b><span>点顶部右侧「分享」（方框+向上箭头）</span></div>'+
           '<div class="yc-inst-st"><b>3</b><span>下滑选「<b class="kb">添加到主屏幕</b>」→ 右上「添加」</span></div>';
    }else if(isIPhone){
      head='iPhone · 添加到主屏幕';
      body='<div class="yc-inst-st"><b>1</b><span>用自带 <b class="kb">Safari</b> 打开本页</span></div>'+
           '<div class="yc-inst-st"><b>2</b><span>点底部中间「分享」（方框+向上箭头）</span></div>'+
           '<div class="yc-inst-st"><b>3</b><span>下滑选「<b class="kb">添加到主屏幕</b>」→ 右上「添加」</span></div>';
    }else if(isHarmony){
      head='鸿蒙设备 · 添加到桌面';
      body='<div class="yc-inst-st"><b>1</b><span>用华为自带 <b class="kb">浏览器</b> 打开本页</span></div>'+
           '<div class="yc-inst-st"><b>2</b><span>点底部「三道杠」或右上「⋮」</span></div>'+
           '<div class="yc-inst-st"><b>3</b><span>选「<b class="kb">添加到桌面</b>」→ 确认</span></div>';
    }else if(isAndroid){
      head=(isPad?'安卓平板':'安卓手机')+' · 安装到桌面';
      body='<div class="yc-inst-st"><b>1</b><span>用 <b class="kb">Chrome</b> 或自带浏览器打开本页</span></div>'+
           '<div class="yc-inst-st"><b>2</b><span>点右上「⋮」菜单</span></div>'+
           '<div class="yc-inst-st"><b>3</b><span>选「<b class="kb">安装应用</b>」或「添加到主屏幕」</span></div>';
    }else if(isMac){
      head='苹果电脑 · 安装到程序坞';
      body='<div class="yc-inst-st"><b>1</b><span>用 <b class="kb">Chrome</b>/<b class="kb">Edge</b> 打开：点地址栏右侧「安装」图标，或右上「⋮」→「安装此站点为应用」</span></div>'+
           '<div class="yc-inst-st"><b>2</b><span>用 <b class="kb">Safari</b> 打开：菜单「文件」→「添加到程序坞」</span></div>';
    }else{
      head='电脑 · 安装到本地（Windows）';
      body='<div class="yc-inst-st"><b>1</b><span>推荐：点上方绿色「<b class="kb">一键安装到桌面</b>」按钮 → 弹窗里点「安装」</span></div>'+
           '<div class="yc-inst-st"><b>2</b><span>或点地址栏<b>右侧</b>的「安装」图标（显示器+向下箭头）</span></div>'+
           '<div class="yc-inst-st"><b>3</b><span>或点右上「⋮」→「<b class="kb">应用</b>」→「安装此站点为应用」</span></div>'+
           '<div class="yc-inst-st"><b>4</b><span>装好后桌面/开始菜单出现图标，<b>断网也能刷题</b></span></div>';
    }
    var wx=inWx?'<div class="yc-inst-sec" style="background:#fff7ed"><div class="yc-inst-sec-t" style="color:#9a3412">⚠️ 微信/QQ 里装不了，先跳出去</div><div style="font-size:12.5px;color:#9a3412;line-height:1.6">点右上角「···」或「⋮」→「<b>在浏览器打开</b>」，用浏览器打开后点「一键安装到桌面」即可。</div><button id="ycInstCopy" style="margin-top:8px;width:100%;border:1.5px solid #fdba74;background:#fff;color:#9a3412;border-radius:9px;padding:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit">📋 复制网址，去浏览器打开</button></div>':'';
    return {head:head, body:body, wx:wx};
  }

  function openDialog(){
    var s=steps();
    var hero=(canPrompt&&deferred&&!installed)
      ? '<button class="yc-inst-hero" id="ycInstGo">⬇ 一键安装到桌面（推荐）</button><div class="yc-inst-note">点它 → 系统弹窗点「安装」即可，最快</div>'
      : (installed
          ? '<button class="yc-inst-hero" disabled>✓ 已安装到本机</button><div class="yc-inst-note">从桌面图标打开即可，离线也能刷题</div>'
          : '<button class="yc-inst-hero" disabled>当前浏览器不支持一键安装</button><div class="yc-inst-note">请用下方步骤，2 步搞定</div>');
    var mask=document.getElementById('ycInstMask');
    if(!mask){
      mask=document.createElement('div'); mask.id='ycInstMask'; mask.className='yc-inst-mask';
      mask.innerHTML='<div class="yc-inst-card" id="ycInstCard"></div>';
      document.body.appendChild(mask);
      mask.addEventListener('click',function(e){ if(e.target===mask) mask.classList.remove('on'); });
    }
    var card=document.getElementById('ycInstCard');
    card.innerHTML='<button class="yc-inst-x" id="ycInstX">×</button>'+
      '<h3>把亿成公考保存到本地</h3>'+
      '<div class="yc-inst-sub">装到桌面后一点就开、不用再找链接，题库自动缓存，离线也能刷。</div>'+
      hero+
      '<div class="yc-inst-guides"><button class="yc-inst-gbtn" id="ycInstGV">📺 视频讲解</button><button class="yc-inst-gbtn2" id="ycInstGP">🖼 图文讲解</button></div>'+
      '<div class="yc-inst-sec"><div class="yc-inst-sec-t">手动安装 · '+s.head+'</div>'+s.body+'</div>'+
      s.wx+
      '<a class="yc-inst-link" id="ycInstGuideLink" href="install.html">看完整图文 / 视频指引 ›</a>'+
      '<div class="yc-inst-foot">只想存网页文件？电脑按 Ctrl+S（Mac 按 ⌘S）另存即可<br>安装完全免费 · 题库持续更新</div>';
    card.querySelector('#ycInstX').addEventListener('click',function(){mask.classList.remove('on')});
    var cp=card.querySelector('#ycInstCopy');
    if(cp) cp.addEventListener('click',function(){
      var url=location.href.split('#')[0];
      var done=function(){ cp.textContent='✓ 已复制，去浏览器粘贴打开'; };
      var fallback=function(){ var ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(e){} document.body.removeChild(ta); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){ fallback(); done(); }); } else { fallback(); done(); }
    });
    var gl=card.querySelector('#ycInstGuideLink');
    if(gl) gl.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); mask.classList.remove('on'); window.location.href='install.html'; });
    function goGuide(u){ return function(ev){ ev.preventDefault(); ev.stopPropagation(); mask.classList.remove('on'); window.location.href=u; }; }
    var gv=card.querySelector('#ycInstGV'), gp=card.querySelector('#ycInstGP');
    if(gv) gv.addEventListener('click', goGuide('install-video.html'));
    if(gp) gp.addEventListener('click', goGuide('install-guide.html'));
    var go=card.querySelector('#ycInstGo');
    if(go) go.addEventListener('click',function(){
      if(deferred){
        deferred.prompt();
        deferred.userChoice.then(function(r){
          if(r&&r.outcome==='accepted'){ try{new Image().src='https://visitor-badge.laobi.icu/badge?page_id=ycgk.instclick&r='+Date.now()}catch(e){} }
          deferred=null; canPrompt=false; mask.classList.remove('on');
        });
      }
    });
    mask.classList.add('on');
    try{new Image().src='https://visitor-badge.laobi.icu/badge?page_id=ycgk.instopen&r='+Date.now()}catch(e){}
  }

  function inject(){
    var actions=document.querySelector('.yc-top-actions');
    if(!actions||document.getElementById('ycInstallTopBtn')) return false;
    /* B2：做题页/套卷页/成绩页不放安装入口 */
    try{ if(document.querySelector('[data-testid="plan-exit"]')||document.querySelector('.yc-ob-mask.on')) return false; }catch(e){}
    /* 已确认装过桌面：完全不放安装按钮 */
    try{ if(localStorage.getItem('ycgk.installDone.v1')==='1') return true; }catch(e){}
    var b=document.createElement('button');
    b.id='ycInstallTopBtn'; b.className='yc-install-btn';
    b.textContent=installed?'✓ 已安装':(canPrompt?'⬇ 安装到桌面':'⬇ 安装/保存');
    b.disabled=installed;
    b.addEventListener('click',openDialog);
    actions.insertBefore(b, actions.firstChild);
    return true;
  }
  var tries=0, timer=setInterval(function(){ if(inject()||++tries>40) clearInterval(timer); },120);
  document.addEventListener('DOMContentLoaded',inject);
})();
</script>

<script>
/* 15-onboarding: 首启强制安装引导 → 学习计划表单 → 备考计划(底部tab+顶部常驻) → 模拟测试专区(10套卷+判分) */
(function(){
  'use strict';
  var K_ONB='ycgk.onboard.v2', K_PLAN='ycgk.studyplan.v2', K_MOCK='ycgk.mock.v2';
  /* ---- B0：统一弹窗注册表（频控档位见 yc-notify.js；yc-notify.js 版本参数随页面统一派生，动态加载后轮询注册）---- */
  (function(){
    var eb=function(){ try{ return YCNotify.inExamView(); }catch(e){ return false; } };
    var tries=0;
    function reg(){
      if(!window.YCNotify){ if(++tries<60) setTimeout(reg,100); return; }
      YCNotify.register('install',{freq:'days',days:3,priority:10,examBlock:eb});
      YCNotify.register('installSoft',{freq:'days',days:3,priority:20,examBlock:eb});
      YCNotify.register('planForm',{freq:'days',days:30,priority:30,examBlock:eb});
      YCNotify.register('noticeBar',{freq:'once',priority:40});
      YCNotify.register('updFloat',{freq:'days',days:1,priority:50});
      YCNotify.register('mockSheet',{freq:'session',priority:60,examBlock:eb});
      YCNotify.register('onboardChain',{freq:'once',priority:70,examBlock:eb});
    }
    reg();
  })();
  /* 已装到桌面的永久标记：装过就不再弹任何安装提醒（右上角按钮、首页卡片、首启引导） */
  var K_INST='ycgk.installDone.v1';
  function installDone(){ try{return localStorage.getItem(K_INST)==='1'}catch(e){return false} }
  function markInstalled(){ try{localStorage.setItem(K_INST,'1')}catch(e){} }
  /* ---- 弹窗频控 v1：用户选择用 localStorage 永久记住；sessionStorage 只做"本会话已弹过"计数 ---- */
  var K_DISMISS='yc_install_dismissed_v1';   /* 叉掉/暂不安装 → 永久不再自动弹安装引导 */
  var K_VISITS='yc_visit_count_v1';          /* 累计访问次数：前两次不自动弹，避免首访打断 */
  var K_SESS_POP='yc_sess_popup_shown_v1';   /* 本会话已弹过引导（刷新不重复弹） */
  var K_PLAN_LATER='yc_plan_later_v1';       /* 「暂不设置，先逛逛」时间戳 → 30 天内不再自动弹 */
  /* 用户主动拒绝安装引导（叉掉/暂不安装）= 永久不再自动弹（done.install）；旧版"永久不再提醒"记录迁移为 done.install 继续生效 */
  function installDismissed(){
    try{ if(window.YCNotify){ if(localStorage.getItem(YCNotify.P+'done.install')==='1') return true; return YCNotify.recent('install',3*86400000); } }catch(e){}
    try{return localStorage.getItem(K_DISMISS)==='1'}catch(e){return false}
  }
  function dismissInstall(){
    try{ if(window.YCNotify){ YCNotify.dismiss('install', true); return; } }catch(e){}
    try{localStorage.setItem(K_DISMISS,'1')}catch(e){}
  }
  function planLaterActive(){
    try{ if(window.YCNotify) return YCNotify.recent('planForm',30*86400000); }catch(e){}
    try{ var t=parseInt(localStorage.getItem(K_PLAN_LATER)||'0',10)||0; return !!t && Date.now()-t<30*86400000; }catch(e){return false}
  }
  function inAppBrowser(){ var ua=navigator.userAgent||''; return /MicroMessenger|QQ\/|MQQBrowser/i.test(ua); }
  function hasAnyPlan(){
    try{ if(getJSON(K_PLAN,null)) return true; }catch(e){}
    try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('ycgk.studyplan')===0) return true; } }catch(e){}
    return false;
  }
  function showToast(msg){
    try{
      var t=document.createElement('div'); t.textContent=msg;
      t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483647;background:#15803D;color:#fff;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700;box-shadow:0 6px 22px rgba(21,128,61,.35);font-family:inherit;white-space:nowrap;max-width:92vw';
      document.body.appendChild(t);
      setTimeout(function(){ t.style.transition='opacity .4s'; t.style.opacity='0'; },2400);
      setTimeout(function(){ if(t.parentNode)t.parentNode.removeChild(t); },2900);
    }catch(e){}
  }
  function raw(k){ try{return localStorage.getItem(k)}catch(e){return null} }
  function set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
  function getJSON(k,fb){ try{var v=raw(k);return v?JSON.parse(v):fb}catch(e){return fb} }
  function setJSON(k,v){ set(k,JSON.stringify(v)) }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') }
  function $(id){ return document.getElementById(id) }

  /* 修复"打开强制进备考计划"：清掉 React 读取的 #plan hash */
  try{ if(/plan/i.test(location.hash)) history.replaceState(null,'',location.href.split('#')[0]); }catch(e){}
  /* 停掉旧的一次性欢迎弹窗（由本流程接管） */
  try{ set('ycgk.welcomeSeen','1'); }catch(e){}

  var deferred=null, canInstall=false, installed=false;
  try{
    window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; canInstall=true; refreshInstallBtn(); });
    window.addEventListener('appinstalled',function(){ installed=true; deferred=null; canInstall=false; markInstalled(); refreshInstallBtn(); showToast('✓ 已装到桌面，以后一点就开'); });
    installed=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    if(installed) markInstalled();
  }catch(e){}

  /* 老机兜底：页面加载 3 秒后仍没触发 beforeinstallprompt、也不在已安装容器内，
     说明这台设备不支持一键安装——点安装按钮时改弹图文引导，不再静默无响应 */
  var noPrompt=false;
  setTimeout(function(){
    try{
      var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
      if(!deferred&&!canInstall&&!installed&&!standalone) noPrompt=true;
    }catch(e){}
  },3000);
  function showManualGuide(){
    var d=device();
    var st=''; for(var i=0;i<d.steps.length;i++) st+='<div class="yc-ob-st"><b>'+(i+1)+'</b><span>'+d.steps[i][0]+'</span></div>';
    var wx=d.wx?'<div style="background:#fff7ed;border-radius:12px;padding:11px 14px;margin-top:10px;font-size:12.5px;color:#9a3412;line-height:1.6">⚠️ 微信/QQ 里装不了：点右上角「···」或「⋮」→「在浏览器打开」，再用浏览器按上面步骤装。</div>':'';
    openCard('ycObManual','<div class="yc-ob-h">手动添加到桌面</div>'+
      '<div class="yc-ob-sub">当前浏览器不支持一键安装，按下面步骤手动装（'+esc(d.label)+'）</div>'+
      st+wx+
      '<button class="yc-ob-primary" id="obManualOk">知道了</button>');
    var okb=$('obManualOk');
    if(okb) okb.addEventListener('click',function(){ closeCard(); });
  }

  /* ---------- CSS ---------- */
  var CSS=''+
  '.yc-ob-mask{position:fixed;inset:0;z-index:2147483000;background:rgba(18,14,10,.62);display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .25s}'+
  '.yc-ob-mask.on{opacity:1;pointer-events:auto}'+
  '.yc-ob-card{position:relative;width:100%;max-width:460px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:24px 20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:translateY(14px);transition:transform .25s;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}'+
  '.yc-ob-mask.on .yc-ob-card{transform:translateY(0)}'+
  '.yc-ob-card.wide{max-width:680px}'+
  '.yc-ob-x{position:absolute;top:7px;right:9px;width:44px;height:44px;border:none;background:#f2f0ec;border-radius:50%;font-size:20px;color:#8a8378;cursor:pointer;line-height:44px;text-align:center}'+
  '.yc-ob-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;font-size:27px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 6px 18px rgba(220,38,38,.3)}'+
  '.yc-ob-h{font-size:21px;font-weight:900;color:#202020;text-align:center;margin:0 0 6px;line-height:1.3}'+
  '.yc-ob-sub{font-size:13px;color:#8a8378;text-align:center;margin:0 0 16px;line-height:1.6}'+
  '.yc-ob-warn{background:#fff7ed;border:1.5px solid #fdba74;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.65;color:#9a3412;margin-bottom:14px;font-weight:600}'+
  '.yc-ob-why{display:flex;gap:8px;margin-bottom:14px}'+
  '.yc-ob-why div{flex:1;background:#F7F5F0;border-radius:12px;padding:11px 6px;text-align:center}'+
  '.yc-ob-why .ic{font-size:23px;line-height:1.2}'+
  '.yc-ob-why .tx{font-size:11.5px;color:#5b5560;margin-top:5px;font-weight:700}'+
  '.yc-ob-steps{background:#fef2f2;border:1.5px solid #fecaca;border-radius:14px;padding:13px 14px;margin-bottom:12px}'+
  '.yc-ob-steps-t{font-size:13.5px;font-weight:900;color:#991b1b;margin-bottom:9px}'+
  '.yc-ob-st{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.6;color:#202020;margin-top:8px;text-align:left}'+
  '.yc-ob-st b{flex:none;width:21px;height:21px;border-radius:50%;background:#DC2626;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}'+
  '.yc-ob-st .kb{background:#fee2e2;color:#b91c1c;border-radius:5px;padding:1px 5px;font-weight:800;white-space:nowrap}'+
  '.yc-ob-wx{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.6;color:#92400e;margin-bottom:12px}'+
  '.yc-ob-primary{display:block;width:100%;background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:900;margin-top:6px;cursor:pointer;box-shadow:0 5px 16px rgba(220,38,38,.3);font-family:inherit}'+
  '.yc-ob-primary:active{transform:scale(.985)}'+
  '.yc-ob-ghost{display:block;width:100%;background:#fff;color:#b91c1c;border:1.5px solid #fca5a5;border-radius:12px;padding:12px;font-size:14px;font-weight:800;margin-top:9px;cursor:pointer;font-family:inherit}'+
  '.yc-ob-foot{font-size:11.5px;color:#9ca3af;text-align:center;margin-top:12px;line-height:1.7}'+
  '.yc-ob-foot a{color:#6b7280;text-decoration:underline;cursor:pointer}'+
  '.yc-ob-label{display:block;font-size:13px;font-weight:800;color:#374151;margin:14px 0 6px;text-align:left}'+
  '.yc-ob-input,.yc-ob-select{width:100%;box-sizing:border-box;border:1.5px solid #e5e1d8;border-radius:11px;padding:12px 13px;font-size:15px;color:#202020;background:#fff;font-family:inherit;outline:none}'+

  /* ---------- 全屏层 ---------- */
  var ov=null, ovTimer=null;
  function openCard(id, html, opts){
    opts=opts||{};
    closeCard(true);
    ov=document.createElement('div'); ov.id=id; ov.className='yc-ob-mask';
    ov.innerHTML='<div class="yc-ob-card'+(opts.wide?' wide':'')+'">'+html+'</div>';
    document.body.appendChild(ov);
    requestAnimationFrame(function(){ if(ov) ov.classList.add('on'); });
    /* 动画结束后清掉 transform：iOS 平板上带 transform 的容器会让原生日历/触摸命中失效 */
    setTimeout(function(){ if(ov){ var c=ov.firstChild; if(c&&c.style) c.style.transform='none'; } },320);
    if(opts.closable!==false){
      ov.addEventListener('click',function(e){ if(e.target===ov) closeCard(); });
      var card=ov.firstChild;
      var x=document.createElement('button'); x.className='yc-ob-x'; x.textContent='×';
      x.setAttribute('aria-label','关闭');
      x.addEventListener('click',closeCard); card.insertBefore(x,card.firstChild);
    }
    /* B1 硬指标：滚动锁 / Esc 关闭 / 安卓返回键 / 焦点锁 */
    try{
      ov._ycPrevOverflow=document.body.style.overflow;
      document.body.style.overflow='hidden';
      try{ history.pushState({ycPop:true},''); ov._ycPushed=true; }catch(e){}
      ov._ycOnKey=function(e){
        try{
          if(e.key==='Escape'){ closeCard(); return; }
          if(e.key==='Tab'&&ov){
            var f=ov.querySelectorAll('button,input,select,a[href],[tabindex]:not([tabindex="-1"])');
            if(!f.length) return;
            var first=f[0],last=f[f.length-1];
            if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
            else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
            else if(!ov.contains(document.activeElement)){e.preventDefault();first.focus();}
          }
        }catch(e2){}
      };
      document.addEventListener('keydown',ov._ycOnKey,true);
      ov._ycOnPop=function(){ closeCard(); };
      window.addEventListener('popstate',ov._ycOnPop);
    }catch(e){}
    return ov;
  }
  function closeCard(now,keepHistory){
    if(ovTimer){clearTimeout(ovTimer);ovTimer=null}
    if(!ov) return;
    var o=ov; ov=null;
    try{
      document.removeEventListener('keydown',o._ycOnKey,true);
      window.removeEventListener('popstate',o._ycOnPop);
      document.body.style.overflow=o._ycPrevOverflow||'';
      if(o._ycPushed&&history.state&&history.state.ycPop){
        /* keepHistory=true：紧接着要打开新弹层，不能 history.back()——
           back 是异步的，会晚于新弹层的 pushState 生效，把新卡片顶掉 */
        if(keepHistory){ try{history.replaceState(null,'',location.href);}catch(e){} }
        else{ try{history.back();}catch(e){} }
      }
    }catch(e){}
    o.classList.remove('on');
    if(now){ if(o.parentNode)o.parentNode.removeChild(o); }
    else ovTimer=setTimeout(function(){ if(o.parentNode)o.parentNode.removeChild(o); },260);
  }

  /* ---------- 屏幕1：安装引导（强制、丰富） ---------- */
  function device(){
    var ua=navigator.userAgent||'',os='pc',model='电脑';
    if(/iPhone/i.test(ua)){os='ios';model='iPhone'}
    else if(/iPad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){os='ios';model='iPad'}
    else if(/HarmonyOS|OpenHarmony|ArkWeb/i.test(ua)){os='harmony';model='鸿蒙设备'}
    else if(/Android/i.test(ua)){os='android';var md=ua.match(/Android[^;)]*;\s*([^;)]+)/i);model=md&&md[1]?md[1].trim().slice(0,20):'安卓设备';if(/Pad|Tablet|SM-T\d|MatePad/i.test(ua))model+='(平板)'}
    var wx=/MicroMessenger|QQ\/|MQQBrowser/i.test(ua);
    var iosOther=/iPhone|iPod/.test(ua)&&/CriOS|FxiOS|EdgiOS|Opt\/|YaBrowser/i.test(ua);
    var osName=os==='ios'?'苹果':os==='android'?'安卓':os==='harmony'?'鸿蒙':'电脑';
    var steps;
    if(os==='ios'){
      steps=[['点浏览器底部的「分享」按钮（方框加箭头）'],['选「添加到主屏幕」，再点右上角「添加」']];
    }else if(os==='android'){
      steps=[['点浏览器右上角「⋮」菜单'],['选「添加到主屏幕」或「安装应用」']];
    }else if(os==='harmony'){
      steps=[['点浏览器底部「⋮」或菜单按钮'],['选「添加到桌面」']];
    }else{
      steps=[['点地址栏右侧的「安装」图标（或菜单里的「安装应用」）']];
    }
    var label=(model.indexOf(osName)>-1)?model:model+' · '+osName;
    return {label:label,steps:steps,wx:wx,iosOther:iosOther};
  }

  /* ---------- 题库读取与组卷 ---------- */
  function allQuestions(){
    var arr=[];
    try{
      var dr=window.__ycDr||[];
      for(var i=0;i<dr.length;i++) arr.push(dr[i]);
      var cs=window.YC_CS_BANK||[]; for(var i2=0;i2<cs.length;i2++) arr.push(cs[i2]);
      var more=window.YC_MORE_QBANKS||[];
      for(var j=0;j<more.length;j++){ var sub=more[j]||[]; for(var k=0;k<sub.length;k++) arr.push(sub[k]); }
    }catch(e){}
    var seen={},out=[];
    for(var m=0;m<arr.length;m++){
      var q=arr[m];
      if(q&&q.id&&!seen[q.id]&&typeof q.prompt==='string'&&q.prompt&&q.options&&q.options.length===4&&typeof q.answer==='number'&&q.answer>=0&&q.answer<=3){
        seen[q.id]=1; out.push(q);
      }
    }
    return out;
  }
  function seededShuffle(a,seed){
    var arr=a.slice(),s=seed||1;
    function rnd(){ s=(s*9301+49297)%233280; return s/233280; }
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=arr[i];arr[i]=arr[j];arr[j]=t; }
    return arr;
  }
  function byModule(){
    var qs=allQuestions(),g={};
    for(var i=0;i<qs.length;i++){ var m=qs[i].module||'other'; (g[m]=g[m]||[]).push(qs[i]); }
    return g;
  }
  function pickByModules(mods,n,seed){
    var g=byModule(),picked=[],seen={};
    var per=Math.max(1,Math.ceil(n/mods.length));
    for(var a=0;a<mods.length;a++){
      var pool=seededShuffle(g[mods[a]]||[],seed+a*13);
      var take=Math.min(per,pool.length);
      for(var b=0;b<take && picked.length<n;b++){ if(!seen[pool[b].id]){ seen[pool[b].id]=1; picked.push(pool[b]); } }
    }
    if(picked.length<n){
      var rest=seededShuffle(allQuestions(),seed+999);
      for(var r=0;r<rest.length && picked.length<n;r++){ if(!seen[rest[r].id]){ seen[rest[r].id]=1; picked.push(rest[r]); } }
    }
    return seededShuffle(picked,seed+7);
  }
  function ensureBank(cb){
    var MODS=['changshi','yanyu','panduan','shuliang','ziliao','jundui'];
    if(window.__ycLoadModules&&window.__ycBanksReady){ window.__ycLoadModules(MODS,cb); return; }
    if(window.__ycLoadModules){
      var tries=0;
      var t=setInterval(function(){
        tries++;
        if(window.__ycBanksReady){ clearInterval(t); window.__ycLoadModules(MODS,cb); }
        else if(tries>25){ clearInterval(t); cb(); }
      },300);
      return;
    }
    cb();
  }

      var g=byModule(),picked=[],seen={};
      for(var mod in paper.mix){
        var pool=seededShuffle(g[mod]||[],paper.seed+mod.length*17);
        var take=Math.min(paper.mix[mod],pool.length);
        for(var k=0;k<take;k++){ if(!seen[pool[k].id]){ seen[pool[k].id]=1; picked.push(pool[k]); } }
      }
      if(picked.length<paper.total){
        var rest=seededShuffle(allQuestions(),paper.seed+888);
        for(var r=0;r<rest.length && picked.length<paper.total;r++){ if(!seen[rest[r].id]){ seen[rest[r].id]=1; picked.push(rest[r]); } }
      }
      picked=seededShuffle(picked,paper.seed+3).slice(0,paper.total);

  var MODN={changshi:'常识',yanyu:'言语',panduan:'判断',shuliang:'数量',ziliao:'资料',tuitui:'图推',jundui:'军队',liuda:'六大'};
  function runQuiz(qs,title,onFinish){
    var idx=0,answers=new Array(qs.length);
    function render(){

      });
      $('qPrev').addEventListener('click',function(){ if(idx>0){idx--;render();} });
      $('qNext').addEventListener('click',function(){
        if(answers[idx]===undefined){ alert('请先选一个答案'); return; }
        if(idx<qs.length-1){ idx++; render(); }
        else finish();
      });
    }
    function finish(){
      var correct=0,mods={};
      for(var i=0;i<qs.length;i++){
        var m=qs[i].module||'other'; mods[m]=mods[m]||{c:0,t:0}; mods[m].t++;

      }
      var rate=Math.round(correct/qs.length*100);
      onFinish({correct:correct,total:qs.length,rate:rate,score:rate,mods:mods,qs:qs,answers:answers,title:title});
    }
    render();
  }

  function moduleToWeak(m){ var inv={'changshi':'常识判断','yanyu':'言语理解','panduan':'判断推理','shuliang':'数量关系','ziliao':'资料分析','shenlun':'申论','zy':'综合应用'}; return inv[m]||''; }
  function reviewWrong(res){
