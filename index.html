    "上海": "上海市考自主命题，行测＋申论，大部分职位需加考专业课，先定岗位再定复习范围。",
    "四川": "四川参加多省联考，题量中等，竞争比高，行测正确率优先于速度。",
    "湖北": "湖北参加多省联考，行测题量大，按联考节奏准备整卷模考。",

    "陕西": "陕西参加多省联考，行测数学运算偏难，数量关系量力而行抓基础题。"
  };

  function ls(k, v){ try { if (v === undefined) { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
  function getState(){ return ls("yc-ui-v1") || {}; }
  function saveState(s){ ls("yc-ui-v1", s); }

  /* ---------- 图标库 ---------- */
  function svg(p, c){ return '<svg class="yc-svg" viewBox="0 0 24 24" fill="none" stroke="' + (c||"currentColor") + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }
  var ICONS = {
    "module-changshi": svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>'),
    "module-yanyu": svg('<path d="M21 12a8 8 0 0 1-8 8H4l1.6-3.2A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14.5h4"/>'),
    "module-shuliang": svg('<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7.5h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>'),
    "module-panduan": svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
    "module-ziliao": svg('<path d="M4 20h16"/><rect x="6" y="11" width="3.4" height="6" rx="1"/><rect x="11" y="7" width="3.4" height="10" rx="1"/><rect x="16" y="4" width="3.4" height="13" rx="1"/>'),
    "module-jundui": svg('<circle cx="12" cy="9" r="5.5"/><path d="M9.5 13.5 8 21l4-2.2L16 21l-1.5-7.5M12 6.8l.9 1.8 2 .3-1.4 1.4.3 2-1.8-1-1.8 1 .3-2-1.4-1.4 2-.3z"/>'),
    "module-jiaoshi": svg('<path d="M2.5 9.5 12 5l9.5 4.5L12 14 2.5 9.5z"/><path d="M6.5 11.5v4.2c0 1.2 2.5 2.6 5.5 2.6s5.5-1.4 5.5-2.6v-4.2M21.5 9.5v5"/>'),
    "module-yiliao": svg('<path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/><path d="M9.3 12h5.4M12 9.3v5.4"/>'),
    "guokao-entry": svg('<path d="M4 21V5.5L12 3l8 2.5V21"/><path d="M2.5 21h19M9.5 21v-4.5h5V21M9.5 9h.01M14.5 9h.01M9.5 12.5h.01M14.5 12.5h.01"/>'),
    "zhifa-entry": svg('<path d="M12 3v3M7 6h10M6 6l-3.2 7a3.6 3.6 0 0 0 6.4 0L6 6zM18 6l-3.2 7a3.6 3.6 0 0 0 6.4 0L18 6z"/><path d="M12 6v13M8.5 21h7"/>'),
    "mother-entry": svg('<path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v17.5H7.5A2.5 2.5 0 0 0 5 22V4.5z"/><path d="M5 19.5A2.5 2.5 0 0 1 7.5 17H19M9.5 7h5"/>'),

    "plan-entry-grid": svg('<path d="M5 4h14a1.5 1.5 0 0 1 1.5 1.5V20a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 20V5.5A1.5 1.5 0 0 1 5 4z"/><path d="M8 3v3.5M16 3v3.5M3.5 10h17M8 14.5l2.6 2.6 5-5"/>'),
    "speed-calc-entry": svg('<path d="M13 2 4.5 13.5h5L10 22l8.5-11.5h-5L13 2z"/>'),

    "start-paper-gk": svg('<path d="M6 2.5h9.5L20 7v14.5H6V2.5z"/><path d="M14.5 2.5V7H20M9 12h6M9 15.5h6"/>'),
    "start-paper-gb": svg('<path d="M6 2.5h9.5L20 7v14.5H6V2.5z"/><path d="M14.5 2.5V7H20M9 12h6M9 15.5h4"/>')
  };

  function replaceIcons(){
    document.querySelectorAll("[data-testid]").forEach(function(el){
      var tid = el.getAttribute("data-testid");
      var ic = ICONS[tid];
      if (!ic) return;
      el.querySelectorAll(".material-icons").forEach(function(mi){
        if (mi.dataset.ycDone) return;
        var wrap = document.createElement("span");
        wrap.innerHTML = ic;
        var s = wrap.firstChild;
        s.dataset.ycDone = "1";
        mi.replaceWith(s);
      });
    });
  }

  /* ---------- 隐藏旧备考档案卡 ---------- */
  function hideProfileCard(){
    document.querySelectorAll(".page-shell > *").forEach(function(el){
      if (el.textContent.indexOf("备考档案") > -1) {
        el.classList.add("yc-hide-profile");
        el.style.display = "none";
      }
    });
  }
  var style = document.createElement("style");
  style.textContent = ".yc-hide-profile{display:none!important}";
  document.head.appendChild(style);

  /* ---------- 顶部栏 ---------- */
  var state = getState();
  var topbar = document.createElement("div");
  topbar.className = "yc-topbar";
  topbar.innerHTML =
    '<div class="yc-brand"><div class="yc-logo">刷</div>' +
    '<div><div class="yc-brand-name">亿成公考 · 备考神器</div>' +
    '<div class="yc-brand-sub">亿成老师团队倾心打造 · 题库持续更新</div></div></div>' +
    '<div class="yc-top-actions">' +
    '<div class="yc-chip" id="ycChipPts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15.5s-4.8-3-4.8-6.4A2.7 2.7 0 0 1 12 7.4a2.7 2.7 0 0 1 4.8 1.7c0 3.4-4.8 6.4-4.8 6.4z"/></svg><span id="ycPtsShort">0</span></div>' +
    '<div class="yc-chip" id="ycChipDir"><span id="ycChipDirText">选择方向</span><span class="yc-arrow">▼</span></div>' +
    '</div>';
  document.body.appendChild(topbar);
  document.body.classList.add("yc-ui");

  function refreshChips(){
    var s = getState();
    var t = document.getElementById("ycChipDirText");
    var chip = document.getElementById("ycChipDir");
    if (s.province && s.examType) {
      t.textContent = s.province + " · " + s.examType;
      chip.classList.add("yc-chip-done");
    } else if (s.province) {
      t.textContent = s.province;
      chip.classList.add("yc-chip-done");
    } else {
      t.textContent = "选择方向";
      chip.classList.remove("yc-chip-done");
    }
    renderDirBanner();
  }

  /* ---------- 遮罩 / 面板 / 弹窗 ---------- */
  var mask = document.createElement("div"); mask.className = "yc-mask"; document.body.appendChild(mask);
  var sheet = document.createElement("div"); sheet.className = "yc-sheet"; document.body.appendChild(sheet);
  var modal = document.createElement("div"); modal.className = "yc-modal"; document.body.appendChild(modal);

  function closeAll(){
    mask.classList.remove("on"); sheet.classList.remove("on"); modal.classList.remove("on");
  }
  mask.addEventListener("click", closeAll);

  var pick = {province: null, examType: null};
  function openSheet(){
    var s = getState();
    pick = {province: s.province || null, examType: s.examType || null};
    var pv = PROVINCES.map(function(p){
      return '<div class="yc-opt' + (pick.province === p ? " on" : "") + '" data-pv="' + p + '">' + p + '</div>';
    }).join("");
    var tp = TYPES.map(function(t){
      return '<div class="yc-opt' + (pick.examType === t ? " on" : "") + '" data-tp="' + t + '">' + t + '</div>';
    }).join("");
    sheet.innerHTML =
      '<h3>选择你的备考方向</h3><div class="yc-tip">选好后为你生成针对性复习建议，可随时修改</div>' +
      '<div class="yc-sec"><div class="yc-sec-t">目标省份</div><div class="yc-grid">' + pv + '</div></div>' +
      '<div class="yc-sec"><div class="yc-sec-t">考试类型</div><div class="yc-types">' + tp + '</div></div>' +
      '<button class="yc-save" id="ycSave" ' + ((pick.province && pick.examType) ? "" : "disabled") + '>保存并查看备考建议</button>';
    sheet.querySelectorAll("[data-pv]").forEach(function(el){
      el.addEventListener("click", function(){
        pick.province = el.dataset.pv;
        sheet.querySelectorAll("[data-pv]").forEach(function(e){ e.classList.remove("on"); });
        el.classList.add("on"); syncSave();
      });
    });
    sheet.querySelectorAll("[data-tp]").forEach(function(el){
      el.addEventListener("click", function(){
        pick.examType = el.dataset.tp;
        sheet.querySelectorAll("[data-tp]").forEach(function(e){ e.classList.remove("on"); });
        el.classList.add("on"); syncSave();
      });
    });
    function syncSave(){
      document.getElementById("ycSave").disabled = !(pick.province && pick.examType);
    }
    sheet.querySelector("#ycSave").addEventListener("click", function(){
      saveState(pick); refreshChips(); closeAll();
      setTimeout(openAdvice, 220);
    });
    mask.classList.add("on"); sheet.classList.add("on");
  }

  function openAdvice(){
    var s = getState();
    if (!s.province || !s.examType) { openSheet(); return; }
    var adv = TYPE_ADVICE[s.examType] || [];
    var note = PROVINCE_NOTES[s.province] || ("以" + s.province + "省最新招考公告为准，建议先做1-2套本省真题摸底，标出薄弱模块再专项突破。");
    modal.innerHTML =
      '<h3>你的备考建议</h3>' +
      '<span class="yc-tagline">' + s.province + " · " + s.examType + '</span>' +
      '<div class="yc-adv-block"><h4>' + s.examType + '怎么考</h4><ul>' + adv.map(function(a){ return "<li>" + a + "</li>"; }).join("") + '</ul></div>' +
      '<div class="yc-adv-block"><h4>' + s.province + '特色</h4><div class="yc-adv-note">' + note + '</div></div>' +
      '<button class="yc-close" id="ycAdvClose">知道了，开始刷题</button>';
    document.getElementById("ycAdvClose").addEventListener("click", closeAll);
    mask.classList.add("on"); modal.classList.add("on");
  }

  document.getElementById("ycChipDir").addEventListener("click", function(){
    var s = getState();
    if (s.province && s.examType) openAdvice(); else openSheet();
  });

  /* ---------- 我的方向横幅 ---------- */
  function renderDirBanner(){
    var s = getState();
    var old = document.querySelector(".yc-dir-banner");
    if (old) old.remove();
    if (!s.province || !s.examType) return;
    var shell = document.querySelector(".page-shell");
    if (!shell) return;
    var b = document.createElement("div");
    b.className = "yc-dir-banner";
    b.innerHTML = '<div><div class="yc-db-l">备考方向：' + s.province + " · " + s.examType + '</div>' +
      '<div class="yc-db-s">已按你的方向生成复习建议</div></div>' +
      '<div class="yc-db-r">查看 ›</div>';
    b.addEventListener("click", openAdvice);
    shell.insertBefore(b, shell.firstChild);
  }

  /* ---------- 积分中心 ---------- */
  function getPoints(){ return ls("yicheng-gk-points-v1") || {balance: 0, ledger: []}; }
  function addPoints(amount, reason, detail){
    var p = getPoints();
    p.balance = (p.balance || 0) + amount;
    p.todayEarned = (p.todayEarned || 0) + amount;
    p.todayDate = new Date().toISOString().slice(0, 10);
    p.ledger = p.ledger || [];
    p.ledger.unshift({id: "yc-" + Date.now(), time: new Date().toLocaleString("zh-CN", {hour12: false}).slice(0, 16), amount: amount, reason: reason, detail: detail});
    p.ledger = p.ledger.slice(0, 30);
    ls("yicheng-gk-points-v1", p);
    refreshPtsShort();
  }
  function refreshPtsShort(){
    document.getElementById("ycPtsShort").textContent = getPoints().balance || 0;
  }
  function dailyBonus(){
    var p = getPoints();
    var today = new Date().toISOString().slice(0, 10);
    if (p.todayDate !== today) {
      p.todayEarned = 0; p.todayDate = today;
      ls("yicheng-gk-points-v1", p);
      addPoints(2, "每日打卡", "每日首次打开应用");
    }
  }
  function studyTotals(){
    var s = ls("yicheng-gk-study-v1") || {};
    var mp = s.moduleProgress || {};
    var a = 0, c = 0;
    Object.keys(mp).forEach(function(k){ a += mp[k].answered || 0; c += mp[k].correct || 0; });
    return {a: a, c: c};
  }
  function watchAnswers(){
    var last = studyTotals();
    setInterval(function(){
      var t = studyTotals();
      var da = t.a - last.a, dc = t.c - last.c;
      try{
        if(da>0&&localStorage.getItem('ycgk.refDone')&&!localStorage.getItem('ycgk.refstudyDone')){
          localStorage.setItem('ycgk.refstudyDone','1');
          new Image().src="https://visitor-badge.laobi.icu/badge?page_id=ycgk.refstudy&r="+Date.now();
        }
      }catch(e){}
      if (da > 0) addPoints(da, "完成刷题", "新答 " + da + " 题，每题 +1");
      if (dc > 0) addPoints(dc, "答对加分", "答对 " + dc + " 题，每题 +1");
      last = t;
    }, 4000);
  }
  function openPoints(){
    var p = getPoints();
    var ledger = (p.ledger || []).slice(0, 8).map(function(l){
      return '<div class="yc-ledger-item"><span>' + l.time + " · " + l.reason + '</span><span class="yc-lr">+' + l.amount + "</span></div>";
    }).join("");
    modal.innerHTML =
      '<h3>积分中心</h3><span class="yc-tagline">坚持刷题，积分自然涨</span>' +
      '<div class="yc-pts-hero"><span class="yc-pts-num">' + (p.balance || 0) + '</span><span class="yc-pts-unit">分</span>' +
      '<span class="yc-pts-today">今日 +' + (p.todayEarned || 0) + "</span></div>" +
      '<div class="yc-rules">' +
      '<div class="yc-rule"><b>每日打卡 +2</b><span>每天打开应用自动到账</span></div>' +
      '<div class="yc-rule"><b>刷题 +1 / 答对再 +1</b><span>做完题几秒内自动累计</span></div>' +
      '<div class="yc-rule"><b>连续学习有加成</b><span>连续天数越多，打卡分越高</span></div>' +

<script>
/* usage stats beacon v3: 在线心跳 / 24小时活跃 / 平板识别 / 刷题深度 */
(function(){
  try{
    var B='https://visitor-badge.laobi.icu/badge?page_id=';
    function hit(id){ try{ new Image().src=B+id+'&r='+Date.now(); }catch(e){} }
    function pad(n){ return ('0'+n).slice(-2); }
    /* 平板识别：每台设备只记一次（iPad 同时计入 iOS，平板为补充标签） */
    try{
      if(!localStorage.getItem('ycgk.devtab')){
        localStorage.setItem('ycgk.devtab','1');
        var ua=navigator.userAgent||'';
        if(/iPad|Tablet|PlayBook|Silk|SM-T\d|SM-P\d|Tab\d|MatePad|Pad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) hit('ycgk.dev.tablet');
      }
    }catch(e){}
    /* 24小时活跃分布：每次打开记入所在小时 */
    try{ hit('ycgk.hr.'+pad(new Date().getHours())); }catch(e){}
    /* 在线心跳：打开时及每 60 秒各记一次所在分钟 */
    try{
      var lastHb='';
      function hb(){ var d=new Date(),s=''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes()); if(s!==lastHb){ lastHb=s; hit('ycgk.hb.'+s); } }
      hb(); setInterval(hb,60000);
    }catch(e){}
    /* 刷题深度：累计作答跨过 10/50/100/500/1000/5000 题各记一次（匿名） */
    try{
      var TH=[10,50,100,500,1000,5000];
      function ansTotal(){
        var t=0;
        try{
          var s=JSON.parse(localStorage.getItem('yicheng-gk-study-v1')||'{}');
          var mp=s.moduleProgress||{};
          Object.keys(mp).forEach(function(k){ t+=(mp[k].answered||0); });
        }catch(e){}
        return t;
      }
      setInterval(function(){
        try{
          var a=ansTotal();
          for(var i=0;i<TH.length;i++){
            var n=TH[i];
            if(a>=n&&!localStorage.getItem('ycgk.ans.t'+n)){ localStorage.setItem('ycgk.ans.t'+n,'1'); hit('ycgk.ans.t'+n); }
          }
        }catch(e){}
      },8000);
      /* 刷题段位：每跨过 100 题记一次 ycgk.lvl.<n>（匿名，供排行榜） */
      var lastLvl=-1;
      setInterval(function(){
        try{
          var a=ansTotal(), n=Math.min(49,Math.floor(a/100));
          if(n>lastLvl){
            for(var i=(lastLvl<0?0:lastLvl+1);i<=n;i++){
              if(!localStorage.getItem('ycgk.lvl.'+i)){ localStorage.setItem('ycgk.lvl.'+i,'1'); hit('ycgk.lvl.'+i); }
            }
            lastLvl=n;
          }
        }catch(e){}
      },8000);
    }catch(e){}
  }catch(e){}
})();
</script>
<script>
/* cloud sync layer v1: 学习码多设备同步 */
(function(){
  var SYNC_FLAG="yicheng-gk-sync-v1", HINT_FLAG="yicheng-gk-sync-hint-v1";
  var BASE="https://textdb.online", PRE="ycgkS1-", CHUNK_ENC=5000;
  var KEYS=["yicheng-gk-fav-v1","yicheng-gk-last-v1","yicheng-gk-profile-v1","yicheng-gk-study-v1","yicheng-gk-speed-v1","yicheng-gk-points-v1"];
  var CODE_CHARS="0123456789";
  function rd(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
  function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function getSync(){return rd(SYNC_FLAG)||{}}
  function setSync(o){wr(SYNC_FLAG,o)}
  function myCode(){var s=getSync();return (s&&s.code)||""}
  function genCode(){var r="";for(var i=0;i<6;i++)r+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return r}
  function snapshot(){var o={};KEYS.forEach(function(k){o[k]=rd(k)});return o}
  function snapStr(){try{return JSON.stringify(snapshot())}catch(e){return""}}
  function num(a,b){return Math.max(a||0,b||0)}
  function arrUnion(){
    var s=[],seen={};
    [].forEach.call(arguments,function(a){(a||[]).forEach(function(x){var k=typeof x==="string"?x:JSON.stringify(x);if(!seen[k]){seen[k]=1;s.push(x)}})});
    return s;
  }
  function deepMax(a,b){
    if(a===null||a===undefined)return b;
    if(b===null||b===undefined)return a;
    if(typeof a==="number"&&typeof b==="number")return Math.max(a,b);
    if(Array.isArray(a)||Array.isArray(b))return arrUnion(a,b);
    if(typeof a==="object"&&typeof b==="object"){
      var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=deepMax(o[k],b[k]);return o;
    }
    return b;
  }
  /* ---- cloud io ---- */
  var EP_KEY="yicheng-gk-sync-ep-v1";
  var ENDPOINTS=[
    {name:"主线路",get:function(key,cb){fetch("https://textdb.online/"+key,{method:"GET"}).then(function(r){return r.text()}).then(function(t){cb(null,t)}).catch(function(e){cb(e)})},
     put:function(key,val,cb){fetch("https://textdb.online/update/?key="+encodeURIComponent(key)+"&value="+encodeURIComponent(val)).then(function(r){return r.json()}).then(function(j){cb(null,j)}).catch(function(e){cb(e)})}},
    {name:"备用线路",get:function(key,cb){fetch("https://textdb.dev/api/data/"+key,{method:"GET"}).then(function(r){return r.text()}).then(function(t){cb(null,t)}).catch(function(e){cb(e)})},
     put:function(key,val,cb){fetch("https://textdb.dev/api/data/"+key,{method:"POST",headers:{"Content-Type":"text/plain"},body:val}).then(function(r){if(r.ok){cb(null)}else{cb(new Error("HTTP "+r.status))}}).catch(function(e){cb(e)})}}
  ];
  function epPref(){var v=parseInt(localStorage.getItem(EP_KEY),10);return (isNaN(v)||v<0||v>=ENDPOINTS.length)?0:v}
  function epPrefer(i){try{localStorage.setItem(EP_KEY,String(i))}catch(e){}}
  function epOrder(){var p=epPref(),o=[];for(var i=0;i<ENDPOINTS.length;i++)o.push(ENDPOINTS[(p+i)%ENDPOINTS.length]);return o}
  function cloudGet(key,cb){
    var order=epOrder(),done=0,anyOK=false,err=null,got=false;
    order.forEach(function(ep){
      ep.get(key,function(e,t){
        if(e){err=e}
        else{anyOK=true;if(t&&!got){got=true;epPrefer(ENDPOINTS.indexOf(ep));cb(null,t)}}
        done++;
        if(done===order.length&&!got){cb(anyOK?null:(err||new Error("所有线路均连接失败")),null)}
      });
    });
  }
  function cloudPut(key,val,cb){
    var order=epOrder(),done=0,okAny=false,err=null;
    order.forEach(function(ep){
      ep.put(key,val,function(e){
        if(e){err=e}else{okAny=true;epPrefer(ENDPOINTS.indexOf(ep))}
        done++;
        if(done===order.length){cb(okAny?null:(err||new Error("所有线路写入失败")))}
      });
    });
  }
  function toB64(s){try{return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_")}catch(e){return s}}
  function fromB64(s){try{var b=s.replace(/-/g,"+").replace(/_/g,"/");return decodeURIComponent(escape(atob(b)))}catch(e){return null}}
  function chunkStr(s,size){
    var out=[];
    for(var i=0;i<s.length;i+=size)out.push(s.slice(i,i+size));
    return out;
  }
  var pushing=false,pullBusy=false;
  function push(cb){
    var c=myCode();if(!c){cb&&cb("nocode");return}
    if(pushing){cb&&cb("busy");return}
    pushing=true;
    var payload;try{payload=toB64(JSON.stringify({v:1,ts:Date.now(),d:snapshot()}))}catch(e){pushing=false;cb&&cb(e);return}
    var parts=chunkStr(payload,CHUNK_ENC),meta={v:1,ts:Date.now(),n:parts.length};
    var i=0,failed=null;
    function fin(){pushing=false;if(failed){cb&&cb(failed)}else{var s=getSync();s.lastPush=Date.now();setSync(s);setChip("ok");cb&&cb(null)}}
    function putMeta(){cloudPut(PRE+c,JSON.stringify(meta),function(e2){if(e2)failed=e2;fin()})}
    function next(){
      if(failed){pushing=false;cb&&cb(failed);return}
      if(i>=parts.length){putMeta();return}
      var idx=i++,tries=0;
      function attempt(){
        cloudPut(PRE+c+"-c"+idx,parts[idx],function(e){
          if(e&&tries<2){tries++;attempt();return}
          if(e)failed=e;
          next();
        });
      }
      attempt();
    }
    if(parts.length===0){fin();return}
    next();
  }
  function pull(cb){
    var c=myCode();if(!c){cb&&cb("nocode",null);return}
    if(pullBusy){cb&&cb("busy",null);return}
    pullBusy=true;
    cloudGet(PRE+c,function(e,metaTxt){
      if(e){pullBusy=false;cb&&cb(e,null);return}
      var meta=null;try{meta=metaTxt?JSON.parse(metaTxt):null}catch(err){}
      if(!meta||!meta.n){pullBusy=false;cb&&cb(null,null);return}
      var parts=new Array(meta.n),got=0,failed=null;
      if(meta.n===0){pullBusy=false;cb&&cb(null,null);return}
      for(var i=0;i<meta.n;i++){
        (function(i){
          cloudGet(PRE+c+"-c"+i,function(e2,t2){
            if(e2)failed=e2;else parts[i]=t2;
            got++;
            if(got===meta.n){
              pullBusy=false;
              if(failed){cb&&cb(failed,null);return}
              var raw=fromB64(parts.join(""));
              if(raw===null){cb&&cb("decode",null);return}
              try{cb&&cb(null,JSON.parse(raw))}catch(e3){cb&&cb(e3,null)}
            }
          });

      }

  }
  /* ---- merge ---- */
  function applyCloud(cloud){
    var before=snapStr(),loc=snapshot(),d=(cloud&&cloud.d)||{};
    var out={};
    out["yicheng-gk-fav-v1"]=arrUnion(loc["yicheng-gk-fav-v1"],d["yicheng-gk-fav-v1"]);
    var ls=loc["yicheng-gk-study-v1"]||{},cs=d["yicheng-gk-study-v1"]||{};
    var study={totalAnswered:num(ls.totalAnswered,cs.totalAnswered),totalCorrect:num(ls.totalCorrect,cs.totalCorrect),streakDays:num(ls.streakDays,cs.streakDays),moduleProgress:deepMax(ls.moduleProgress||{},cs.moduleProgress||{}),wrongQuestions:arrUnion(ls.wrongQuestions,cs.wrongQuestions)};
    var cd=cs.todayDate||"",ld=ls.todayDate||"";
    if(cd&&(!ld||cd>=ld)){
      study.todayDate=cd;
      study.todayAnswered=ld===cd?num(ls.todayAnswered,cs.todayAnswered):(cs.todayAnswered||0);
      study.todayCorrect=ld===cd?num(ls.todayCorrect,cs.todayCorrect):(cs.todayCorrect||0);
    }else{
      study.todayDate=ld;study.todayAnswered=ls.todayAnswered||0;study.todayCorrect=ls.todayCorrect||0;
    }
    var lsd=ls.lastStudyDate||"",csd=cs.lastStudyDate||"";
    study.lastStudyDate=(cs.streakDays||0)>(ls.streakDays||0)?(csd||lsd):(lsd||csd);
    out["yicheng-gk-study-v1"]=study;
    var lp=loc["yicheng-gk-last-v1"],cp=d["yicheng-gk-last-v1"];
    out["yicheng-gk-last-v1"]=(cp&&(!lp||(cloud.ts||0)>=(getSync().lastLocalTs||0)))?cp:(lp||cp);
    var lpr=loc["yicheng-gk-profile-v1"],cpr=d["yicheng-gk-profile-v1"];
    out["yicheng-gk-profile-v1"]=cpr||lpr;
    var lsp=loc["yicheng-gk-speed-v1"]||{doneIds:[],attempted:0},csp=d["yicheng-gk-speed-v1"]||{doneIds:[],attempted:0};
    out["yicheng-gk-speed-v1"]={doneIds:arrUnion(lsp.doneIds,csp.doneIds),attempted:num(lsp.attempted,csp.attempted)};
    var lpt=loc["yicheng-gk-points-v1"]||{balance:0,ledger:[]},cpt=d["yicheng-gk-points-v1"]||{balance:0,ledger:[]};
    out["yicheng-gk-points-v1"]={balance:num(lpt.balance,cpt.balance),ledger:arrUnion(lpt.ledger,cpt.ledger).slice(-500)};
    KEYS.forEach(function(k){if(out[k]!==null&&out[k]!==undefined)wr(k,out[k])});
    var s=getSync();s.appliedTs=cloud.ts||Date.now();s.lastLocalTs=Date.now();setSync(s);
    return snapStr()!==before;
  }
  /* ---- ui ---- */
  var chip=null,chipState="";
  function setChip(st){
    chipState=st;if(!chip)return;
    if(!myCode()){chip.classList.add("yc-sync-off");chip.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a5 5 0 0 1 5 5v3h1a2 2 0 0 1 2 2v6H4v-6a2 2 0 0 1 2-2h1V8a5 5 0 0 1 5-5z"/></svg><span>登录同步</span>';return}

  function openModal(){

        fetch("https://textdb.dev/api/data/ycgkS1-selftest",{cache:"no-store"}).then(function(r){return r.text().then(function(){res[1]=true;fin()})}).catch(function(e){res[1]=false;fin()});

      }
    },4000);
  }
  /* ---- engine ---- */
  var lastPushed=snapStr(),pushTimer=null;
  function loop(){
    if(myCode()&&!pushing&&!pullBusy){
      var cur=snapStr();
      if(cur!==lastPushed){

          pushTimer=null;
          if(myCode()){setChip("busy");push(function(e){if(!e)lastPushed=snapStr();else setChip("err")})}
        },4000);
      }
    }
  }
  function bootPull(){
    if(!myCode())return;
    var tries=0;
    function attempt(){
      setTimeout(function(){
        pull(function(e,cloud){
          if(e&&tries<3){tries++;attempt();return}
          if(e||!cloud)return;
          var s=getSync();
          if((cloud.ts||0)>(s.appliedTs||0)){
            var changed=applyCloud(cloud);
            if(changed&&!sessionStorage.getItem("yc-sync-reload")){sessionStorage.setItem("yc-sync-reload",String(Date.now()));location.reload()}
          }
        });
      },tries?3000:2500);
    }
    attempt();
  }
  function boot(){
    var tries=0;
    var t=setInterval(function(){if(addChip()||++tries>20)clearInterval(t)},300);
    hint();bootPull();
    setInterval(loop,6000);
    setInterval(function(){if(!document.hidden)pullNow()},90000);
    document.addEventListener("visibilitychange",function(){
      if(document.hidden&&myCode()&&snapStr()!==lastPushed){setChip("busy");push(function(e){if(!e)lastPushed=snapStr();setChip("")})}
      if(!document.hidden)pullNow();
    });
  }
  /* 其他设备有新进度时，温和提示刷新，不打断做题 */
  function pullNow(){
    if(!myCode()||pushing||pullBusy)return;
    pull(function(e,cloud){
      if(e||!cloud)return;
      var s=getSync();
      if((cloud.ts||0)>(s.appliedTs||0)){

    document.body.appendChild(b);
    setTimeout(function(){try{if(b.parentNode)b.remove()}catch(e){}},30000);
  }
  var css=document.createElement("style");
  css.textContent=".yc-sync-ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}.yc-sync-ov.on{display:flex}.yc-sync-card{background:#fff;border-radius:16px;padding:22px 20px;max-width:360px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}.yc-sync-card h3{margin:0 0 10px;font-size:17px;color:#0f172a}.yc-sync-tip{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:14px}.yc-sync-in{width:100%;box-sizing:border-box;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 12px;font-size:16px;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}.yc-sync-btn{width:100%;box-sizing:border-box;border:1.5px solid #e2e8f0;background:#f8fafc;color:#334155;border-radius:10px;padding:11px 0;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}.yc-sync-btn.main{background:#4f46e5;border-color:#4f46e5;color:#fff}.yc-sync-btn.danger{color:#dc2626;border-color:#fecaca;background:#fef2f2}.yc-sync-btn:disabled{opacity:.6}.yc-sync-div{text-align:center;color:#94a3b8;font-size:12px;margin:10px 0 0}.yc-sync-code{font-size:30px;font-weight:800;letter-spacing:6px;text-align:center;color:#4f46e5;margin:14px 0 10px;font-family:monospace}.yc-sync-err{font-size:13px;color:#dc2626;min-height:18px;margin-top:8px;text-align:center}.yc-sync-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f172a;color:#fff;font-size:13px;padding:10px 14px;border-radius:12px;z-index:99998;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}.yc-sync-hint i{font-style:normal;color:#93c5fd;font-weight:600;cursor:pointer;white-space:nowrap}.yc-sync-hint b{color:#fde68a;letter-spacing:1px}#ycChipAcc.yc-sync-off{color:#d97706;border-color:#fcd34d}@media (max-width:480px){#ycChipAcc span{display:none}#ycChipAcc{padding:6px 9px}}";
  document.head.appendChild(css);
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

<script>

(function(){
  var GET_URLS=["https://textdb.online/","https://textdb.dev/api/data/"];

    return c;

  function refKey(code){return "ycgkS1-ref-"+code}
  function cloudGet(key,cb){
    var done=0,got=false,err=null;
    GET_URLS.forEach(function(u){
      fetch(u+key,{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
        if(t&&!got){got=true;cb(null,t)}
        done++;if(done===GET_URLS.length&&!got)cb(err||new Error("网络不通"),null);
      }).catch(function(e){err=e;done++;if(done===GET_URLS.length&&!got)cb(err,null)});
    });
  }
  function cloudPut(key,val,cb){
    var done=0,ok=false;
    function fin(){done++;if(done===2)cb(ok?null:new Error("写入失败"))}
    fetch("https://textdb.online/update/?key="+encodeURIComponent(key)+"&value="+encodeURIComponent(val)).then(function(){fin()},function(){fin()});
    fetch("https://textdb.dev/api/data/"+key,{method:"POST",headers:{"Content-Type":"text/plain"},body:val}).then(function(r){if(r.ok)ok=true;fin()},function(){fin()});
  }
  function parseN(t){var n=parseInt(String(t||"").trim(),10);return isNaN(n)?0:n}

        '<div class="yc-share-rule"><b>一对一综应批改</b><span>100 分</span></div>'+
        '<div class="yc-share-rule"><b>30 分钟一对一咨询</b><span>600 分 · 政策 / 选岗 / 报名方向问诊</span></div>'+
      '</div>'+
      '<button class="yc-sync-btn" id="ycShareRedeem">兑换详情 · 认识亿成老师 ›</button>'+
      '<button class="yc-sync-btn" id="ycShareClose">关闭</button>';
    card.querySelector("#ycShareCopy").addEventListener("click",function(){
      var btn=this;
      copyText(shareLink(),function(){btn.textContent="已复制！去微信 / QQ 粘贴发给同学";try{new Image().src="https://visitor-badge.laobi.icu/badge?page_id=ycgk.sharecopy&r="+Date.now()}catch(e){}setTimeout(function(){btn.textContent="复制邀请链接"},3500)},function(){window.prompt("全选复制下面的链接：",shareLink())});
    });
    card.querySelector("#ycShareNative").addEventListener("click",function(){
      var txt="我在用亿成老师的公考刷题应用，题库全免费，邀请你一起刷：";
      if(navigator.share){navigator.share({title:"亿成公考",text:txt,url:shareLink()}).catch(function(){})}
      else{copyText(txt+shareLink(),function(){alert("链接已复制，去微信 / QQ 粘贴发给同学吧")},function(){window.prompt("全选复制下面的链接：",shareLink())})}
    });
    card.querySelector("#ycShareRedeem").addEventListener("click",function(){window.location.href="teacher.html"});
    card.querySelector("#ycShareClose").addEventListener("click",function(){shOv.classList.remove("on")});
    getRefCount(myCode(),function(e,n){
      var el=document.getElementById("ycShareStats");
      if(!el)return;
      var bal=(window.getPoints&&getPoints().balance)||0;
      el.textContent=n>0?("已邀请 "+n+" 人 · 邀请积分 +"+(n*10)+" 分 · 当前积分 "+bal):"还没有同学通过你的链接来，快去分享吧";
    });
    creditReferrals();
    try{new Image().src="https://visitor-badge.laobi.icu/badge?page_id=ycgk.share&r="+Date.now()}catch(e){}
    shOv.classList.add("on");
  }
  /* 积分中心补一条邀请规则 */
  function patchPointsModal(){
    if(window.__ycShareRulePatched)return;
    var rules=document.querySelectorAll(".yc-rule");
    for(var i=0;i<rules.length;i++){
      if(rules[i].textContent.indexOf("邀请好友")>-1){window.__ycShareRulePatched=true;return}
      if(rules[i].textContent.indexOf("兑换商城筹备中")>-1){
        var d=document.createElement("div");
        d.className="yc-rule";
        d.innerHTML='<b>邀请好友 +10 / 人</b><span>点首页「邀请好友」卡片，拿专属链接</span>';
        rules[i].parentNode.insertBefore(d,rules[i]);
        window.__ycShareRulePatched=true;return;
      }
    }
  }
  var css=document.createElement("style");
  css.textContent="#yc-share-card{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:14px 16px;border-radius:14px;background:linear-gradient(90deg,#4F46E5,#4338CA);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(79,70,229,.28)}#yc-share-card:active{transform:scale(.985)}#yc-share-card .yc-share-ic{font-size:26px !important;flex:none}.yc-share-t{font-size:15px;font-weight:800;letter-spacing:.5px}.yc-share-s{font-size:11px;opacity:.92;margin-top:2px}.yc-share-go{font-size:12px;font-weight:700;flex:none;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}.yc-share-link{background:#f1f5f9;border:1.5px dashed #c7d2fe;border-radius:10px;padding:10px 12px;font-size:12px;word-break:break-all;color:#4338ca;margin-bottom:4px}.yc-share-stats{font-size:13px;color:#475569;margin-top:10px;text-align:center}.yc-share-rules{margin-top:12px;border-top:1px solid #eef2f7;padding-top:10px}.yc-share-rt{font-size:12px;color:#94a3b8;margin-bottom:8px}.yc-share-rule{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#0f172a;padding:4px 0}.yc-share-rule b{font-weight:700}.yc-share-rule span{color:#4f46e5;font-weight:700;font-size:12.5px;text-align:right}.yc-wl-st{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13.5px;line-height:1.6;color:#0f172a;text-align:left}.yc-wl-st>b{flex:none;width:20px;height:20px;border-radius:50%;background:#4f46e5;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}.yc-wl-st span{flex:1}.yc-wl-st .kb{background:#eef2ff;color:#4338ca;border-radius:6px;padding:1px 6px;font-weight:800;white-space:nowrap}.yc-wl-wx{background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#9a3412;margin-bottom:6px}";
  document.head.appendChild(css);
  /* 新同学首次打开：安装到桌面引导 */
  function welcomeGuide(){
    var seen=false;
    try{seen=!!localStorage.getItem("ycgk.welcomeSeen")}catch(e){}
    if(seen)return;
    var ua=navigator.userAgent||"";
    var isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    var isHarmony=/HarmonyOS|OpenHarmony|ArkWeb/i.test(ua);
    var isMobi=isIOS||isHarmony||/Android|Mobile|Mobi/i.test(ua);
    var inWx=/MicroMessenger/i.test(ua);
    var steps="";
    if(isIOS){
      steps='<div class="yc-wl-st"><b>1</b><span>点浏览器底部中间的「分享」按钮（方框加向上箭头）</span></div>'+
            '<div class="yc-wl-st"><b>2</b><span>在弹出的菜单里选「添加到主屏幕」</span></div>'+
            '<div class="yc-wl-st"><b>3</b><span>点右上「添加」，桌面就有亿成公考图标了</span></div>';
    }else if(isMobi){
      steps='<div class="yc-wl-st"><b>1</b><span>点浏览器右上角的「⋮」菜单（华为浏览器也可能在底部「⌘」）</span></div>'+
            '<div class="yc-wl-st"><b>2</b><span>选「添加到桌面」或「安装应用」</span></div>'+
            '<div class="yc-wl-st"><b>3</b><span>点「安装」，桌面就有图标了</span></div>';
    }else{
      steps='<div class="yc-wl-st"><b>1</b><span>按 <b class="kb">Ctrl+D</b>（Mac 按 <b class="kb">⌘+D</b>）收藏本页</span></div>'+
            '<div class="yc-wl-st"><b>2</b><span>也可以把地址栏左边的图标直接拖到桌面</span></div>';
    }
    var ov=document.createElement("div");ov.className="yc-sync-ov";
    ov.innerHTML='<div class="yc-sync-card">'+
      '<h3>欢迎来到亿成公考</h3>'+
      '<div class="yc-sync-tip">题库全免费，内测期间不收一分钱。<b>建议先把应用添加到桌面</b>，以后从桌面图标进，不用再找链接：</div>'+
      (inWx?'<div class="yc-wl-wx">你现在在微信里打开，请先点右上角「···」选「在浏览器打开」，再按下面步骤操作</div>':'')+
      steps+
      '<button class="yc-sync-btn main" id="ycWlOk">好的，开始刷题</button>'+
      '</div>';
    document.body.appendChild(ov);
    try{new Image().src="https://visitor-badge.laobi.icu/badge?page_id=ycgk.wlshow&r="+Date.now()}catch(e){}
    function done(){try{localStorage.setItem("ycgk.welcomeSeen","1")}catch(e){}ov.classList.remove("on")}
    ov.addEventListener("click",function(e){if(e.target===ov)done()});
    ov.querySelector("#ycWlOk").addEventListener("click",function(){try{new Image().src="https://visitor-badge.laobi.icu/badge?page_id=ycgk.wlok&r="+Date.now()}catch(e){}done()});
    setTimeout(function(){ov.classList.add("on")},600);
  }
  function boot(){
    handleRef();
    creditReferrals();
    welcomeGuide();
    var mo=new MutationObserver(function(){addShareCard();patchPointsModal()});
    mo.observe(document.body,{childList:true,subtree:true});
    addShareCard();patchPointsModal();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>

</body></html>
