    for(var i=0;i<res.qs.length;i++){
      var q=res.qs[i]; if(res.answers[i]===q.answer) continue; n++;
      html+='<div style="border-bottom:1px solid #f0ede7;padding:12px 0;text-align:left">'+
        '<div style="font-size:13.5px;font-weight:700;color:#202020;line-height:1.6">'+n+'. '+esc(q.prompt)+'</div>'+
        qImage(q)+
        '<div style="font-size:12.5px;color:#15803D;margin-top:6px;font-weight:800">✓ 正确答案：'+letters[q.answer]+'. '+esc(q.options[q.answer])+'</div>'+
        (res.answers[i]!==undefined?'<div style="font-size:12.5px;color:#b91c1c;margin-top:3px">✗ 你选的：'+letters[res.answers[i]]+'. '+esc(q.options[res.answers[i]])+'</div>':'')+
        (q.explanation?'<div style="font-size:12px;color:#8a8378;margin-top:7px;line-height:1.6">解析：'+esc(q.explanation)+'</div>':'')+
        '</div>';
    }
    if(!n) html+='<div class="yc-ob-sub" style="margin-top:20px">🎉 全对，没有错题！</div>';
    html+='<button class="yc-ob-primary" id="rvBack">返回结果</button>';
    openCard('ycObReview',html,{closable:true,wide:true});
    $('rvBack').addEventListener('click',function(){ screenResult(res,null); });
  }

  /* ---------- 复制文本 ---------- */
  function copyText(text,msg){
    function done(){ toast(msg||'已复制'); }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){fallback();}); }
      else fallback();
    }catch(e){ fallback(); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请长按网址手动复制'); }
      document.body.removeChild(ta);
    }
  }
  function toast(msg){
    var t=document.createElement('div');
    t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,16,12,.9);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:2147483647;box-shadow:0 4px 14px rgba(0,0,0,.3)';
    t.textContent=msg; document.body.appendChild(t);
    setTimeout(function(){ if(t.parentNode)t.parentNode.removeChild(t); },2200);
  }
  function refreshInstallBtn(){ /* 预留：顶部安装按钮状态由 14 号维护 */ }

  /* ---------- B4：今日计划 X/Y ---------- */
  function planDaily(){
    try{ var p=JSON.parse(localStorage.getItem(K_PLAN)||'null'); return p&&p.daily?p.daily:0; }catch(e){ return 0; }
  }
  function todayDone(){
    try{
      var d=new Date();
      function pk(x){ return ''+x.getFullYear()+('0'+(x.getMonth()+1)).slice(-2)+('0'+x.getDate()).slice(-2); }
      var k=pk(d), n=0;
      var st=null; try{ st=JSON.parse(localStorage.getItem('ycgk-stat')||'null'); }catch(e){ st=null; }
      if(st&&st.quiz&&st.quiz.d&&st.quiz.d[k]) n+=(st.quiz.d[k].n||0);
      var buf=null; try{ buf=JSON.parse(localStorage.getItem('ycgk.tl.buf')||'null'); }catch(e){ buf=null; }
      if(buf&&buf.quiz&&buf.quiz.d&&buf.quiz.d[k]) n+=(buf.quiz.d[k].n||0);
      return n;
    }catch(e){ return 0; }
  }
  function planBtnLabel(){
    var daily=planDaily();
    if(!daily) return '📋 计划';
    var done=Math.min(todayDone(),daily);
    return '📋 今日计划 '+done+'/'+daily;
  }

  /* ---------- B0：设置入口 —— 弹窗提醒总开关 ---------- */
  function openPopSettings(){
    try{
      if(!(window.YCNotify&&YCNotify.openModal)) return;
      var on=YCNotify.masterOn();
      var rec=YCNotify.openModal({wide:false,closable:true,html:
        '<div class="yc-ob-h" style="margin-bottom:4px">设置</div>'+
        '<div class="yc-ob-sub" style="text-align:left">控制是否自动弹出安装引导、学习计划等提醒</div>'+
        '<label style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F7F5F0;border-radius:12px;padding:14px;margin:12px 0;font-weight:800;color:#202020;font-size:14px">'+
        '<span>🔔 弹窗提醒</span><input type="checkbox" id="ycPopMaster" '+(on?'checked':'')+' style="width:22px;height:22px;accent-color:#DC2626">'+
        '</label>'+
        '<div style="font-size:12px;color:#8a8378;line-height:1.6">关闭后，安装引导、学习计划等自动弹窗不再出现；公告条与手动入口不受影响。</div>'+
        '<button class="yc-ob-primary" id="ycPopSetOk">好的</button>'
      });
      var cb=document.getElementById('ycPopMaster');
      if(cb) cb.addEventListener('change',function(){ try{ YCNotify.setMaster(cb.checked); }catch(e){} });
      var okb=document.getElementById('ycPopSetOk');
      if(okb) okb.addEventListener('click',function(){ rec.close(); });
    }catch(e){}
  }

  /* ---------- 常驻入口：顶部按钮 + 底部 tab ---------- */
  function injectEntries(){
    var actions=document.querySelector('.yc-top-actions');
    if(actions && !$('ycPopSetBtn')){
      var sb=document.createElement('button'); sb.id='ycPopSetBtn'; sb.className='yc-plan-btn';
      sb.textContent='⚙️'; sb.title='设置'; sb.setAttribute('aria-label','设置');
      sb.addEventListener('click',openPopSettings);
      actions.insertBefore(sb,actions.firstChild);
    }
    if(actions && !$('ycPlanTopBtn')){
      var b=document.createElement('button'); b.id='ycPlanTopBtn'; b.className='yc-plan-btn';
      b.textContent=planBtnLabel();
      b.addEventListener('click',function(){ screenPlan(true); });
      actions.insertBefore(b,actions.firstChild);
    }
    var tabbar=document.querySelector('.yc-tabbar');
    if(tabbar && !$('ycPlanTabBtn')){
      var btn=document.createElement('button'); btn.id='ycPlanTabBtn'; btn.className='yc-plan-tab';
      btn.innerHTML='<span class="mi">📋</span><span class="lb">'+(planDaily()?planBtnLabel().replace('📋 ',''):'计划')+'</span>';
      btn.addEventListener('click',function(){ screenPlan(true); });
      tabbar.appendChild(btn);
    }
    var mockBtn=null;
    if(tabbar && !$('ycMockTabBtn')){
      var mb=document.createElement('button'); mb.id='ycMockTabBtn'; mb.className='yc-plan-tab';
      mb.innerHTML='<span class="mi">📝</span><span class="lb">模考</span>';
      mb.addEventListener('click',function(){ screenMock('全部'); });
      tabbar.appendChild(mb);
    }
  }
  var tries=0,ij=setInterval(function(){ injectEntries(); if((document.querySelector('.yc-tabbar')&&document.querySelector('.yc-top-actions'))||++tries>40) clearInterval(ij); },150);
  document.addEventListener('DOMContentLoaded',injectEntries);

  /* ---------- 低频安装轻提醒：未装桌面且距上次提醒≥3天，弹非阻断浮条（已装永不提醒） ---------- */
  var K_REM='ycgk.installRemind.v1';
  function softInstallRemind(){
    try{
      if(installDone()) return;
      if(installDismissed()) return;
      if(window.YCNotify){
        if(!YCNotify.canShow('installSoft')) return;
        YCNotify.markShown('installSoft'); /* 3 天冷却 */
      }else{
        var last=0; try{ last=parseInt(raw(K_REM)||'0',10)||0; }catch(e){}
        if(Date.now()-last < 3*86400000) return;
        try{ set(K_REM,String(Date.now())); }catch(e){}
      }
    }catch(e){ return; }
    setTimeout(function(){
      if(document.getElementById('ycSoftInst')) return;
      var bar=document.createElement('div'); bar.id='ycSoftInst';
      bar.style.cssText='position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2147483001;background:#1F2937;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;box-shadow:0 6px 22px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font-family:inherit;white-space:nowrap;max-width:92vw';
      var tx=document.createElement('span'); tx.textContent='📱 还没装到桌面？装好一点就开，离线也能刷';
      var go=document.createElement('button'); go.textContent='去安装';
      go.style.cssText='background:#DC2626;color:#fff;border:none;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit';
      go.addEventListener('click',function(){ if(bar.parentNode)bar.parentNode.removeChild(bar); window.location.href='install.html'; });
      var x=document.createElement('button'); x.textContent='×';
      x.style.cssText='background:none;border:none;color:#9ca3af;font-size:17px;cursor:pointer;padding:0 2px;font-family:inherit';
      x.addEventListener('click',function(){ if(window.YCNotify){ try{ YCNotify.dismiss('installSoft'); }catch(e){} } else { dismissInstall(); } if(bar.parentNode)bar.parentNode.removeChild(bar); });
      bar.appendChild(tx); bar.appendChild(go); bar.appendChild(x);
      document.body.appendChild(bar);
      setTimeout(function(){ if(bar.parentNode) bar.parentNode.removeChild(bar); },9000);
    },5000);
  }

  /* ---------- 启动：首启引导流程 ---------- */
  function start(){
    try{
      /* B2 总开关：设置里关闭后，不自动弹任何引导/提醒 */
      if(window.YCNotify&&!YCNotify.masterOn()) return;
      var step=raw(K_ONB)||'0';
      if(step==='2'){ softInstallRemind(); return; } // 已完成引导，正常用
      /* 已填过学习计划的用户（含旧版本键）：视为已完成引导，绝不再弹表单或安装引导 */
      if(hasAnyPlan()){ set(K_ONB,'2'); softInstallRemind(); return; }
      /* 30天内点过「暂不设置，先逛逛」：跳过整个引导链，计划入口常驻菜单 */
      if(planLaterActive()){ set(K_ONB,'2'); softInstallRemind(); return; }
      if(step==='0'&&installDone()){ step='1'; set(K_ONB,'1'); } // 已装过桌面：跳过安装引导
      /* 微信/QQ 内置浏览器装不了 PWA：不自动弹安装引导，常驻入口里给「在浏览器打开」指引 */
      if(inAppBrowser()){ return; }
      /* B4：学习计划表单自动弹出仅限学习时段（7:00–23:00），每天最多 1 次 */
      var nowD=new Date(), h=nowD.getHours();
      var dkey=(window.YCNotify?YCNotify.P:'ycgk.pop.')+'d.planForm';
      var shownToday=false; try{ shownToday=(localStorage.getItem(dkey)===nowD.toDateString()); }catch(e){}
      if(step==='1'&&(h<7||h>=23||shownToday)){ softInstallRemind(); return; }
      /* 频控：3 天冷却（非永久）；累计访问不满 3 次（已访问 2 次以上才允许）不弹；每次会话最多 1 次 */
      var visits=0; try{ visits=parseInt(raw(K_VISITS)||'0',10)||0; }catch(e){}
      visits++; set(K_VISITS,String(visits));
      var sessPopped=false; try{ sessPopped=!!sessionStorage.getItem(K_SESS_POP); }catch(e){}
      if(installDismissed()||sessPopped||visits<3){ softInstallRemind(); return; }
      try{ sessionStorage.setItem(K_SESS_POP,'1'); }catch(e){}
      try{ localStorage.setItem(dkey,nowD.toDateString()); }catch(e){}
      if(window.YCNotify) YCNotify.markShown('install'); /* 记 3 天冷却 */
      /* B1：自动弹窗延迟 ≥2s，做题/模考页面不弹 */
      setTimeout(function(){
        try{
          if(window.YCNotify&&YCNotify.inExamView()) return;
          if(step==='0') screenInstall();
          else if(step==='1') screenForm();
        }catch(e){}
      },2000);
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>

<script>
/* 亿成公考 · 内测公告（实时时间 + 问卷引导） */
(function(){
  if(document.getElementById('yc-notice')) return;
  var css=document.createElement('style');
  css.textContent=
    '#yc-notice{position:fixed;top:0;left:0;right:0;z-index:2147483000;'+
      'background:linear-gradient(90deg,#B91C1C,#EA580C);color:#fff;'+
      'font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;'+
      'box-shadow:0 2px 10px rgba(0,0,0,.22);}'+
    '.yc-notice-inner{max-width:960px;margin:0 auto;display:flex;align-items:flex-start;gap:8px;'+
      'padding:7px 40px 7px 12px;font-size:12.5px;line-height:1.55;position:relative;}'+
    '.yc-notice-tag{flex:none;background:rgba(255,255,255,.22);border-radius:4px;'+
      'padding:1px 7px;font-weight:700;white-space:nowrap;}'+
    '.yc-notice-text{flex:1;}'+
    '.yc-notice-text a{color:#FDE68A;font-weight:700;text-decoration:underline;}'+
    '.yc-notice-close{position:absolute;top:5px;right:8px;background:none;border:none;'+
      'color:#fff;font-size:19px;line-height:1;cursor:pointer;opacity:.9;padding:2px 6px;}'+
    '.yc-notice-upd{flex:none;align-self:center;background:#FDE68A;color:#7F1D1D;border:none;'+
      'border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;cursor:pointer;'+
      'box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap;font-family:inherit;}'+
    '.yc-notice-upd:active{transform:scale(.95)}'+
    '.yc-notice-upd:disabled{opacity:.6}'+
    '#yc-upd-float{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);'+
      'z-index:2147483001;background:#1F2937;color:#FDE68A;border:1.5px solid #FDE68A;border-radius:999px;'+
      'padding:10px 18px;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.4);'+
      'font-family:system-ui,-apple-system,"PingFang SC",sans-serif;display:none;white-space:nowrap;}'+
    '#yc-upd-float:active{transform:translateX(-50%) scale(.96)}'+
    /* 公告条固定后，顶栏与正文整体下移，滚动时顶部完全不动。
       正文留白改为实测头部总高（公告条+顶栏），不再用 60/92px 估算，消除移动端大片空白 */
    /* 修复点：非独立模式下补回安全区间距（与修改点④口径一致），公告条/顶栏/正文整体随安全区下移，
       消除刘海屏 webview 内公告条压住刷题页头部与题干首行的问题；浏览器与 PWA standalone 下 --yc-sat=0，行为不变 */
    '#yc-notice{top:var(--yc-sat,0px)}'+
    '.yc-topbar{top:calc(var(--yc-notice-h,0px) + var(--yc-sat,0px))!important}'+
    'body.yc-ui{padding-top:calc(var(--yc-head-h,60px) + var(--yc-sat,0px))!important}';
  document.head.appendChild(css);
  /* 通告栏已下线（时有时无体验差）：更新内容改在首页内测横幅「实时更新」一行展示；
     保留 box 空壳供 measure() 计算头部高度（未插入 → 高度0），一键更新逻辑全部保留在顶栏按钮 */
  var box=document.createElement('div');
  box.id='yc-notice';
  box.style.display='none';

  function doUpdate(btn){
    /* 不再用 confirm 弹窗：部分平板/内嵌浏览器会拦截 confirm，导致点了毫无反应 */
    if(btn){ btn.disabled=true; btn.textContent='更新中…'; }
    /* B6：新版本处于 waiting 时，用户点击浮条/一键更新才正式激活并刷新 */
    try{
      if(navigator.serviceWorker){
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(reg&&reg.waiting){ try{ reg.waiting.postMessage({type:'yc-skip-waiting'}); }catch(e){} }
        });
      }
    }catch(e){}
    var go=function(){
      try{ sessionStorage.setItem('ycUpdOk', String(Date.now())); }catch(e){}
      /* 强制从网络重新拉取最新 index.html，绕过浏览器缓存，确保更新真实生效 */
      if(window.fetch){
        fetch(location.pathname, {cache:'reload'}).then(function(){ location.replace(location.pathname+'?upd='+Date.now()); }).catch(function(){ location.replace(location.pathname+'?upd='+Date.now()); });
      } else {
        location.replace(location.pathname+'?upd='+Date.now());
      }
    };
    /* 把当前页面用到的所有脚本、样式也强制走一次网络，刷新浏览器缓存，
       这样即使文件名没变（版本戳没升），更新后也立刻是最新内容 */
    var refreshAssets=function(){
      if(!window.fetch) return Promise.resolve();
      var seen={}, urls=[], els=document.querySelectorAll('script[src],link[href]');
      for(var i=0;i<els.length;i++){
        var u=els[i].src||els[i].href;
        if(!u) continue;
        try{ u=new URL(u, location.href).href; }catch(e){ continue; }
        if(!/^https?:/.test(u)) continue;
        if(u.indexOf(location.origin)!==0) continue; /* 只刷本站资源 */
        if(seen[u]) continue; seen[u]=1; urls.push(u);
      }
      return Promise.all(urls.map(function(u){
        return fetch(u, {cache:'reload'}).catch(function(){});
      }));
    };
    var swClear=function(){
      return new Promise(function(resolve){
        if(!navigator.serviceWorker || !navigator.serviceWorker.controller){ resolve(); return; }
        try{
          var ch=new MessageChannel(), done=false;
          ch.port1.onmessage=function(){ if(!done){done=true;resolve();} };
          setTimeout(function(){ if(!done){done=true;resolve();} },1500);
          navigator.serviceWorker.controller.postMessage({type:'yc-clear-cache'},[ch.port2]);
        }catch(e){ resolve(); }
      });
    };
    swClear().then(function(){ return refreshAssets(); }).then(go).catch(go);
  }

  function bindUpd(){
    var b=document.getElementById('yc-notice-upd');
    if(b && !b.dataset.bound){ b.dataset.bound='1'; b.addEventListener('click',function(){ doUpdate(b); }); }
    /* 顶栏常驻一键更新：公告条关闭/消失时也能真刷新整个应用 */
    var c=document.getElementById('ycChipUpd');
    if(c && !c.dataset.bound){
      c.dataset.bound='1';
      c.addEventListener('click',function(){
        if(c.classList.contains('yc-updating')) return;
        c.classList.add('yc-updating');
        c.textContent='⟳ 更新中…';
        doUpdate(c);
      });
    }
  }
  bindUpd();

  /* 顶栏一键更新首次提示（只提示一次）：告诉大家这个按钮是干什么的 */
  (function(){
    try{
      if(localStorage.getItem('ycgk.pop.done.updChipHint')==='1') return;
      localStorage.setItem('ycgk.pop.done.updChipHint','1');
      var show=function(){
        var t=document.createElement('div');
        t.id='yc-upd-chip-hint';
        t.textContent='顶栏新增「一键更新」：卡顿、打不开时点它，立刻刷新整个应用到最新版';
        t.style.cssText='position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2147483002;'+
          'background:#1F2937;color:#FDE68A;border:1.5px solid #FDE68A;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;'+
          'box-shadow:0 6px 22px rgba(0,0,0,.4);font-family:inherit;max-width:86vw;line-height:1.6;';
        var drop=function(){ if(t.parentNode){ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },450); } };
        document.body.appendChild(t);
        setTimeout(drop,4200);
      };
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',show); else setTimeout(show,800);
    }catch(e){}
  })();

  /* 更新完成提示：一键更新跳转回来后，明确告诉用户"已经是最新版" */
  (function(){
    var ok=null;
    try{ ok=sessionStorage.getItem('ycUpdOk'); if(ok) sessionStorage.removeItem('ycUpdOk'); }catch(e){}
    if(!ok) return;
    var t=document.createElement('div');
    t.id='yc-upd-toast';
    t.textContent='✓ 已更新到最新版本';
    t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483647;'+
      'background:#15803D;color:#fff;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700;'+
      'box-shadow:0 6px 22px rgba(21,128,61,.35);font-family:inherit;white-space:nowrap;';
    var mount2=function(){
      if(!document.body){ setTimeout(mount2,120); return; }
      document.body.appendChild(t);
      setTimeout(function(){ t.style.transition='opacity .4s'; t.style.opacity='0'; },2600);
      setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },3100);
    };
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount2); else mount2();
  })();

  function showFloat(){
    if(document.getElementById('yc-upd-float')) return;
    try{ if(window.YCNotify&&!YCNotify.canShow('updFloat')) return; }catch(e){}
    try{ var h=parseInt(localStorage.getItem('ycgk.updfloat.hide')||'0',10)||0; if(h&&Date.now()-h<86400000) return; }catch(e){}
    var f=document.createElement('button');
    f.id='yc-upd-float';
    f.textContent='🆕 有新版本 · 点这里一键更新';
    f.addEventListener('click',function(){ doUpdate(f); });
    var x=document.createElement('span');
    x.textContent='×'; x.title='暂不提醒（24小时）';
    x.style.cssText='margin-left:6px;color:#e5e7eb;font-size:17px;cursor:pointer;padding:2px 8px;';
    x.addEventListener('click',function(ev){ ev.stopPropagation(); try{ localStorage.setItem('ycgk.updfloat.hide',String(Date.now())); }catch(e){} try{ if(window.YCNotify) YCNotify.dismiss('updFloat'); }catch(e){} if(f.parentNode)f.parentNode.removeChild(f); });
    f.appendChild(x);
    document.body.appendChild(f);
  }
  if(navigator.serviceWorker){
    navigator.serviceWorker.getRegistration().then(function(reg){

  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
})();

<script>

  function pad(n){return ('0'+n).slice(-2)}

  function saveBuf(){try{localStorage.setItem(BUFK,JSON.stringify(B))}catch(e){}}

  function backBuf(snap){

  /* ---- 合并进聚合池 ---- */

  function pruneStat(p){

    trim(p.err.d,14);trim(p.perf.d,14);trim(p.quiz.d,30);trim(p.sess.d,30);trim(p.sess.dur,30);

      function(){trim(p.err.d,7);trim(p.perf.d,7);trim(p.quiz.d,7);trim(p.sess.d,7);trim(p.sess.dur,7)},
      function(){p.perf={d:{}}},
      function(){trim(p.quiz.d,3);trim(p.sess.d,3);trim(p.sess.dur,3)}

  }
  function mergeStat(pool,snap){
    var p=pool&&typeof pool==='object'?pool:{};
    var today=dayKey();
    if(!p.inst||typeof p.inst!=='object')p.inst={t:0,d:{},os:{}};
    if(!p.err||typeof p.err!=='object')p.err={d:{}};
    if(!p.perf||typeof p.perf!=='object')p.perf={d:{}};
    if(!p.quiz||typeof p.quiz!=='object')p.quiz={d:{}};
    if(!p.sess||typeof p.sess!=='object')p.sess={d:{},dur:{}};
    if(snap.inst&&snap.inst.n){
      p.inst.t=(p.inst.t||0)+snap.inst.n;
      p.inst.d[today]=(p.inst.d[today]||0)+snap.inst.n;
      Object.keys(snap.inst.os).forEach(function(k){p.inst.os[k]=(p.inst.os[k]||0)+snap.inst.os[k]});
    }
    if(snap.err&&snap.err.n){
      var e=p.err.d[today]||(p.err.d[today]={n:0,top:{}});
      e.n+=snap.err.n;
      Object.keys(snap.err.top).forEach(function(m){e.top[m]=(e.top[m]||0)+snap.err.top[m]});
      var tks=Object.keys(e.top);
      if(tks.length>10){tks.sort(function(a,b){return e.top[b]-e.top[a]});var keep={};for(var i=0;i<10;i++)keep[tks[i]]=e.top[tks[i]];e.top=keep}
    }
    if(snap.perf&&snap.perf.length){
      var arr=p.perf.d[today]||(p.perf.d[today]=[]);
      snap.perf.forEach(function(v){arr.push(v)});
      if(arr.length>200)p.perf.d[today]=arr.slice(-200);

      Object.keys(snap.sess.d||{}).forEach(function(d){p.sess.d[d]=(p.sess.d[d]||0)+snap.sess.d[d]});
      Object.keys(snap.sess.dur||{}).forEach(function(d){p.sess.dur[d]=(p.sess.dur[d]||0)+snap.sess.dur[d]});
    }
    if(snap.quiz){
      Object.keys(snap.quiz.d||{}).forEach(function(d){
        var q=snap.quiz.d[d],t=p.quiz.d[d]||(p.quiz.d[d]={n:0,c:0,dur:0,stk:0,mods:{},subs:{},diffs:{}});
        t.n+=q.n||0;t.c+=q.c||0;t.dur+=q.dur||0;t.stk=Math.max(t.stk||0,q.stk||0);

  function doFlush(part){
    if(part==='quiz'){if(busy){pendQ=true;return}if(!B.quiz)return}
    else{if(busy)return;if(!B.inst&&!B.err&&!(B.perf&&B.perf.length)&&!B.sess)return}

      var merged=mergeStat(pool,snap);
      put(LS,merged,function(ok){
        if(ok){busy=false;if(pendQ){pendQ=false;doFlush('quiz')}}

      });

  });

  try{lastAns=JSON.parse(localStorage.getItem(ANSK)||'null')}catch(e){}

  /* ---- UA画像：品牌/网络/分辨率/来源 → 实时池设备记录（每次会话写一次，随机延迟避让 11-part） ---- */
  function brandOf(){var ua=navigator.userAgent||'';

    if(/Redmi|Xiaomi|MIUI|MIX|MI \d/i.test(ua))return '小米';
    if(/OPPO|PADM|PCTM/i.test(ua))return 'OPPO';

  function screenStr(){try{return screen.width+'x'+screen.height+'@'+(window.devicePixelRatio||1)}catch(e){return ''}}

  }
  function writeProfile(){
    get('ycgk-live-v1',function(pool){

      if(osvM)rec.osv=osvM[1].replace('_','.');

  if(B.inst||B.err||(B.perf&&B.perf.length)||B.sess)setTimeout(function(){doFlush('base')},20000);
})();
