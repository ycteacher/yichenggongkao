<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>亿成公考 · 数据看板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#FBF9F4;color:#202020;min-height:100vh;padding:16px 14px 40px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:#15803D;display:inline-block}
  .sub{font-size:12px;color:#8A8378;margin-top:4px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .card{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px rgba(32,32,32,.06)}
  .card .num{font-size:28px;font-weight:800;color:#15803D;line-height:1.2;font-variant-numeric:tabular-nums}
  .card .lab{font-size:12px;color:#8A8378;margin-top:2px}
  .card.hl{background:#15803D}
  .card.hl .num,.card.hl .lab{color:#fff}
  .sec{margin-top:22px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(32,32,32,.06)}
  .sec h2{font-size:15px;font-weight:700;margin-bottom:12px}
  .chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
  .bar-w{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:#15803D;min-height:3px;
       transition:height .4s ease;position:relative}
  .bar.uv{background:#E4B95B}
  .bar .v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;
          color:#4A463F;font-weight:600;white-space:nowrap}
  .bar-w .d{font-size:10px;color:#B3AC9E;white-space:nowrap}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:#8A8378}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:#8A8378;font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid #F0EDE6;white-space:nowrap}
  th:first-child{text-align:left}
  td{padding:9px 6px;text-align:right;border-bottom:1px solid #F7F5F0;font-variant-numeric:tabular-nums;white-space:nowrap}
  td:first-child{text-align:left;color:#4A463F}
  tr.today td{background:#F3FAF5;font-weight:600}
  .note{margin-top:18px;font-size:12px;line-height:1.8;color:#B3AC9E}
  .err{margin-top:30px;text-align:center;color:#8A8378;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>亿成公考 · 数据看板</h1>
  <div class="sub" id="updated">加载中…</div>

  <div class="cards" id="cards"></div>

  <div class="sec">
    <h2>最近 14 天 · 每日打开与设备数</h2>
    <div class="chart" id="chart"></div>
    <div class="legend">
      <span><i style="background:#15803D"></i>每日打开次数</span>
      <span><i style="background:#E4B95B"></i>每日独立设备</span>
    </div>
  </div>

  <div class="sec">
    <h2>每日明细</h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>日期</th><th>设备数</th><th>打开</th><th>开始刷题</th><th>指南</th><th>领资料</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <p class="note">· 数据每天上午由小林更新一次，看板打开时读取最新记录。<br>
  · 数字包含你自己和校对时的打开，量小的时候略有虚高。<br>
  · 学生每道题的作答存在各自手机里，这个看板统计不到该粒度。</p>

  <div class="err" id="err" style="display:none">数据暂时没取到，稍后再打开试试；也可以直接问小林。</div>
</div>

<script>
(function(){
  fetch('stats.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(render)
    .catch(function(){ document.getElementById('err').style.display='block';
                       document.getElementById('updated').textContent='数据没取到'; });

  function fmt(n){ return (n===null||n===undefined) ? '—' : n; }

  function render(data){
    var t = data.totals || {};
    document.getElementById('updated').textContent =
      '更新于 ' + (data.updated_at || '').replace('T',' ').slice(0,16) + ' · 今天已有 ' + fmt(data.today_uv) + ' 台设备打开';

    var cards = [
      {n:fmt(t.open), l:'累计打开次数', hl:true},
      {n:fmt(t.start), l:'开始刷题次数'},
      {n:fmt(data.today_uv), l:'今日独立设备'},
      {n:fmt(t.materials), l:'资料领取点击'}
    ];
    document.getElementById('cards').innerHTML = cards.map(function(c){
      return '<div class="card'+(c.hl?' hl':'')+'"><div class="num">'+c.n+'</div><div class="lab">'+c.l+'</div></div>';
    }).join('');

    var days = data.days || [];
    var maxV = 1;
    days.forEach(function(d){ maxV = Math.max(maxV, d.open||0, d.uv||0); });

    document.getElementById('chart').innerHTML = days.map(function(d){
      var h1 = Math.round((d.open||0)/maxV*100), h2 = Math.round((d.uv||0)/maxV*100);
      return '<div class="bar-w">'+
             '<div class="bar" style="height:'+Math.max(h1,3)+'%"><span class="v">'+fmt(d.open)+'</span></div>'+
             '<div class="bar uv" style="height:'+Math.max(h2,3)+'%"></div>'+
             '<div class="d">'+d.date.slice(5)+'</div></div>';
    }).join('');

    document.getElementById('tbody').innerHTML = days.slice().reverse().map(function(d){
      var today = (d.date === (days[days.length-1]||{}).date);
      return '<tr'+(today?' class="today"':'')+'>'+
        '<td>'+d.date+(today?'（今天）':'')+'</td>'+
        '<td>'+fmt(d.uv)+'</td><td>'+fmt(d.open)+'</td>'+
        '<td>'+fmt(d.start)+'</td><td>'+fmt(d.guide)+'</td><td>'+fmt(d.materials)+'</td></tr>';
    }).join('');
  }
})();
</script>
</body>
</html>
