      try{

      }
    });
  }
  return { add: add, bindPlayer: bindPlayer };

/* ===== 一键刷题（视频配套练习 · 本页作答版） =====
   点击后在当前页展开刷题区，不再跳转主站；刷的就是配套文档里的那组题。
   无做题记录 → 轻提示后直接开始；有做题记录 → 弹「继续上次进度 / 重新开始」，绝不静默清进度。
   进度写入与主站相同的 yc-quiz-progress-v2 / yicheng-gk-study-v1 / yc-video-quiz-v1，两边数据一致。 */
var quizShards = {};   /* bank -> 题目数组缓存 */
var quizPanel = null;  /* 当前展开的刷题区状态 */
function loadQuizShard(bank, cb){
  if (quizShards[bank]) return cb(quizShards[bank]);
  var s = document.createElement('script');
  s.src = './assets/' + bank + '.js';
  s.onload = function(){
    var qs = [];
    try {
      (window.YC_MORE_QBANKS || []).forEach(function(arr){
        (arr || []).forEach(function(q){ if (q && q._shard === bank) qs.push(q); });
      });
    } catch(e){}
    qs.sort(function(a,b){ return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
    quizShards[bank] = qs;
    cb(qs);
  };
  s.onerror = function(){ cb([]); };
  document.body.appendChild(s);
}
function quizReadProgress(){
  try { var po = JSON.parse(localStorage.getItem('yc-quiz-progress-v2') || 'null'); if (po && po.done) return po; } catch(e){}
  return { done: {} };
}
function quizWriteProgress(po){ try { localStorage.setItem('yc-quiz-progress-v2', JSON.stringify(po)); } catch(e){} }
function quizCountAnswered(bank, qs){
  var po = quizReadProgress(), n = 0;
  for (var i = 0; i < qs.length; i++) {
    var d = po.done[qs[i].id];
    if (d && ((d.c || 0) + (d.w || 0) > 0)) n++;
  }
  return n;
}
/* 答一次题：进度 + 主站学习统计同步累加（与主站做题口径一致，重复作答按新的一次练习计） */
function quizRecordAnswer(q, isCorrect){
  var po = quizReadProgress();
  if (!po.done) po.done = {};
  var d = po.done[q.id] || { c: 0, w: 0 };
  if (isCorrect) d.c = (d.c || 0) + 1; else d.w = (d.w || 0) + 1;
  po.done[q.id] = d;
  quizWriteProgress(po);
  try {
    var st = JSON.parse(localStorage.getItem('yicheng-gk-study-v1') || 'null') || {};
    var td = new Date();
    var ymd = td.getFullYear() + '-' + (td.getMonth() + 1) + '-' + td.getDate();
    if (st.todayDate !== ymd) { st.todayAnswered = 0; st.todayCorrect = 0; st.todayDate = ymd; }
    st.totalAnswered = (st.totalAnswered || 0) + 1;
    if (isCorrect) st.totalCorrect = (st.totalCorrect || 0) + 1;
    st.todayAnswered = (st.todayAnswered || 0) + 1;
    if (isCorrect) st.todayCorrect = (st.todayCorrect || 0) + 1;
    if (!st.moduleProgress || typeof st.moduleProgress !== 'object' || Array.isArray(st.moduleProgress)) st.moduleProgress = {};
    var mp = st.moduleProgress[q.module] || { answered: 0, correct: 0 };
    mp.answered = (mp.answered || 0) + 1;
    if (isCorrect) mp.correct = (mp.correct || 0) + 1;
    st.moduleProgress[q.module] = mp;
    if (!isCorrect) {
      var wq = Array.isArray(st.wrongQuestions) ? st.wrongQuestions : [];
      if (wq.indexOf(q.id) < 0) { wq.push(q.id); st.wrongQuestions = wq.slice(-200); }
    }
    localStorage.setItem('yicheng-gk-study-v1', JSON.stringify(st));
  } catch(e){}
}
function quizClearBank(bank, qs){
  var po = quizReadProgress();
  if (!po.done) po.done = {};
  for (var i = 0; i < qs.length; i++) delete po.done[qs[i].id];
  quizWriteProgress(po);
  try {
    var st = JSON.parse(localStorage.getItem('yicheng-gk-study-v1') || 'null');
    if (st && Array.isArray(st.wrongQuestions) && st.wrongQuestions.length) {
      var ids = {};
      for (var j = 0; j < qs.length; j++) ids[qs[j].id] = 1;
      st.wrongQuestions = st.wrongQuestions.filter(function(id){ return !ids[id]; });
      localStorage.setItem('yicheng-gk-study-v1', JSON.stringify(st));
    }
  } catch(e){}
}
function closeQuizPanel(){
  quizPanel = null;
  var p = document.getElementById('ycQuizPanel');
  if (p && p.parentNode) p.parentNode.removeChild(p);
}
function quizPanelHtml(v, qs, answered){
  var label = esc(v.quiz.label || "配套刷题");
  return '<div class="quiz-panel" id="ycQuizPanel">' +
    '<div class="qp-head">' +
      '<div><div class="qp-title">📝 ' + label + ' · 本页刷题</div>' +
      '<div class="qp-stat" id="qpStat">已答 ' + answered + ' / ' + qs.length + ' 题，答完自动记进度</div></div>' +
      '<button type="button" class="qp-close" id="qpClose">收起</button>' +
    '</div>' +
    '<div class="qp-barwrap"><div class="qp-bar" id="qpBar" style="width:' + (qs.length ? Math.round(answered / qs.length * 100) : 0) + '%"></div></div>' +
    '<div id="qpBody"></div>' +
  '</div>';
}
function renderQuizQ(v, qs, idx){
  var body = document.getElementById('qpBody');
  if (!body || !quizPanel) return;
  var q = qs[idx];
  var po = quizReadProgress();
  var d = po.done[q.id] || { c: 0, w: 0 };
  var answeredBefore = ((d.c || 0) + (d.w || 0)) > 0;
  var abc = ['A', 'B', 'C', 'D', 'E', 'F'];
  var optsHtml = '';
  for (var i = 0; i < (q.options || []).length; i++) {
    optsHtml += '<button type="button" class="qp-opt" data-i="' + i + '">' +
      '<span class="abc">' + abc[i] + '.</span><span>' + esc(q.options[i]) + '</span></button>';
  }
  var ans = (typeof q.answer === 'number') ? q.answer : (q.options || []).indexOf(q.answer);
  var ansLetter = ans >= 0 ? abc[ans] : '';
  body.innerHTML =
    '<div class="qp-no">第 <b>' + (idx + 1) + '</b> 题 / 共 ' + qs.length + ' 题' +
      (answeredBefore ? ' · <b>已练过</b>（再答一遍按新练习计）' : '') + '</div>' +
    '<p class="qp-prompt">' + esc(q.prompt) + '</p>' +
    '<div id="qpOpts">' + optsHtml + '</div>' +
    '<div class="qp-exp" id="qpExp"><b>答案 ' + ansLetter + '：</b>' + esc(q.explanation || '略') + '</div>' +
    '<div class="qp-nav">' +
      '<button type="button" class="qp-prev" id="qpPrev"' + (idx <= 0 ? ' disabled' : '') + '>← 上一题</button>' +
      '<button type="button" class="qp-next" id="qpNext">' + (idx >= qs.length - 1 ? '完成 ✓' : '下一题 →') + '</button>' +
    '</div>';
  var picked = false;
  var optBtns = body.querySelectorAll('.qp-opt');
  for (var k = 0; k < optBtns.length; k++) {
    optBtns[k].addEventListener('click', function(){
      if (picked) return;
      picked = true;
      var i = parseInt(this.getAttribute('data-i'), 10);
      var ok = (i === ans);
      for (var m = 0; m < optBtns.length; m++) {
        var mi = parseInt(optBtns[m].getAttribute('data-i'), 10);
        optBtns[m].disabled = true;
        if (mi === ans) optBtns[m].classList.add('right');
        else if (mi === i) optBtns[m].classList.add('wrong');
        else optBtns[m].classList.add('dim');
      }
      document.getElementById('qpExp').classList.add('show');
      quizRecordAnswer(q, ok);
      updateQuizStat(v, qs);
    });
  }
  document.getElementById('qpPrev').addEventListener('click', function(){
    if (idx > 0) { quizPanel.idx = idx - 1; renderQuizQ(v, qs, idx - 1); }
  });
  document.getElementById('qpNext').addEventListener('click', function(){
    if (idx >= qs.length - 1) {
      quizLightToast('这一组刷完了，真棒！再做一遍或换个视频继续');
      return;
    }
    quizPanel.idx = idx + 1;
    renderQuizQ(v, qs, idx + 1);
  });
}
function updateQuizStat(v, qs){
  var answered = quizCountAnswered(v.quiz.bank, qs);
  var stat = document.getElementById('qpStat');
  var bar = document.getElementById('qpBar');
  if (stat) stat.textContent = '已答 ' + answered + ' / ' + qs.length + ' 题，答完自动记进度';
  if (bar) bar.style.width = (qs.length ? Math.round(answered / qs.length * 100) : 0) + '%';
}
function openQuizPanel(v, mode){
  if (!v || !v.quiz) return;
  closeQuizPanel();
  quizLightToast('题目加载中…');
  loadQuizShard(v.quiz.bank, function(qs){
    if (!qs.length) { quizLightToast('这组题还在整理中，先看视频吧'); return; }
    /* 登记题号清单（与主站一键刷题同一份记录，主站也能看到这组题） */
    try {
      var vq = JSON.parse(localStorage.getItem('yc-video-quiz-v1') || '{}');
      var ids = [];
      for (var i = 0; i < qs.length; i++) ids.push(qs[i].id);
      vq[v.quiz.bank] = { total: qs.length, ids: ids, at: Date.now() };
      localStorage.setItem('yc-video-quiz-v1', JSON.stringify(vq));
    } catch(e){}
    if (mode === 'fresh') quizClearBank(v.quiz.bank, qs);
    var answered = quizCountAnswered(v.quiz.bank, qs);
    var host = document.getElementById('quizPanelHost');
    if (!host) return;
    host.innerHTML = quizPanelHtml(v, qs, answered);
    quizPanel = { bank: v.quiz.bank, idx: 0 };
    if (mode !== 'fresh') {
      /* 继续进度：跳到第一道没答过的题 */
      var po = quizReadProgress();
      for (var j = 0; j < qs.length; j++) {
        var dd = po.done[qs[j].id];
        if (!(dd && ((dd.c || 0) + (dd.w || 0) > 0))) { quizPanel.idx = j; break; }
      }
    }
    renderQuizQ(v, qs, quizPanel.idx);
    try { vtrack.add("quiz"); } catch(e){}
    var panel = document.getElementById('ycQuizPanel');
    if (panel && panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    var closeBtn = document.getElementById('qpClose');
    if (closeBtn) closeBtn.addEventListener('click', closeQuizPanel);
  });
}
function quizLightToast(msg){
  var t = document.createElement('div');

/* 实时比对 yc-video-quiz-v1（题号清单）与 yc-quiz-progress-v2（做题记录），算这组题答了几道 */
function bankInfo(bank){
  try {
    var vq = JSON.parse(localStorage.getItem('yc-video-quiz-v1') || '{}');
    var rec = vq[bank];
    if (!rec || !rec.ids || !rec.ids.length) return null;
    var po = null;
    try { po = JSON.parse(localStorage.getItem('yc-quiz-progress-v2') || 'null'); } catch (e2) { po = null; }
    var n = 0;
    if (po && po.done) {
      for (var i = 0; i < rec.ids.length; i++) {
        var d = po.done[rec.ids[i]];
        if (d && ((d.c || 0) + (d.w || 0) > 0)) n++;
      }
    }
    return { total: rec.total || rec.ids.length, answered: n };
  } catch (e) { return null; }
}
function quizBtnGo(v){

}

      '<div class="body">' +
        '<h2>' + esc(v.title || "视频讲解") + '</h2>' +
        (v.desc ? '<p class="desc">' + esc(v.desc) + '</p>' : '') +
        speedHtml +
        tipHtml +
        quizHtml +
        pdfHtml +
      '</div></div>' +
      '<div id="quizPanelHost"></div>';
  if (v.quiz && hasDoc) {
    var pqb = document.getElementById("playQuizBtn");
    if (pqb) pqb.addEventListener("click", function(){ quizBtnGo(v); });
  }
  /* 列表页点「一键刷题」带过来的：进入播放页后自动展开本页刷题区 */
  if (state.pendingQuiz != null && state.pendingQuiz === state.idx) {
    state.pendingQuiz = null;
    quizBtnGo(v);
  }
  if (v.oss || v.srcs) {
    var player = document.getElementById("localPlayer");
    var bar = document.getElementById("speedBar");
    var parts = v.oss || v.srcs;
    var fallback = v.srcs || [];
    var partIdx = 0;
    var curRate = 1;
    var triedFb = false;

    /* 断点续播：按视频 key（分类+标题）记录进度，重进自动接着看 */
    var vposKey = (v.cat || '') + '|' + (v.title || '');
    function vposAll(){ try { return JSON.parse(localStorage.getItem('ycgk.vpos.v1') || '{}') || {}; } catch(e){ return {}; } }
    function vposSave(t, d, p){ try { var all = vposAll(); all[vposKey] = { t: t, d: d, p: p }; localStorage.setItem('ycgk.vpos.v1', JSON.stringify(all)); } catch(e){} }
    function vposClear(){ try { var all = vposAll(); delete all[vposKey]; localStorage.setItem('ycgk.vpos.v1', JSON.stringify(all)); } catch(e){} }
    var resumeT = 0, resumeP = 0;
    (function(){
      var rec = vposAll()[vposKey];
      if (rec && typeof rec.t === 'number' && rec.d && rec.t > 0 && rec.t < rec.d - 5) { resumeT = rec.t; resumeP = rec.p || 0; }
    })();
    function toast(msg){
      var t = document.createElement('div');
      t.className = 'load-ov';
      t.innerHTML = '<div style="text-align:center"><div class="load-txt">' + msg + '</div></div>';
      box.appendChild(t);
      setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
    }

    var box = player.parentNode;
    var ov = document.createElement("div");
    ov.className = "load-ov";
    box.appendChild(ov);
    function setLoad(t, sub){
      ov.innerHTML = '<div style="text-align:center"><div class="load-txt">' + t + '</div>' +
        (sub ? '<div class="load-sub">' + sub + '</div>' : '') + '</div>';
    }
    function hideLoad(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }

    function playNow(){
      player.playbackRate = curRate;
      var pp = player.play();
      if (pp && pp.catch) pp.catch(function(){});
    }

    /* 边下边播：直接把地址交给播放器，浏览器自己分段缓冲，
       几秒就能开播，进度条也能随意拖动（以前要整段下完才能播） */
    function loadPart(i, isNext){
      if (i >= parts.length) return;
      partIdx = i;
      triedFb = false;
      if (!isNext) setLoad("⏳ 第一次加载要缓冲几秒钟…", "缓冲完播放就很顺畅了，请稍等");
      else setLoad("正在加载下一段…", "");
      player.src = parts[i];
      player.load();
      playNow();
    }

    player.addEventListener("playing", hideLoad);
    player.addEventListener("playing", function(){
      /* 进入播放后恢复上次进度（仅首次进入时生效一次） */
      if (resumeT > 0 && player.duration && resumeT < player.duration - 5) {
        try { player.currentTime = resumeT; } catch(e){}
        toast('⏩ 已从上次进度继续');
      }
      resumeT = 0;
    });
    /* 播放中每 5 秒存一次进度（不影响 vtrack 埋点） */
    var lastPos = 0;
    player.addEventListener("timeupdate", function(){
      var now = Date.now();
      if (now - lastPos < 5000) return;
      lastPos = now;
      var d = player.duration;
      if (d && player.currentTime > 0) vposSave(player.currentTime, d, partIdx);
    });

    player.addEventListener("ended", function(){
      if (partIdx < parts.length - 1) loadPart(partIdx + 1, true);
      else vposClear();
    });

    player.addEventListener("error", function(){
      /* 主线路失败：自动换备用线路再试一次 */
      if (!triedFb && fallback[partIdx]) {
        triedFb = true;
        setLoad("⏳ 正在换备用线路…", "第一次加载要缓冲几秒钟，请稍等");
        player.src = fallback[partIdx];
        player.load();
        playNow();
      } else if (!player.currentSrc || player.error) {
        setLoad("😢 视频加载失败", "请检查网络后点播放键重试，或稍后再来");
      }
    });

    if (resumeP > 0 && resumeP < parts.length) loadPart(resumeP); else loadPart(0);
    vtrack.bindPlayer(player, function(){ return partIdx; }, parts.length);

    /* 全屏 + 横屏锁定 */
    function tryLandscape(){
      try { if (screen.orientation && screen.orientation.lock) {
        var r = screen.orientation.lock("landscape");
        if (r && r.catch) r.catch(function(){});
      } } catch(e){}
    }
    function iosFull(){ try { if (player.webkitEnterFullscreen) player.webkitEnterFullscreen(); } catch(e){} }
    var fsBtn = document.getElementById("fsBtn");
    if (fsBtn) {
      fsBtn.addEventListener("click", function(){
        try {
          if (player.requestFullscreen) {
            var r = player.requestFullscreen();
            if (r && r.then) r.then(function(){ tryLandscape(); }).catch(function(){ iosFull(); });
          } else if (player.webkitEnterFullscreen) {
            iosFull();
          } else if (box.requestFullscreen) {
            var r2 = box.requestFullscreen();
            if (r2 && r2.then) r2.then(function(){ tryLandscape(); }).catch(function(){});
          } else {
            iosFull();
          }
        } catch(e) { iosFull(); }
      });
    }
    function onFsExit(){
      var stillFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (!stillFull) { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){} }
    }
    document.addEventListener("fullscreenchange", onFsExit);
    document.addEventListener("webkitfullscreenchange", onFsExit);

    /* 配套试卷点击统计 */
    var pdfLinks = document.querySelectorAll(".pdf-btn");
    for (var pb = 0; pb < pdfLinks.length; pb++) {
      pdfLinks[pb].addEventListener("click", function(){ vtrack.add("pdf"); });
    }

    if (bar) {
      var btns = bar.querySelectorAll(".sp-btn:not(.fs)");
      for (var s = 0; s < btns.length; s++) {
        btns[s].addEventListener("click", function(){
          curRate = parseFloat(this.getAttribute("data-r"));
          player.playbackRate = curRate;
          for (var t = 0; t < btns.length; t++) btns[t].className = "sp-btn";
          this.className = "sp-btn on";
        });
      }
    }
  }
  window.scrollTo(0, 0);
}

function render(){
  if (state.view === "home") renderHome();
  else if (state.view === "module") renderModule();
  else renderPlay();
}

document.getElementById("navBack").addEventListener("click", function(){
  if (state.view === "play") { state.view = "module"; render(); }
  else if (state.view === "module") { state.view = "home"; render(); }
  else { /* 首页：返回刷题 App 主页 */
    if (document.referrer && document.referrer.indexOf("index") > -1 && history.length > 1) history.back();
    else location.href = "index.html";
  }
});
document.getElementById("navBack").href = "javascript:void(0)";

render();
</script>
<script>window.__YC_GQR_PAGE='videos';</script>
