/* ============ 视频数据统计：上报到数据池，供数据看板读取 ============
   数据契约 key=ycgk-vid-v1，结构：
   { ts, meta:{视频key:标题}, videos:{key:{open,play,done,sec,pdf}}, days:{'20261121':{play,done,sec}} }
   本地先累计，定时/页面隐藏时合并写池；写失败保留本地计数下次再写。 */
var vtrack = (function(){
  var KEY = 'ycgk-vid-v1';
  var GETS = ['https://textdb.dev/api/data/', 'https://textdb.online/'];
  function get(cb){
    var i = 0;
    (function next(){
      if (i >= GETS.length) { cb(null); return; }
      fetch(GETS[i++] + KEY, { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
        if (!t || t.charAt(0) !== '{') { next(); return; }
        try { cb(JSON.parse(t)); } catch(e) { next(); }
      }).catch(function(){ next(); });
    })();
  }
  function put(val, cb){
    fetch('https://textdb.dev/api/data/' + KEY, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(val) })
      .then(function(r){ cb(!!r.ok); }, function(){ cb(false); });
  }
  function pad(n){ return ('0'+n).slice(-2); }
  function today(){ var d = new Date(); return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }

  var pending = {}, dayPend = {}, dayUids = {}, flushT = null;
  var ucntPend = {}, pagePend = null;

  /* 匿名设备编号：全站统一以 ycgk.did.v1 为准，旧键 ycgk.did 只迁移一次并清除 */
  function deviceId(){
    var d = '';
    try{ d = localStorage.getItem('ycgk.did.v1'); }catch(e){}
    if(!d){
      try{ d = localStorage.getItem('ycgk.did'); }catch(e){}
      if(d){ var ok=false; try{ localStorage.setItem('ycgk.did.v1', d); ok=true; }catch(e){}
        if(ok){ try{ localStorage.removeItem('ycgk.did'); }catch(e){} } }
    }
    if(d) return d;
    d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    try{ localStorage.setItem('ycgk.did.v1', d); }catch(e){}
    return d;
  }
  var DID = deviceId();

  function vidKey(v){
    if (!v) return '';
    if (v._vkey) return v._vkey;
    var src = (v.oss && v.oss[0]) || (v.srcs && v.srcs[0]) || '';
    var base = '';
    if (src) base = String(src).split('/').pop().replace(/\.[a-z0-9]+$/i, '').replace(/-\d+$/, '');
    else if (v.bvid) base = String(v.bvid);
    if (!base) base = 'v' + VIDEOS.indexOf(v);
    v._vkey = base;
    return base;
  }

  function add(kind, n, extra){
    n = n || 1;
    var k = vidKey(VIDEOS[state.idx]);
    if (!k) return;
    if (!pending[k]) pending[k] = { open:0, play:0, done:0, sec:0, pdf:0, fail:0, exit:{}, exit3:{} };
    if (kind === 'exit' && extra != null) { pending[k].exit[extra] = (pending[k].exit[extra]||0)+1; flushSoon(); return; }
    if (kind === 'exit3' && extra != null) { if (!pending[k].exit3) pending[k].exit3 = {}; pending[k].exit3[extra] = (pending[k].exit3[extra]||0)+1; flushSoon(); return; }
    pending[k][kind] = (pending[k][kind] || 0) + n;
    if (kind === 'play') { pending[k]._uid = DID; dayUids[d] = dayUids[d] || {}; dayUids[d][DID] = 1; ucntPend[DID] = (ucntPend[DID]||0)+1; }
    var d = today();
    if (!dayPend[d]) dayPend[d] = { play:0, done:0, sec:0 };
    if (kind === 'sec') dayPend[d].sec += n;
    else if (kind === 'done') dayPend[d].done += n;
    else if (kind === 'play') dayPend[d].play += n;
    flushSoon();
  }

  function flushSoon(){ if (!flushT) flushT = setTimeout(function(){ flushT = null; flush(); }, 4000); }

  function flush(){
    if (!Object.keys(pending).length) return;
    get(function(pool){
      var p = pool && typeof pool === 'object' ? pool : {};
      if (!p.videos || typeof p.videos !== 'object') p.videos = {};
      if (!p.meta || typeof p.meta !== 'object') p.meta = {};
      if (!p.days || typeof p.days !== 'object') p.days = {};
      Object.keys(pending).forEach(function(k){
        var inc = pending[k];
        if (!p.videos[k]) p.videos[k] = { open:0, play:0, done:0, sec:0, pdf:0, fail:0, exit:{}, exit3:{}, uids:{} };
        ['open','play','done','sec','pdf','fail'].forEach(function(f){ p.videos[k][f] = (p.videos[k][f] || 0) + (inc[f] || 0); });
        /* 播放人数去重：合并设备编号（上限500，防池子膨胀） */
        if (inc._uid) {
          if (!p.videos[k].uids || typeof p.videos[k].uids !== 'object') p.videos[k].uids = {};
          p.videos[k].uids[inc._uid] = 1;
          var uk = Object.keys(p.videos[k].uids);
          if (uk.length > 500) { for (var ui = 0; ui < uk.length - 500; ui++) delete p.videos[k].uids[uk[ui]]; }
        }
        /* 退出节点分桶合并 */
        if (inc.exit && typeof inc.exit === 'object') {
          if (!p.videos[k].exit || typeof p.videos[k].exit !== 'object') p.videos[k].exit = {};
          Object.keys(inc.exit).forEach(function(b){ p.videos[k].exit[b] = (p.videos[k].exit[b]||0) + inc.exit[b]; });
        }
        /* 退出三桶合并（开头30秒/中段/结尾，新口径） */
        if (inc.exit3 && typeof inc.exit3 === 'object') {
          if (!p.videos[k].exit3 || typeof p.videos[k].exit3 !== 'object') p.videos[k].exit3 = {};
          Object.keys(inc.exit3).forEach(function(b){ p.videos[k].exit3[b] = (p.videos[k].exit3[b]||0) + inc.exit3[b]; });
        }
        for (var i = 0; i < VIDEOS.length; i++) {
          if (vidKey(VIDEOS[i]) === k && VIDEOS[i].title) { p.meta[k] = String(VIDEOS[i].title).slice(0, 60); break; }
        }
      });
      Object.keys(dayPend).forEach(function(d){
        if (!p.days[d]) p.days[d] = { play:0, done:0, sec:0, uids:{} };
        ['play','done','sec'].forEach(function(f){ p.days[d][f] = (p.days[d][f] || 0) + (dayPend[d][f] || 0); });
        /* 每日播放人数：按设备去重（随30天滚动清理） */
        if (dayUids[d]) {
          if (!p.days[d].uids || typeof p.days[d].uids !== 'object') p.days[d].uids = {};
          Object.keys(dayUids[d]).forEach(function(u){ p.days[d].uids[u] = 1; });
        }
        /* 视频板块进入：页面级打开次数与进入设备（随30天滚动清理） */
        if (pagePend) {
          p.days[d].popen = (p.days[d].popen||0) + (pagePend.open||0);
          if (!p.days[d].puids || typeof p.days[d].puids !== 'object') p.days[d].puids = {};
          Object.keys(pagePend.uids||{}).forEach(function(u){ p.days[d].puids[u] = 1; });
        }
      });
      /* 每设备累计播放次数：供"同一用户观看次数排行榜"（上限500台，超出淘汰计数最小的） */
      if (Object.keys(ucntPend).length) {
        if (!p.ucnt || typeof p.ucnt !== 'object') p.ucnt = {};
        Object.keys(ucntPend).forEach(function(u){ p.ucnt[u] = (p.ucnt[u]||0) + ucntPend[u]; });
        var uk = Object.keys(p.ucnt);
        if (uk.length > 500) {
          uk.sort(function(a,b){ return p.ucnt[a]-p.ucnt[b]; });
          for (var ui = 0; ui < uk.length - 500; ui++) delete p.ucnt[uk[ui]];
        }
      }
      var dk = Object.keys(p.days).sort();
      if (dk.length > 30) { for (var i = 0; i < dk.length - 30; i++) delete p.days[dk[i]]; }
      p.ts = Date.now();
      put(p, function(ok){
        if (ok) { pending = {}; dayPend = {}; dayUids = {}; ucntPend = {}; pagePend = null; }
        else flushSoon(); /* 写失败：本地计数保留，稍后重试 */
      });
    });
  }

  /* 页面进入计数：进入视频板块即计 1 次打开（本次会话只记一次） */
  try { pagePend = { open: 1, uids: {} }; pagePend.uids[DID] = 1; flushSoon(); } catch(e) {}
  setInterval(flush, 30000);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) flush(); });
  window.addEventListener('beforeunload', flush);

  /* ============ 实时在线心跳：视频页活动 → 实时池（与刷题端同一实时池，看板区分"正在看视频"） ============ */
  (function(){
    var LKEY = 'ycgk-live-v1';
    var LGETS = ['https://textdb.dev/api/data/', 'https://textdb.online/'];
    function lid(){
      var d = '';
      try{ d = localStorage.getItem('ycgk.did.v1'); }catch(e){}
      if(!d){
        try{ d = localStorage.getItem('ycgk.did'); }catch(e){}
        if(d){ var ok=false; try{ localStorage.setItem('ycgk.did.v1', d); ok=true; }catch(e){}
          if(ok){ try{ localStorage.removeItem('ycgk.did'); }catch(e){} } }
      }
      if(d) return d;
      d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      try{ localStorage.setItem('ycgk.did.v1', d); }catch(e){}
      return d;
    }
    var LDID = lid();
    function lget(cb){
      var i = 0;
      (function next(){
        if (i >= LGETS.length) { cb(null); return; }
        fetch(LGETS[i++] + LKEY, { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
          if (!t || t.charAt(0) !== '{') { next(); return; }
          try { cb(JSON.parse(t)); } catch(e) { next(); }
        }).catch(function(){ next(); });
      })();
    }
    function lput(p){
      try { fetch('https://textdb.dev/api/data/' + LKEY, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(p) }).catch(function(){}); } catch(e) {}
    }
    function beat(){
      var now = Date.now();
      lget(function(pool){
        try{
          var p = pool && typeof pool === 'object' ? pool : {};
          if (!p.online || typeof p.online !== 'object') p.online = {};
          if (!p.act || typeof p.act !== 'object') p.act = {};
          Object.keys(p.online).forEach(function(k){ if (now - p.online[k] > 600000) { delete p.online[k]; delete p.act[k]; } });
          p.online[LDID] = now;
          p.act[LDID] = 'vid';
          p.ts = now;
          lput(p);
        }catch(e){}
      });
    }
    beat();
    setInterval(function(){ if (!document.hidden) beat(); }, 60000);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) beat(); });
  })();

  /* 播放器埋点：开始播放（每次打开播放页只计一次）、观看时长（每5秒）、完整看完（最后一段播完） */
  function bindPlayer(player, getPart, nParts){
    var started = false, endCount = 0, watchT = null, maxPos = 0;
    function startWatch(){
      if (watchT) return;
      watchT = setInterval(function(){
        if (!player.paused && !player.ended) add('sec', 5);
      }, 5000);
    }
    function stopWatch(){ if (watchT) { clearInterval(watchT); watchT = null; } }
    function exitBucket(){
      /* 退出节点：按已看进度分四档（<25% / 25-50% / 50-75% / 75-100%） */
      try{
        var d = player.duration, c = player.currentTime || 0;
        if (c > maxPos) maxPos = c;
        if (!d || d <= 0) return '0-25';
        var r = maxPos / d;
        return r < 0.25 ? '0-25' : r < 0.5 ? '25-50' : r < 0.75 ? '50-75' : '75-100';
      }catch(e){ return '0-25'; }
    }
    function exit3Bucket(){
      /* 退出三桶（新口径）：开头30秒内 / 中段 / 结尾（距片尾30秒内） */
      try{
        var d = player.duration, c = player.currentTime || 0;
        if (c > maxPos) maxPos = c;
        if (!d || d <= 0) return 'a';
        if (maxPos <= 30) return 'a';
        return (d - maxPos <= 30) ? 'c' : 'b';
      }catch(e){ return 'a'; }
    }
    player.addEventListener('play', function(){
      if (!started) { started = true; add('play'); }
      startWatch();
    });
    player.addEventListener('pause', function(){
      stopWatch();
      if (started && !player.ended && player.currentTime > 30) { add('exit', 1, exitBucket()); add('exit3', 1, exit3Bucket()); }
    });
    player.addEventListener('error', function(){ if (started || player.currentTime > 0) add('fail'); });
    player.addEventListener('ended', function(){
      stopWatch();
      endCount++;
      if (endCount >= nParts) add('done');
    });
    window.addEventListener('pagehide', function(){
      if (started && !player.ended && player.currentTime > 30) { add('exit', 1, exitBucket()); add('exit3', 1, exit3Bucket()); }
    });
  }
  return { add: add, bindPlayer: bindPlayer };
})();

}

    '</div>' : '';
  var tipHtml = (v.oss || v.srcs) ?
    '<p class="play-tip">💡 第一次打开要缓冲几秒钟，缓冲完播放就很顺畅了；<b>建议横屏观看</b>——点上面「⛶ 全屏」再把手机横过来，字更大更清楚。</p>' : '';
  document.getElementById("view").innerHTML =
    '<div class="card">' +
      '<div class="video-box" oncontextmenu="return false">' + playerHtml + '</div>' +
      '<div class="body">' +
        '<h2>' + esc(v.title || "视频讲解") + '</h2>' +
        (v.desc ? '<p class="desc">' + esc(v.desc) + '</p>' : '') +
        speedHtml +
        tipHtml +
        pdfHtml +
      '</div></div>';
  if (v.oss || v.srcs) {
    var player = document.getElementById("localPlayer");
    var bar = document.getElementById("speedBar");
    var parts = v.oss || v.srcs;
    var fallback = v.srcs || [];
    var partIdx = 0;
    var curRate = 1;
    var triedFb = false;

    /* 断点续播：按视频 key（分类+标题）记录进度，重进自动接着看 */
    var vposKey = (v.cat || '') + '|' + (v.title || '');
    function vposAll(){ try { return JSON.parse(localStorage.getItem('ycgk.vpos.v1') || '{}') || {}; } catch(e){ return {}; } }
    function vposSave(t, d, p){ try { var all = vposAll(); all[vposKey] = { t: t, d: d, p: p }; localStorage.setItem('ycgk.vpos.v1', JSON.stringify(all)); } catch(e){} }
    function vposClear(){ try { var all = vposAll(); delete all[vposKey]; localStorage.setItem('ycgk.vpos.v1', JSON.stringify(all)); } catch(e){} }
    var resumeT = 0, resumeP = 0;
    (function(){
      var rec = vposAll()[vposKey];
      if (rec && typeof rec.t === 'number' && rec.d && rec.t > 0 && rec.t < rec.d - 5) { resumeT = rec.t; resumeP = rec.p || 0; }
    })();
    function toast(msg){
      var t = document.createElement('div');
      t.className = 'load-ov';
      t.innerHTML = '<div style="text-align:center"><div class="load-txt">' + msg + '</div></div>';
      box.appendChild(t);
      setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
    }

    var box = player.parentNode;
    var ov = document.createElement("div");
    ov.className = "load-ov";
    box.appendChild(ov);
    function setLoad(t, sub){
      ov.innerHTML = '<div style="text-align:center"><div class="load-txt">' + t + '</div>' +
        (sub ? '<div class="load-sub">' + sub + '</div>' : '') + '</div>';
    }
    function hideLoad(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }

    function playNow(){
      player.playbackRate = curRate;
      var pp = player.play();
      if (pp && pp.catch) pp.catch(function(){});
    }

    /* 边下边播：直接把地址交给播放器，浏览器自己分段缓冲，
       几秒就能开播，进度条也能随意拖动（以前要整段下完才能播） */
    function loadPart(i, isNext){
      if (i >= parts.length) return;
      partIdx = i;
      triedFb = false;
      if (!isNext) setLoad("⏳ 第一次加载要缓冲几秒钟…", "缓冲完播放就很顺畅了，请稍等");
      else setLoad("正在加载下一段…", "");
      player.src = parts[i];
      player.load();
      playNow();
    }

    player.addEventListener("playing", hideLoad);
    player.addEventListener("playing", function(){
      /* 进入播放后恢复上次进度（仅首次进入时生效一次） */
      if (resumeT > 0 && player.duration && resumeT < player.duration - 5) {
        try { player.currentTime = resumeT; } catch(e){}
        toast('⏩ 已从上次进度继续');
      }
      resumeT = 0;
    });
    /* 播放中每 5 秒存一次进度（不影响 vtrack 埋点） */
    var lastPos = 0;
    player.addEventListener("timeupdate", function(){
      var now = Date.now();
      if (now - lastPos < 5000) return;
      lastPos = now;
      var d = player.duration;
      if (d && player.currentTime > 0) vposSave(player.currentTime, d, partIdx);
    });

    player.addEventListener("ended", function(){
      if (partIdx < parts.length - 1) loadPart(partIdx + 1, true);
      else vposClear();
    });

    player.addEventListener("error", function(){
      /* 主线路失败：自动换备用线路再试一次 */
      if (!triedFb && fallback[partIdx]) {
        triedFb = true;
        setLoad("⏳ 正在换备用线路…", "第一次加载要缓冲几秒钟，请稍等");
        player.src = fallback[partIdx];
        player.load();
        playNow();
      } else if (!player.currentSrc || player.error) {
        setLoad("😢 视频加载失败", "请检查网络后点播放键重试，或稍后再来");
      }
    });

    if (resumeP > 0 && resumeP < parts.length) loadPart(resumeP); else loadPart(0);
    vtrack.bindPlayer(player, function(){ return partIdx; }, parts.length);

    /* 全屏 + 横屏锁定 */
    function tryLandscape(){
      try { if (screen.orientation && screen.orientation.lock) {
        var r = screen.orientation.lock("landscape");
        if (r && r.catch) r.catch(function(){});
      } } catch(e){}
    }
    function iosFull(){ try { if (player.webkitEnterFullscreen) player.webkitEnterFullscreen(); } catch(e){} }
    var fsBtn = document.getElementById("fsBtn");
    if (fsBtn) {
      fsBtn.addEventListener("click", function(){
        try {
          if (player.requestFullscreen) {
            var r = player.requestFullscreen();
            if (r && r.then) r.then(function(){ tryLandscape(); }).catch(function(){ iosFull(); });
          } else if (player.webkitEnterFullscreen) {
            iosFull();
          } else if (box.requestFullscreen) {
            var r2 = box.requestFullscreen();
            if (r2 && r2.then) r2.then(function(){ tryLandscape(); }).catch(function(){});
          } else {
            iosFull();
          }
        } catch(e) { iosFull(); }
      });
    }
    function onFsExit(){
      var stillFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (!stillFull) { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){} }
    }
    document.addEventListener("fullscreenchange", onFsExit);
    document.addEventListener("webkitfullscreenchange", onFsExit);

    /* 配套试卷点击统计 */
    var pdfLinks = document.querySelectorAll(".pdf-btn");
    for (var pb = 0; pb < pdfLinks.length; pb++) {
      pdfLinks[pb].addEventListener("click", function(){ vtrack.add("pdf"); });
    }

    if (bar) {
      var btns = bar.querySelectorAll(".sp-btn:not(.fs)");
      for (var s = 0; s < btns.length; s++) {
        btns[s].addEventListener("click", function(){
          curRate = parseFloat(this.getAttribute("data-r"));
          player.playbackRate = curRate;
          for (var t = 0; t < btns.length; t++) btns[t].className = "sp-btn";
          this.className = "sp-btn on";
        });
      }
    }
  }
  window.scrollTo(0, 0);
}

function render(){
  if (state.view === "home") renderHome();
  else if (state.view === "module") renderModule();
  else renderPlay();
}

document.getElementById("navBack").addEventListener("click", function(){
  if (state.view === "play") { state.view = "module"; render(); }
  else if (state.view === "module") { state.view = "home"; render(); }
  else { /* 首页：返回刷题 App 主页 */
    if (document.referrer && document.referrer.indexOf("index") > -1 && history.length > 1) history.back();
    else location.href = "index.html";
  }
});
document.getElementById("navBack").href = "javascript:void(0)";

render();
</script>
</body>
</html>
