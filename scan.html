<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拍题讲解 · 亿成公考</title>
<script src="./assets/yc-track.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#F7F4EF;color:#202020;min-height:100vh;padding:16px 14px 40px}
.wrap{max-width:48rem;margin:0 auto}
h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.sub{font-size:12px;color:#8A8378;margin-top:4px;line-height:1.6}
.card{background:#FFFDF8;border:1.5px solid #F0E4D4;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(32,32,32,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;padding:12px 20px}
.btn-p{background:#B02A2A;color:#fff;width:100%}
.btn-p:disabled{opacity:.55;cursor:default}
.btn-g{background:#F3F0E9;color:#5b5560;font-size:12px;padding:8px 14px}
.photo-box{border:2px dashed #D9CFC0;border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer}
.photo-box:active{background:#FAF6EE}
.photo-box .big{font-size:34px}
.photo-box p{font-size:13px;font-weight:700;margin-top:6px}
.photo-box span{display:block;font-size:11px;color:#B3AC9E;margin-top:3px}
#imgPrev{max-width:100%;max-height:300px;border-radius:10px;display:block;margin:0 auto}
.prog{height:8px;background:#F0E9DC;border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#B02A2A,#DC2626);width:0%;transition:width .3s}
.hint{font-size:11px;color:#B3AC9E;margin-top:6px;line-height:1.6}
label.lb{display:block;font-size:12px;font-weight:800;color:#6B6558;margin-bottom:6px}
textarea#ocrText{width:100%;min-height:120px;border:1.5px solid #E4DACA;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;font-family:inherit;background:#fff;resize:vertical}
.match{border:1.5px solid #E4DACA;border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.match .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.match .mt{font-size:13px;font-weight:800;color:#B02A2A}
.match .ms{font-size:11px;color:#8A8378}
.match .mq{font-size:13px;line-height:1.7;margin-top:8px;color:#3a3630}
.match .ma{font-size:12.5px;line-height:1.8;margin-top:8px;color:#5b5560;background:#F7F5F0;border-radius:10px;padding:9px 11px}
.match a{color:#B02A2A;font-weight:700;font-size:12.5px;text-decoration:none}
.ai-out{white-space:pre-wrap;font-size:13.5px;line-height:1.9;margin-top:10px;color:#3a3630}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 9px}
.none{margin-top:10px;font-size:12.5px;color:#8A8378;background:#F7F5F0;border-radius:10px;padding:10px 12px;line-height:1.7}
.crop-wrap{position:relative;overflow:hidden;border-radius:12px;background:#141210;width:fit-content;max-width:100%;margin:0 auto}
.crop-wrap img{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.crop-box{position:absolute;border:2.5px solid #FFD54D;border-radius:4px;box-shadow:0 0 0 9999px rgba(10,8,6,.55);cursor:move;touch-action:none}
.crop-h{position:absolute;width:26px;height:26px;border-radius:50%;background:#FFD54D;border:2.5px solid #FFFDF8;box-shadow:0 1px 5px rgba(0,0,0,.45);touch-action:none}
.crop-h.tl{left:-13px;top:-13px;cursor:nwse-resize}
.crop-h.tr{right:-13px;top:-13px;cursor:nesw-resize}
.crop-h.bl{left:-13px;bottom:-13px;cursor:nesw-resize}
.crop-h.br{right:-13px;bottom:-13px;cursor:nwse-resize}
.hist-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hist-item{border:1.5px solid #E4DACA;border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff;cursor:pointer}
.hist-item .ht{font-size:13px;font-weight:700;color:#3a3630;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-item .hs{font-size:11px;color:#8A8378;margin-top:3px;line-height:1.6}
.home{display:inline-flex;align-items:center;gap:4px;color:#8A8378;font-size:12px;text-decoration:none;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./index.html">‹ 返回首页</a>
  <h1>📷 拍题讲解</h1>
  <p class="sub">拍一道题 → 自动认字 → 点提交，AI 直接讲：这是什么题、最简单的解法、过程和答案。真题卷、练习册、讲义上的题都能拍。</p>

  <div class="card">
    <label class="lb">第 1 步 · 拍题或选照片</label>
    <div class="photo-box" id="pick">
      <div class="big">📸</div>
      <p>点击拍照 / 从相册选择</p>
      <span>只拍一道题，字越清楚识别越准</span>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" style="display:none">
    <div id="imgWrap" style="display:none;margin-top:10px"><img id="imgPrev" alt="题目照片"></div>
    <div class="prog" id="prog" style="display:none"><i id="progBar"></i></div>
    <p class="hint" id="ocrHint"></p>
  </div>

  <div class="card" id="cropCard" style="display:none">
    <label class="lb">第 2 步 · 框住要讲的那道题</label>
    <div class="crop-wrap" id="cropWrap">
      <img id="cropImg" alt="待裁剪照片">
      <div class="crop-box" id="cropBox">
        <div class="crop-h tl"></div><div class="crop-h tr"></div><div class="crop-h bl"></div><div class="crop-h br"></div>
      </div>
    </div>
    <p class="hint">拖中间移动选框，拖四个黄点缩放——框住一道题，识别最准。</p>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn btn-g" id="cropRepick" style="flex:1">重拍一张</button>
      <button class="btn btn-p" id="cropOk" style="flex:2;width:auto">✓ 就识别这一块</button>
    </div>
  </div>

  <div class="card" id="step2" style="display:none">
    <label class="lb">第 3 步 · 认出来的题目（识别错了可直接改）</label>
    <textarea id="ocrText" placeholder="题目文字会出现在这里，也可以直接手动粘贴题目"></textarea>
    <button class="btn btn-p" id="goAi" style="margin-top:12px;width:100%">✦ 提交 · AI 讲解这道题</button>
    <div id="aiOut"></div>
  </div>

  <div class="card" id="histCard" style="display:none">
    <div class="hist-head" id="histToggle">
      <label class="lb" style="margin:0">📚 拍过的题（<span id="histN">0</span>）</label>
      <span id="histArrow" style="font-size:12px;color:#8A8378">展开 ▾</span>
    </div>
    <div id="histList" style="display:none"></div>
    <div id="histFoot" style="display:none;margin-top:8px;text-align:right"><a href="javascript:void(0)" id="histClear" style="font-size:11px;color:#B3AC9E">清空记录</a></div>
  </div>
</div>

<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function track(ev, extra){ try{ if(window.YCTrack&&window.YCTrack.track) window.YCTrack.track(ev, extra||{}); }catch(e){} }
  track('yc_scan_open');

  var pick = document.getElementById('pick'), file = document.getElementById('file');
  pick.addEventListener('click', function(){ file.click(); });
  file.addEventListener('change', function(){ if (file.files && file.files[0]) handleImage(file.files[0]); });

  /* ===== 裁剪选框：拖动移动、拖四角缩放，框住一道题再识别 ===== */
  var cropImgEl = document.getElementById('cropImg'), cropBox = document.getElementById('cropBox');
  var cropRect = {x:0, y:0, w:0, h:0}; /* 相对 crop-wrap 显示坐标 */
  var cropMode = null, cropStart = null, cropOrig = null;

  function applyCropBox(){
    cropBox.style.left = cropRect.x + 'px';
    cropBox.style.top = cropRect.y + 'px';
    cropBox.style.width = cropRect.w + 'px';
    cropBox.style.height = cropRect.h + 'px';
  }
  function initCrop(){
    var wrap = document.getElementById('cropWrap');
    var W = wrap.clientWidth, H = cropImgEl.clientHeight || wrap.clientHeight;
    cropRect = { x: W*0.08, y: H*0.08, w: W*0.84, h: H*0.5 };
    applyCropBox();
  }
  function ptFromEvent(ev){
    var r = document.getElementById('cropWrap').getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function clampCrop(){
    var wrap = document.getElementById('cropWrap');
    var W = wrap.clientWidth, H = cropImgEl.clientHeight || wrap.clientHeight;
    cropRect.w = Math.max(40, Math.min(cropRect.w, W));
    cropRect.h = Math.max(40, Math.min(cropRect.h, H));
    cropRect.x = Math.max(0, Math.min(cropRect.x, W - cropRect.w));
    cropRect.y = Math.max(0, Math.min(cropRect.y, H - cropRect.h));
  }
  function onDown(ev, mode){
    ev.preventDefault(); ev.stopPropagation();
    cropMode = mode; cropStart = ptFromEvent(ev); cropOrig = {x:cropRect.x, y:cropRect.y, w:cropRect.w, h:cropRect.h};
    var el = ev.currentTarget;
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
  }
  function onMove(ev){
    if (!cropMode) return;
    var p = ptFromEvent(ev), dx = p.x - cropStart.x, dy = p.y - cropStart.y;
    if (cropMode === 'move') { cropRect.x = cropOrig.x + dx; cropRect.y = cropOrig.y + dy; }
    else {
      if (cropMode.indexOf('w') > -1) { cropRect.x = cropOrig.x + dx; cropRect.w = cropOrig.w - dx; }
      if (cropMode.indexOf('e') > -1) { cropRect.w = cropOrig.w + dx; }
      if (cropMode.indexOf('n') > -1) { cropRect.y = cropOrig.y + dy; cropRect.h = cropOrig.h - dy; }
      if (cropMode.indexOf('s') > -1) { cropRect.h = cropOrig.h + dy; }
      if (cropRect.w < 40) { cropRect.w = 40; if (cropMode.indexOf('w') > -1) cropRect.x = cropOrig.x + cropOrig.w - 40; }
      if (cropRect.h < 40) { cropRect.h = 40; if (cropMode.indexOf('n') > -1) cropRect.y = cropOrig.y + cropOrig.h - 40; }
    }
    clampCrop(); applyCropBox();
  }
  function onUp(){ cropMode = null; }
  cropBox.addEventListener('pointerdown', function(ev){ onDown(ev, 'move'); });
  Array.prototype.forEach.call(document.querySelectorAll('.crop-h'), function(h){
    var m = { tl:'nw', tr:'ne', bl:'sw', br:'se' }[h.className.split(' ')[1]]; /* 角标→方向 */
    h.addEventListener('pointerdown', function(ev){ onDown(ev, m); });
  });
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);

  function handleImage(f){
    cropImgEl.onload = function(){
      document.getElementById('cropCard').style.display = 'block';
      document.getElementById('step2').style.display = 'none';
      requestAnimationFrame(initCrop);
      document.getElementById('cropCard').scrollIntoView({behavior:'smooth'});
    };
    cropImgEl.src = URL.createObjectURL(f);
  }
  document.getElementById('cropRepick').addEventListener('click', function(){ file.click(); });
  document.getElementById('cropOk').addEventListener('click', function(){
    var wrap = document.getElementById('cropWrap');
    var nat = cropImgEl.naturalWidth, dispW = cropImgEl.clientWidth;
    if (!nat || !dispW) return;
    var scale = nat / dispW;
    var sx = cropRect.x * scale, sy = cropRect.y * scale, sw = cropRect.w * scale, sh = cropRect.h * scale;
    var cv = document.createElement('canvas');
    var maxSide = 2000, k = Math.min(1, maxSide / Math.max(sw, sh));
    cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
    cv.getContext('2d').drawImage(cropImgEl, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    document.getElementById('cropCard').style.display = 'none';
    runOcr(cv);
  });

  /* 图像预处理：灰度 + 直方图拉伸（4%~96%），提升暗光/低对比照片的识别率 */
  function preprocess(cv){
    try {
      var ctx = cv.getContext('2d');
      var img = ctx.getImageData(0, 0, cv.width, cv.height);
      var d = img.data, hist = new Array(256).fill(0), n = d.length / 4, i, g;
      for (i = 0; i < d.length; i += 4) {
        g = (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114) | 0;
        hist[g]++;
        d[i] = d[i+1] = d[i+2] = g;
      }
      var lo = 0, hi = 255, acc = 0, loCut = n * 0.04, hiCut = n * 0.96;
      for (i = 0; i < 256; i++) { acc += hist[i]; if (acc >= loCut) { lo = i; break; } }
      acc = 0;
      for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= n - hiCut) { hi = i; break; } }
      if (hi <= lo) hi = Math.min(255, lo + 1);
      var k = 255 / (hi - lo);
      for (i = 0; i < d.length; i += 4) {
        g = (d[i] - lo) * k;
        g = g < 0 ? 0 : (g > 255 ? 255 : g);
        d[i] = d[i+1] = d[i+2] = g;
      }
      ctx.putImageData(img, 0, 0);
    } catch (err) { /* 预处理失败不影响识别，用原图 */ }
    return cv;
  }
  /* 放大重试版：最长边放大到 maxSide（≤2倍）后再预处理 */
  function upscale(cv, maxSide){
    var cur = Math.max(cv.width, cv.height);
    var k = Math.min(2, maxSide / cur);
    if (k <= 1.05) return preprocess(cv);
    var nc = document.createElement('canvas');
    nc.width = Math.round(cv.width * k); nc.height = Math.round(cv.height * k);
    var nctx = nc.getContext('2d');
    nctx.imageSmoothingEnabled = true;
    nctx.drawImage(cv, 0, 0, nc.width, nc.height);
    return preprocess(nc);
  }
  /* 评估识别质量：置信度 + 有效中文字符数 */
  function ocrScore(res){
    var data = res && res.data || {};
    var conf = typeof data.confidence === 'number' ? data.confidence : 0;
    var text = data.text || '';
    var cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
    return { ok: conf >= 65 && cjk >= 6, conf: conf, cjk: cjk, text: text.trim() };
  }

  function runOcr(source){
    var prog = document.getElementById('prog'), bar = document.getElementById('progBar'), hint = document.getElementById('ocrHint');
    prog.style.display = 'block'; bar.style.width = '0%';
    hint.textContent = '正在启动识别引擎…（第一次用要下载识别库，约十几 MB，之后有缓存）';
    track('yc_scan_ocr_start');
    var worker = null;
    Tesseract.createWorker('chi_sim', 1, { logger: function(m){
        if (m.status === 'recognizing text') { bar.style.width = Math.round((m.progress||0)*100) + '%'; }
        else if (m.status && m.progress !== undefined) { bar.style.width = Math.round(m.progress*100) + '%'; hint.textContent = '识别准备中：' + m.status; }
      }})
      .then(function(w){
        worker = w;
        w.setParameters({ preserve_interword_spaces: '1' });
        return w.recognize(preprocess(source));
      })
      .then(function(res){
        var best = ocrScore(res);
        if (!best.ok) {
          hint.textContent = '第一遍认得不太好，自动放大重试…';
          return worker.recognize(upscale(source, 2400)).then(function(res2){
            var second = ocrScore(res2);
            return second.conf > best.conf ? second : best;
          });
        }
        return best;
      })
      .then(function(best){
        var text = best.text;
        document.getElementById('ocrText').value = text;
        document.getElementById('step2').style.display = 'block';
        hint.textContent = text ? ('识别完成，共 ' + text.length + ' 字。识别不准的地方可以直接改。') : '没认出文字，试试框得再准一点，或手动粘贴题目文字。';
        prog.style.display = 'none';
        document.getElementById('step2').scrollIntoView({behavior:'smooth'});
        track('yc_scan_ocr_done', { len: text.length, conf: Math.round(best.conf) });
        histNewRecord(text);
        if (worker) worker.terminate();
      })
      .catch(function(e){
        hint.textContent = '识别没成功（' + (e && e.message || '未知错误') + '）。可以直接在下面手动粘贴题目文字。';
        prog.style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        if (worker) worker.terminate();
      });
  }

  /* ===== 拍题记录：只存在学生自己手机里（localStorage），不上传任何服务器 ===== */
  var HIST_KEY = 'yc_scan_hist_v1', curRec = null;
  function histLoad(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }catch(e){ return []; } }
  function histSave(a){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(a.slice(-100))); }catch(e){} }
  function histNewRecord(text){
    if (!text) { curRec = null; return; }
    var a = histLoad();
    curRec = { t: Date.now(), q: text, ai: null };
    a.push(curRec); histSave(a); histRender();
  }
  function histUpdateAi(text){
    if (!curRec) return;
    curRec.ai = text; histSave(histLoad()); histRender();
  }
  function histRender(){
    var a = histLoad(), card = document.getElementById('histCard');
    document.getElementById('histN').textContent = a.length;
    if (!a.length) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    document.getElementById('histFoot').style.display = 'block';
    var list = document.getElementById('histList'), html = '';
    for (var i = a.length - 1; i >= 0; i--) {
      var r = a[i], d = new Date(r.t);
      var ts = (d.getMonth()+1) + '月' + d.getDate() + '日 ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
      var st = r.ai ? '✓ 已讲解' : '待讲解';
      html += '<div class="hist-item" data-i="' + i + '"><div class="ht">' + esc(r.q.slice(0, 42)) + '</div><div class="hs">' + ts + ' · ' + st + '</div></div>';
    }
    list.innerHTML = html;
    Array.prototype.forEach.call(list.querySelectorAll('.hist-item'), function(el){
      el.addEventListener('click', function(){
        var r = a[parseInt(el.getAttribute('data-i'), 10)];
        if (!r) return;
        document.getElementById('ocrText').value = r.q;
        document.getElementById('step2').style.display = 'block';
        curRec = r;
        document.getElementById('step2').scrollIntoView({behavior:'smooth'});
      });
    });
  }
  document.getElementById('histToggle').addEventListener('click', function(){
    var list = document.getElementById('histList'), open = list.style.display !== 'none';
    list.style.display = open ? 'none' : 'block';
    document.getElementById('histArrow').textContent = open ? '展开 ▾' : '收起 ▴';
  });
  document.getElementById('histClear').addEventListener('click', function(){
    if (!confirm('清空全部拍题记录？本机删除后不可恢复。')) return;
    histSave([]); curRec = null; histRender();
  });
  histRender();

  /* ===== AI 判答案 · 讲过程（讲题能力由站点统一配置，学生端零操作；未接好前按钮不显示） ===== */
  var aiEp = null;
  try {
    fetch('./assets/ai-endpoint.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j && j.url && j.key) aiEp = j; })
      .catch(function(){});
  } catch(e) {}
  function callAI(prompt, ok, fail, btn){
    if (!aiEp) { fail('讲解服务还没接好，正在接入大模型，过几天再来试试'); return; }
    var old = btn.textContent; btn.disabled = true; btn.textContent = '正在讲…';
    var done = false, timer = setTimeout(function(){ if(!done){done=true;btn.disabled=false;btn.textContent=old;fail('超时');} }, 90000);
    fetch(aiEp.url, { method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer ' + aiEp.key},
        body: JSON.stringify({ model: aiEp.model, temperature: 0.3, stream: false,
          messages: [{ role:'user', content: prompt }] }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (done) return; done = true; clearTimeout(timer);
        btn.disabled = false; btn.textContent = old;
        var t = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
        if (!t) fail(d && d.error && d.error.message || '接口未返回内容');
        else ok(t);
      })
      .catch(function(e){ if(done) return; done=true; clearTimeout(timer); btn.disabled=false; btn.textContent=old; fail(e && e.message || '网络错误'); });
  }
  document.getElementById('goAi').addEventListener('click', function(){
    var q = document.getElementById('ocrText').value.trim();
    var out = document.getElementById('aiOut'), btn = this;
    if (q.length < 6) { out.innerHTML = '<p class="none">先把题目文字补全（拍照识别或手动粘贴）。</p>'; return; }
    track('yc_scan_ai');
    var prompt = '你是公务员考试资深讲师。下面是一道学生拍题识别出来的题目（可能有少量识别错别字，先自行纠正理解）。请用最简单、最快的方法讲（有秒杀技巧优先），让基础一般的学生一遍看懂。请严格按以下格式输出：\n' +
      '【答案】给出正确答案（如有选项写选项字母和内容）\n' +
      '【过程】一步步写清解题过程，含用到的公式/考点，最后给正确选项\n' +
      '【易错点】一句话点出这类题最容易错在哪\n' +
      '【考点】所属模块与考点名\n题目：\n' + q;
    out.innerHTML = '<p class="none">正在判答案、写过程…</p>';
    callAI(prompt, function(text){
      out.innerHTML = '<div class="match"><div class="mh"><span class="mt">✦ AI 讲解</span><span class="ms">由在线大模型生成</span></div>' +
        '<div class="ai-out">' + esc(text) + '</div></div>';
      track('yc_scan_ai_done', { len: text.length });
      histUpdateAi(text);
    }, function(err){
      out.innerHTML = '<p class="none">这次没讲成（' + esc(err) + '），稍后再试一次。</p>';
    }, btn);
  });
})();
</script>
</body>
</html>
