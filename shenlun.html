  /* 网格由 JS 按 CSS 变量 --cell 精确绘制：横向每 --cell 一条竖线，正文行高=--cell；
     文字用等宽全角字体 + 字间距0，使每个汉字/全角标点恰好落在一格里 */

    --cell:28px;

    /* 工整有设计感、绝不潦草的本地楷体栈；全部系统本地字体，零联网、零乱码 */

    background-image:
      repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--cell) - 1px),#EBC9AE calc(var(--cell) - 1px),#EBC9AE var(--cell)),
      repeating-linear-gradient(to right,transparent 0,transparent calc(var(--cell) - 1px),#F0D9C4 calc(var(--cell) - 1px),#F0D9C4 var(--cell));
    background-position:var(--pad,10px) 26px;
    background-attachment:local;
    caret-color:#B5483C;

<script>
(function(){
  var SHL = window.YC_SHL_BANK || [];
  var ZY = window.YC_ZY_BANK || [];
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var state = {
    tab: params.get('cat') === 'zy' ? 'zy' : 'shl',
    cat: '全部',
    cur: null,        // 当前题目
    draft: '',
    review: null,     // 交卷批阅结果
    aiReview: null,   // 深度批阅结果
    paperMode: localStorage.getItem('yc_paper_mode') !== 'plain', // true=格子纸
    history: JSON.parse(localStorage.getItem('yc_essay_history') || '{}'),
    aiCfg: (function(){ try{ return JSON.parse(localStorage.getItem('yc_ai_cfg')||'null'); }catch(e){ return null; } })()
  };

  function banks(){ return state.tab === 'shl' ? SHL : ZY; }
  function tabName(){ return state.tab === 'shl' ? '申论' : '综应'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function countChars(s){ return (s||'').replace(/\s/g,'').length; }
  function saveHistory(){ localStorage.setItem('yc_essay_history', JSON.stringify(state.history)); }

  function norm(s){
    return (s||'').replace(/[，。、；：""''（）()【】\s,.;:!?？!]/g,'');
  }
  // 子序列模糊匹配：采分点各字按顺序出现在答案中即算命中（容忍插入修饰语）
  function isSubseq(needle, hay){
    var i = 0;
    for(var j = 0; j < hay.length && i < needle.length; j++){
      if(hay[j] === needle[i]) i++;
    }
    return i === needle.length;
  }
  // 近似子序列匹配：允许至多 k 个字符失配（替换），容忍近义词换字
  // best[i] = 按顺序匹配 needle 前 i 个字符所需的最少失配数；i 降序遍历避免同一 hay 字符复用
  function fuzzySubseq(needle, hay, k){
    var n = needle.length, m = hay.length;
    if(n === 0) return true;
    if(k == null) k = Math.max(1, Math.floor(n*0.2));
    var best = new Array(n+1);
    for(var i = 0; i <= n; i++) best[i] = Infinity;
    best[0] = 0;
    for(var j = 0; j < m; j++){
      var imax = Math.min(n, j+1);
      for(var i2 = imax; i2 >= 1; i2--){
        if(best[i2-1] === Infinity) continue;
        var cost = (hay[j] === needle[i2-1]) ? 0 : 1;
        if(best[i2-1] + cost < best[i2]) best[i2] = best[i2-1] + cost;
      }
    }
    return best[n] <= k;
  }
  // 命中层级：exact=连续子串（精确）；fuzzy=子序列/近似（模糊）；null=未命中
  function matchKind(key, ans){
    if(!key) return null;
    if(ans.indexOf(key) >= 0) return 'exact';
    if(key.length >= 4 && isSubseq(key, ans)) return 'fuzzy';
    if(key.length >= 6 && fuzzySubseq(key, ans)) return 'fuzzy';
    return null;
  }
  function matchOne(key, ans){ return matchKind(key, ans) !== null; }

  // ===== 真实考试标准评分 =====
  // 维度：①采分点命中（按点给分）②结构分条 ③字数合规 ④语言规范
  // 总分 = 采分点得分（申论/综应阅卷以采分点为核心），其余为过程性反馈与扣分提示
  function dedupe(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }

  function grade(q, answer){
    var ans = norm(answer);
    var raw = answer || '';
    var results = q.scorePoints.map(function(sp){
      if(sp.aiOnly){
        return {point:sp.point, synonyms:sp.synonyms||[], score:sp.score, got:sp.score, status:'ai', hitWords:[], aiOnly:true};
      }
      var hitWords = [];
      var mainKey = norm(sp.point);
      var hitMain = mainKey && matchOne(mainKey, ans);
      if(hitMain) hitWords.push(sp.point);
      var synHits = 0, synExact = false;
      (sp.synonyms||[]).forEach(function(c){
        var key = norm(c);
        var kind = key && matchKind(key, ans);
        if(kind){ synHits++; hitWords.push(c); if(kind === 'exact') synExact = true; }
      });
      hitWords = dedupe(hitWords);
      var status = (hitMain || synExact) ? 'hit' : (synHits >= 1 ? 'half' : 'miss');
      // 真实阅卷：主表述命中或任一同义精确命中=满分；仅模糊命中=半分；否则0
      // v2修复：原规则须≥2个同义才给满分，参考答案自己都只能拿半分，造成「答案一致却不给分」
      var got = status === 'hit' ? sp.score : (status === 'half' ? Math.ceil(sp.score/2) : 0);
      return {point:sp.point, synonyms:sp.synonyms||[], score:sp.score, got:got, status:status, hitWords:hitWords};
    });
    var total = results.reduce(function(a,r){return a+r.got;},0);
    var full = results.reduce(function(a,r){return a+r.score;},0);
    var aiFull = results.reduce(function(a,r){return a+(r.aiOnly?r.score:0);},0);

    // 结构：是否分条作答（一、二、三 / 一是二是 / ①②③ / 首先其次）
    var structMarks = (raw.match(/(一是|二是|三是|四是|五是|六是|首先|其次|再次|最后|第[一二三四五六七八九十]+|[①②③④⑤⑥⑦⑧⑨]|(^|\n)\s*\d+[\.、])/g)||[]).length;
    // 语言规范：口语化/网络词
    var oral = ['然后呢','就是说','我觉得吧','反正','搞','弄','啥','超','巨','特别特别','很多很多','有一些','大概齐','差不多得了','emmm','哈哈'];
    var oralHits = oral.filter(function(w){ return raw.indexOf(w)>=0; });
    // 字数
    var chars = countChars(raw);
    var wordLimit = q.wordLimit || 400;
    var wordState = chars > wordLimit ? 'over' : (chars < wordLimit*0.5 ? 'few' : 'ok');

    // 综合印象分（0-100，用于等级与雷达，不叠采分点总分）
    var hitCnt = results.filter(function(r){return r.status==='hit';}).length;
    var halfCnt = results.filter(function(r){return r.status==='half';}).length;
    var pointRatio = full ? (total/full) : 0;
    var structScore = Math.min(100, 40 + structMarks*15);
    var wordScore = wordState==='ok' ? 95 : (wordState==='over' ? 70 : 55);
    var langScore = Math.max(40, 100 - oralHits.length*15);
    var overall = Math.round(pointRatio*70 + structScore/100*12 + wordScore/100*10 + langScore/100*8);

    return {results:results, total:total, full:full, aiFull:aiFull,
      meta:{chars:chars, wordLimit:wordLimit, wordState:wordState, structMarks:structMarks,
            structScore:structScore, wordScore:wordScore, langScore:langScore,
            oralHits:oralHits, overall:overall, hitCnt:hitCnt, halfCnt:halfCnt, pointRatio:pointRatio}};
  }

  function gradeLevel(overall){
    return overall>=85 ? {t:'一类文',c:'#15803D'} : overall>=70 ? {t:'二类文',c:'#65A30D'}
         : overall>=55 ? {t:'三类文',c:'#B45309'} : {t:'四类文',c:'#DC2626'};
  }

  function buildAiPrompt(q, answer, g){
    var lines = [];
    lines.push('你是公考申论/综合应用能力阅卷专家。请严格按真实考试采分点标准批阅。');
    lines.push('');
    lines.push('【题型】' + tabName() + ' · ' + (q.category||'') + '（满分 ' + g.full + ' 分，本题 ' + g.total + ' 分）');
    lines.push('【题目】' + q.question);
    lines.push('【给定材料】'); q.material.forEach(function(m){ lines.push(m); });
    lines.push('【采分点与评分】');
    g.results.forEach(function(r,i){
      lines.push((i+1)+'. '+r.point+'（'+r.score+'分；判定：'+(r.status==='hit'?'命中':r.status==='half'?'部分':'未中')+'；已命中表述：'+(r.hitWords.join('、')||'无')+'）');
    });
    lines.push('【参考答案】' + q.referenceAnswer);
    lines.push('【学生作答】' + answer);
    lines.push('');
    lines.push('请输出：①总分与等级；②逐采分点评判（引用学生原句为依据，给分理由）；③结构/字数/语言规范诊断；④三个最优先的改进动作；⑤一句鼓励。用中文，条理清晰。');
    return lines.join('\n');
  }

  // ===== 内置智能阅卷引擎（无需联网、网页端直接出结果）=====
  function localDeepReview(q, answer, g){
    var m = g.meta, lv = gradeLevel(m.overall);
    var hits = g.results.filter(function(r){return r.status==='hit';});
    var halves = g.results.filter(function(r){return r.status==='half';});
    var miss = g.results.filter(function(r){return r.status==='miss';});
    var s = [];
    s.push('【总评】本份作答按考试采分点标准得 '+g.total+'/'+g.full+' 分，综合等级：'+lv.t+'。共命中 '+m.hitCnt+' 个采分点、部分命中 '+m.halfCnt+' 个、遗漏 '+miss.length+' 个。');
    s.push('');
    s.push('【逐点批阅】');
    g.results.forEach(function(r,i){
      if(r.status==='miss' || r.aiOnly){
        s.push((i+1)+'. ['+(r.aiOnly?'综合项':'未命中')+'] '+r.point+'（'+r.score+'分，得0）。建议写法：'+(r.synonyms[0]||r.point)+' —— 材料中对应表述未被你的答案覆盖，务必补上。');
      } else if(r.status==='half'){
        s.push((i+1)+'. [部分命中] '+r.point+'（'+r.score+'分，得'+r.got+'）。你写到了「'+(r.hitWords[0]||'相关词')+'」，但表述不够完整规范；建议补全为：'+r.point+'。');
      } else {
        s.push((i+1)+'. [命中] '+r.point+'（'+r.score+'分，得'+r.got+'）。依据：你写到「'+(r.hitWords.slice(0,2).join('、')||r.point)+'」，采分到位，保持。');
      }
    });
    s.push('');
    s.push('【结构·字数·语言】');
    s.push('· 结构分条：'+(m.structMarks>=2 ? '已用「一/二/三」或序号分条，条理清晰（+' + m.structScore + '）' : '未见清晰分条标志，阅卷老师不易抓点，建议一律「一是…二是…三是…」分条作答')+'。');
    s.push('· 字数：'+m.chars+' 字 / 限 '+m.wordLimit+' 字'+(m.wordState==='over'?'（已超字数，考试会被扣分，精简冗余表述）':m.wordState==='few'?'（作答偏短，采分点覆盖不足，适当展开）':'（合规）')+'。');
    s.push('· 语言规范：'+(m.oralHits.length ? '出现口语化表述「'+m.oralHits.slice(0,3).join('、')+'」，改为书面语。' : '无明显口语化，表述规范。')+' 申论评分按点给分，踩点比文采更重要。');
    s.push('');
    s.push('【优先改进】');
    var n=1;
    miss.slice(0,3).forEach(function(r){ s.push(n+'. 补采分点「'+r.point+'」，可从材料直接提炼关键词。'); n++; });
    if(m.structMarks<2) s.push(n+'. 全篇改为分条作答，每条一个采分点。'); n++;
    if(m.wordState==='over') s.push(n+'. 删掉重复和修饰，把字数压到 '+m.wordLimit+' 以内。');
    s.push('');
    s.push('【鼓励】'+(m.overall>=70 ? '采分意识已经很好，把遗漏点补齐就是一类文水平，继续保持！' : '申论是踩点得分，方向对了——对照采分点重写一遍，进步会非常明显。'));
    // 逐句点评：AI 判分特有视角，逐句扫描作答内容
    var sentences = (answer||'').split(/(?<=[。！？；!?;])|\n/).map(function(x){return x.replace(/\s/g,'');}).filter(function(x){return x.length>=4;});
    if(sentences.length){
      s.push('');
      s.push('【逐句点评】（AI 判分视角，逐句扫描你的作答）');
      sentences.slice(0,12).forEach(function(sen,idx){
        var hitPts = g.results.filter(function(r){ return !r.aiOnly && r.hitWords && r.hitWords.length && r.hitWords.some(function(w){ return sen.indexOf(norm(w))>=0 || (norm(w).length>=4 && isSubseq(norm(w), sen)); }); });
        var oralHit = m.oralHits.filter(function(w){ return sen.indexOf(w)>=0; });
        var cmt;
        if(hitPts.length){ cmt = '✓ 踩到采分点「'+hitPts.map(function(r){return r.point;}).slice(0,2).join('、')+'」，这句是有效得分句，保留。'; }
        else if(oralHit.length){ cmt = '△ 含口语化表述「'+oralHit[0]+'」，改为书面语更稳。'; }
        else if(sen.length<12){ cmt = '△ 表述偏短，信息量不足，建议展开或与相邻句合并。'; }
        else { cmt = '○ 未直接命中采分点关键词，若与材料要点相关可保留并补上关键词，否则精简。'; }
        s.push((idx+1)+'. 「'+(sen.length>38 ? sen.slice(0,38)+'…' : sen)+'」'+cmt);
      });
      if(sentences.length>12) s.push('（其余 '+(sentences.length-12)+' 句未逐条展开，重点看上面即可）');
    }
    return s.join('\n');
  }

    }
    // 稿纸模式下打开旧草稿：统一转全角，保证格线对齐（普通模式保留原文）
    if(state.paperMode && ta.value){
      ta.value = toGrid(toFullwidth(ta.value));
      state.draft = ta.value;
      localStorage.setItem('yc_essay_draft_' + state.tab + ':' + q.id, ta.value);

    updWc();

    /* ===== 方格稿纸：严格一格一字 ===== */
    // 半角标点转全角，确保标点也占满一格（考场作文标点同样占格）
    // 注意：半角句点'.'不转'。'——小数(3.14)和英文句子里的点号不能变成中文句号
    var PUNC_MAP={',':'\uff0c','?':'\uff1f','!':'\uff01',':':'\uff1a',';':'\uff1b','(':'\uff08',')':'\uff09','"':'\u201c','\'':'\u2018','<':'\u300a','>':'\u300b'};
    function toFullwidth(s){ return (s||'').replace(/[,?!:;()"'<>]/g,function(c){ return PUNC_MAP[c]||c; }); }
    // 稿纸模式专用：半角数字/字母/点号/空格转全角，宽度恰好一格，保证严格一格一字
    // （普通模式不做任何转换，保留用户原文）
    function toGrid(s){
      return (s||'')
        .replace(/[0-9a-zA-Z]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)+65248); })
        .replace(/\./g,'\uff0e')
        .replace(/ /g,'\u3000');
    }
    // 固定舒适字号（不随屏幕放大），屏幕越宽则一行格子越多；字恰好落入格中
    function layoutPaper(){
      if(!state.paperMode) return;
      var avail = ta.clientWidth; if(!avail) return;
      var cell = avail < 420 ? 26 : (avail < 900 ? 27 : 28); // 格子放大：手机26/平板27/大屏28
      var fs = cell - 8;                                     // 字比格子小一圈，写字不挤
      var cols = Math.max(8, Math.floor(avail / cell));       // 一行能放几格
      var used = cols * cell;
      var pad = Math.max(0, Math.floor((avail - used) / 2));  // 居中余量并入padding
      ta.style.setProperty('--cell', cell + 'px');
      ta.style.setProperty('--fs', fs + 'px');
      ta.style.setProperty('--pad', pad + 'px');
    }
    layoutPaper();
    setTimeout(layoutPaper,60);
    window.addEventListener('resize',layoutPaper);

    ta.oninput = function(){
      var pos = ta.selectionStart;
      // 仅稿纸模式做全角化（保证一格一字）；普通模式保留用户原文，不做任何转换
      var converted = state.paperMode ? toGrid(toFullwidth(ta.value)) : ta.value;
      if(converted !== ta.value){
        ta.value = converted;
        try{ ta.setSelectionRange(pos,pos); }catch(e){}
      }
      state.draft = ta.value; updWc();
      localStorage.setItem('yc_essay_draft_' + state.tab + ':' + q.id, ta.value);
    };
    function setMode(isPaper){
      state.paperMode = isPaper;
      localStorage.setItem('yc_paper_mode', isPaper?'paper':'plain');
      if(isPaper){
        // 切到稿纸模式时，把已有内容统一转成全角，保证格线对齐
        var c = toGrid(toFullwidth(ta.value));
        if(c !== ta.value){
          var p = ta.selectionStart;
          ta.value = c;
          try{ ta.setSelectionRange(p,p); }catch(e){}
        }
      }
      ta.classList.toggle('plain', !isPaper);
      document.getElementById('segPaper').classList.toggle('on', isPaper);
      document.getElementById('segPlain').classList.toggle('on', !isPaper);
      paperHint.style.display = isPaper ? '' : 'none';
      if(isPaper) setTimeout(layoutPaper,30);
    }
    document.getElementById('segPaper').onclick = function(){ setMode(true); };
    document.getElementById('segPlain').onclick = function(){ setMode(false); };
    document.getElementById('backList').onclick = function(){ state.cur = null; state.review = null; state.aiReview = null; render(); window.scrollTo(0,0); };
    var matOpen = true;

    document.getElementById('submitBtn').onclick = function(){
      var answer = ta.value.trim();
      if(countChars(answer) < 10){ alert('作答太短啦，先认真写一写再交卷～'); return; }
      var g = grade(q, answer);
      state.review = g;
      state.history[state.tab + ':' + q.id] = state.history[state.tab + ':' + q.id] || [];
      state.history[state.tab + ':' + q.id].push({at: new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}), total:g.total, full:g.full, mode:'考试标准'});
      if(state.history[state.tab + ':' + q.id].length > 20) state.history[state.tab + ':' + q.id].shift();
      saveHistory();
      renderReview(q, g, answer);
      document.getElementById('reviewBox').scrollIntoView({behavior:'smooth'});
    };
    document.getElementById('aiBtn').onclick = function(){
      var answer = ta.value.trim();
      if(countChars(answer) < 10){ alert('先写一段作答，再点 AI 深度批阅～'); return; }
      deepReview(q, answer, this);
    };
    if(state.review) renderReview(q, state.review, state.draft);
    if(state.aiReview) renderAiBox(state.aiReview);
  }

  // ===== 深度批阅：网页端直接出结果（内置引擎 + 可选在线大模型）=====
  function deepReview(q, answer, btn){
    var g = state.review || grade(q, answer);
    state.review = g;
    var oldText = btn.textContent;
    btn.disabled = true; btn.textContent = '批阅中…';

    var finish = function(detail, src){
      btn.disabled = false; btn.textContent = oldText;
      state.aiReview = {text:detail, src:src, at:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
      renderAiBox(state.aiReview);
      var box = document.getElementById('aiBox');
      if(box) box.scrollIntoView({behavior:'smooth'});
      // 批阅记录里也记一笔 AI 判分，便于回看区分
      var g2 = state.review || grade(q, answer);
      state.history[state.tab + ':' + q.id] = state.history[state.tab + ':' + q.id] || [];
      state.history[state.tab + ':' + q.id].push({at: state.aiReview.at, total:g2.total, full:g2.full, mode:'AI判分'});
      if(state.history[state.tab + ':' + q.id].length > 20) state.history[state.tab + ':' + q.id].shift();
      saveHistory();
    };

    // 有本机配置的在线大模型 → 用真·AI；否则用内置引擎（无需联网）
    var cfg = state.aiCfg;
    if(cfg && cfg.url && cfg.key){
      btn.textContent = 'AI 批阅中…';
      callOnlineAi(cfg, buildAiPrompt(q, answer, g), function(text){
        finish(text, '在线大模型 · ' + (cfg.model||'deepseek-chat'));
      }, function(err){
        finish(localDeepReview(q, answer, g) + '\n\n（在线模型未成功：' + err + '，已用内置阅卷引擎批阅）', '内置智能阅卷引擎');
      });
    } else {
      setTimeout(function(){ finish(localDeepReview(q, answer, g), '内置智能阅卷引擎'); }, 420);
    }
  }

  function callOnlineAi(cfg, prompt, ok, fail){
    var done = false;
    var timer = setTimeout(function(){ if(!done){done=true; fail('超时');} }, 60000);
    try{
      fetch(cfg.url, {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer ' + cfg.key},
        body:JSON.stringify({model:cfg.model||'deepseek-chat', messages:[{role:'user',content:prompt}], temperature:0.2, stream:false})
      }).then(function(r){ return r.json(); }).then(function(d){
        if(done) return; done=true; clearTimeout(timer);
        var text = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
        if(!text && d && d.error){ fail(d.error.message||'接口返回错误'); return; }
        if(!text){ fail('接口未返回内容'); return; }
        ok(text);
      }).catch(function(e){ if(!done){done=true;clearTimeout(timer);fail(e && e.message || '网络错误');} });
    }catch(e){ if(!done){done=true;clearTimeout(timer);fail('调用失败');} }
  }

  function renderAiBox(ai){
    var box = document.getElementById('aiBox');
    if(!box) return;
    var online = /^在线大模型/.test(ai.src);
    var html = '<div class="card fade" style="margin-top:12px;padding:18px;border-color:#7C3AED44;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">';
    html += '<p style="margin:0;font-size:15px;font-weight:800;">✦ AI 深度批阅 · 逐句点评 <span class="tag" style="background:#7C3AED;color:#fff;">判分方式② AI 判分</span></p>';
    html += '<span class="ai-badge">' + esc(ai.src) + '</span></div>';
    html += '<p style="margin:6px 0 0;font-size:11px;color:#B9A98F;">' + esc(ai.at||'') + ' · ' + (online?'由在线大模型生成':'由内置阅卷引擎按考试采分点标准生成') + '</p>';
    html += '<pre class="prompt" style="margin-top:12px;line-height:2;font-size:13px;">' + esc(ai.text) + '</pre>';
    html += '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">';
    html += '<button id="aiCopy" class="btn-primary" style="flex:1;">复制点评</button>';
    html += '<button id="aiCfgBtn" class="btn-ghost">⚙ 设置在线AI（可选）</button>';
    html += '</div></div>';
    box.innerHTML = html;
    document.getElementById('aiCopy').onclick = function(){
      var done = function(){ this.textContent='已复制 ✓'; }.bind(this);
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ai.text).then(done).catch(function(){ fallbackCopy(ai.text); done(); }); }
      else { fallbackCopy(ai.text); done(); }
    };
    document.getElementById('aiCfgBtn').onclick = showAiConfig;
  }

  function showAiConfig(){
    var c = state.aiCfg || {url:'https://api.deepseek.com/v1/chat/completions', model:'deepseek-chat', key:''};
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = '<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;">'
      + '<p style="margin:0;font-size:16px;font-weight:800;">设置在线 AI（可选）</p>'
      + '<button id="cClose" style="background:none;border:none;cursor:pointer;color:#8A8378;"><span class="material-icons">✕</span></button></div>'
      + '<p style="font-size:12px;line-height:1.8;color:#6B6558;margin:10px 0;">不填也能用：默认由内置阅卷引擎按考试采分点标准批阅。想用真·大模型逐句点评，填入 OpenAI 兼容接口信息，密钥仅保存在你本机浏览器，不会上传。</p>'
      + '<label style="font-size:12px;color:#6B6558;">接口地址</label><input id="cUrl" class="ans" style="min-height:auto;height:40px;font-size:13px;margin-top:4px;" value="' + esc(c.url) + '">'
      + '<label style="font-size:12px;color:#6B6558;display:block;margin-top:10px;">模型名</label><input id="cModel" class="ans" style="min-height:auto;height:40px;font-size:13px;margin-top:4px;" value="' + esc(c.model||'') + '" placeholder="deepseek-chat">'
      + '<label style="font-size:12px;color:#6B6558;display:block;margin-top:10px;">API Key</label><input id="cKey" type="password" class="ans" style="min-height:auto;height:40px;font-size:13px;margin-top:4px;" value="' + esc(c.key||'') + '" placeholder="sk-...">'
      + '<div style="margin-top:16px;display:flex;gap:10px;"><button id="cClear" class="btn-ghost" style="flex:1;">清除</button><button id="cSave" class="btn-primary" style="flex:1;">保存</button></div></div>';
    document.body.appendChild(mask);
    mask.querySelector('#cClose').onclick = function(){ mask.remove(); };
    mask.onclick = function(e){ if(e.target===mask) mask.remove(); };
    mask.querySelector('#cClear').onclick = function(){
      state.aiCfg = null; localStorage.removeItem('yc_ai_cfg'); mask.remove();
    };
    mask.querySelector('#cSave').onclick = function(){
      state.aiCfg = {
        url: mask.querySelector('#cUrl').value.trim(),
        model: mask.querySelector('#cModel').value.trim() || 'deepseek-chat',
        key: mask.querySelector('#cKey').value.trim()
      };
      localStorage.setItem('yc_ai_cfg', JSON.stringify(state.aiCfg));
      mask.remove();
      alert('已保存。再次点「AI 深度批阅」即按新设置批阅。');
    };
  }

  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    ta.remove();
  }

  if(!SHL.length && !ZY.length){
    document.getElementById('loading').textContent = '题库暂时没有内容，请稍后再试。';
  } else {
    render();
  }
})();
</script>
</body>
</html>
